<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>镜中世界 · 线上画廊</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:#0a1a10;color:#e0e0e0;line-height:1.7;overflow-x:hidden}
:root{--klein:#002fa7;--green:#0d2818;--gold:#c9a84c}
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-track{background:#0a1a10}
::-webkit-scrollbar-thumb{background:var(--klein);border-radius:3px}

/* 导航 */
.navbar{position:fixed;top:0;left:0;right:0;height:64px;background:rgba(13,40,24,0.95);backdrop-filter:blur(14px);display:flex;align-items:center;justify-content:space-between;padding:0 32px;z-index:900;border-bottom:1px solid rgba(255,255,255,0.06)}
.nav-brand{font-size:22px;font-weight:700;letter-spacing:4px;color:#fff;cursor:pointer;display:flex;align-items:center;gap:10px}
.nav-brand svg{width:28px;height:28px}
.nav-links{display:flex;align-items:center;gap:18px}
.nav-links a{color:rgba(255,255,255,0.7);text-decoration:none;font-size:14px;transition:.3s;padding:6px 14px;border-radius:20px}
.nav-links a:hover{color:#fff;background:rgba(255,255,255,0.06)}
.nav-admin{background:var(--klein)!important;color:#fff!important;padding:6px 20px!important;border-radius:30px!important}

/* Hero */
.hero{height:70vh;min-height:420px;background:linear-gradient(160deg,#0a1a10 0%,#001633 50%,#0a1a10 100%);display:flex;align-items:center;justify-content:center;text-align:center;padding-top:64px}
.hero h1{font-size:68px;letter-spacing:12px;color:#fff;margin-bottom:16px;text-shadow:0 4px 40px rgba(0,47,167,0.3)}
.hero p{font-size:18px;color:rgba(255,255,255,0.55);max-width:520px;margin:0 auto}
.hero .curator{color:var(--gold);font-size:15px;letter-spacing:3px;margin-top:12px}

/* 展览区 */
.section{max-width:1200px;margin:0 auto;padding:80px 24px}
.section-title{font-size:32px;letter-spacing:4px;color:#fff;margin-bottom:44px;text-align:center}
.section-title::after{content:'';display:block;width:50px;height:2px;background:var(--klein);margin:14px auto 0}

/* 展览卡片网格 */
.exhibition-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:28px}
.exhibition-card{background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);border-radius:18px;padding:32px 28px;cursor:pointer;transition:.4s;position:relative;overflow:hidden}
.exhibition-card:hover{border-color:var(--klein);transform:translateY(-6px);background:rgba(255,255,255,0.07)}
.exhibition-card h3{font-size:22px;color:#fff;margin-bottom:8px;letter-spacing:1px}
.exhibition-card .tags{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.exhibition-card .tag{background:rgba(0,47,167,0.2);color:#8ab4ff;padding:2px 12px;border-radius:20px;font-size:11px}
.exhibition-card p{color:rgba(255,255,255,0.45);font-size:14px;line-height:1.8}
.exhibition-card .enter-hint{color:var(--klein);font-size:13px;margin-top:16px;opacity:0;transition:.4s}
.exhibition-card:hover .enter-hint{opacity:1}

/* 专栏 */
.column-article{background:rgba(255,255,255,0.035);border:1px solid rgba(255,255,255,0.07);border-radius:16px;padding:28px 30px;margin-bottom:20px}
.column-article h3{font-size:20px;color:#fff;margin-bottom:4px}
.column-article .date{color:rgba(255,255,255,0.3);font-size:13px;margin-bottom:10px}
.column-article .body{color:rgba(255,255,255,0.5);font-size:14px;line-height:1.9;white-space:pre-wrap}

/* 策展人 */
.curator-section{margin-bottom:80px}
.curator-block{display:flex;gap:40px;align-items:flex-start;margin-bottom:60px;padding:40px;background:rgba(255,255,255,0.02);border-radius:20px;border:1px solid rgba(255,255,255,0.05)}
.curator-block:nth-child(even){flex-direction:row-reverse}
.curator-photo{width:42%;aspect-ratio:3/4;object-fit:cover;border-radius:16px;background:#111;flex-shrink:0;box-shadow:0 20px 60px rgba(0,0,0,0.5),0 0 40px rgba(0,47,167,0.15),inset 0 0 60px rgba(0,0,0,0.4)}
.curator-info{flex:1;display:flex;flex-direction:column;justify-content:center}
.curator-info .index-num{color:var(--klein);font-size:13px;letter-spacing:3px;margin-bottom:8px}
.curator-info h2{font-size:42px;color:#fff;margin-bottom:6px;letter-spacing:2px}
.curator-info .role{color:var(--gold);font-size:15px;letter-spacing:2px;margin-bottom:16px}
.curator-info .divider{width:40px;height:2px;background:var(--klein);margin-bottom:20px}
.curator-info .bio{color:rgba(255,255,255,0.55);font-size:15px;line-height:1.9;white-space:pre-wrap}
.curator-info .contact{color:var(--gold);font-size:14px;margin-top:16px}

/* 页脚 */
.footer{text-align:center;padding:40px 24px;color:rgba(255,255,255,0.2);font-size:13px;border-top:1px solid rgba(255,255,255,0.04)}

/* ===== 展览详情页 ===== */
.detail-page{display:none;min-height:100vh;padding-top:64px}
.detail-back{padding:24px 32px 0;max-width:1200px;margin:0 auto}
.detail-back a{color:rgba(255,255,255,0.5);text-decoration:none;font-size:14px;cursor:pointer;transition:.3s}
.detail-back a:hover{color:#fff}
.detail-header{padding:40px 32px 20px;max-width:1200px;margin:0 auto}
.detail-header h1{font-size:38px;color:#fff;letter-spacing:3px;margin-bottom:8px}
.detail-header .statement{color:rgba(255,255,255,0.5);font-size:15px;line-height:1.9;max-width:800px}

/* 组照区块 */
.group-section{margin-bottom:50px;padding:0 32px;max-width:1200px;margin-left:auto;margin-right:auto}
.group-header{margin-bottom:20px}
.group-header h3{font-size:22px;color:#fff;margin-bottom:4px}
.group-header p{color:rgba(255,255,255,0.4);font-size:14px;line-height:1.8}

/* 展板 + 灯光阴影 */
.artwork-board{background:rgba(255,255,255,0.03);border-radius:16px;padding:20px;margin-bottom:24px;border:1px solid rgba(255,255,255,0.06);box-shadow:0 12px 40px rgba(0,0,0,0.4),0 4px 12px rgba(0,0,0,0.3),inset 0 1px 0 rgba(255,255,255,0.05);transition:.4s;position:relative}
.artwork-board::before{content:'';position:absolute;top:0;left:20px;right:20px;height:4px;background:var(--klein);border-radius:2px;opacity:0.7}
.artwork-board:hover{transform:translateY(-4px);box-shadow:0 20px 60px rgba(0,0,0,0.5),0 0 30px rgba(0,47,167,0.2),inset 0 1px 0 rgba(255,255,255,0.08)}
.artwork-board img{width:100%;border-radius:10px;display:block;background:#111}
.artwork-board .info{padding:14px 4px 4px}
.artwork-board .info h4{font-size:15px;color:#fff;margin-bottom:2px}
.artwork-board .info p{font-size:12px;color:rgba(255,255,255,0.4)}

.detail-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:24px;padding:20px 0 60px;max-width:1200px;margin:0 auto}

/* ===== 后台 ===== */
.admin-page{display:none;min-height:100vh;padding-top:64px;background:#0a1510}
.admin-topbar{position:fixed;top:64px;left:0;right:0;height:48px;background:rgba(10,21,16,0.95);backdrop-filter:blur(10px);display:flex;align-items:center;justify-content:space-between;padding:0 32px;z-index:850;border-bottom:1px solid rgba(255,255,255,0.04)}
.admin-topbar .admin-title{color:rgba(255,255,255,0.5);font-size:13px;letter-spacing:2px}
.admin-topbar .admin-user{color:rgba(255,255,255,0.4);font-size:13px}
.admin-topbar .admin-logout{color:#ff6b6b;font-size:13px;cursor:pointer;padding:4px 12px;border-radius:16px;transition:.3s}
.admin-topbar .admin-logout:hover{background:rgba(255,107,107,0.1)}

.admin-container{display:flex;min-height:calc(100vh - 64px);margin-top:48px}
.admin-sidebar{width:210px;background:rgba(0,0,0,0.3);padding:20px 0;border-right:1px solid rgba(255,255,255,0.05);flex-shrink:0;overflow-y:auto}
.admin-sidebar a{display:block;padding:10px 24px;color:rgba(255,255,255,0.5);text-decoration:none;font-size:14px;transition:.3s;cursor:pointer;border-left:3px solid transparent}
.admin-sidebar a:hover{color:#fff;background:rgba(255,255,255,0.03)}
.admin-sidebar a.active{color:#fff;background:rgba(0,47,167,0.15);border-left-color:var(--klein)}
.admin-sidebar .sub-item{padding-left:40px;font-size:13px}
.admin-sidebar .logout-item{color:#ff6b6b!important;margin-top:20px;border-top:1px solid rgba(255,255,255,0.05);padding-top:14px}

.admin-main{flex:1;padding:32px 40px;overflow-y:auto}
.admin-main h2{font-size:24px;color:#fff;margin-bottom:24px;letter-spacing:2px}
.admin-form label{display:block;color:rgba(255,255,255,0.6);margin:14px 0 4px;font-size:13px}
.admin-form input,.admin-form textarea,.admin-form select{width:100%;padding:10px 14px;border:1px solid rgba(255,255,255,0.12);border-radius:10px;background:rgba(255,255,255,0.04);color:#fff;font-size:14px;outline:none;transition:.3s}
.admin-form input:focus,.admin-form textarea:focus{border-color:var(--klein)}
.admin-form textarea{min-height:100px;resize:vertical}
.btn{background:var(--klein);color:#fff;border:none;padding:10px 28px;border-radius:30px;cursor:pointer;font-size:14px;transition:.3s;margin-top:12px}
.btn:hover{background:#003bb5;transform:translateY(-1px)}
.btn-danger{background:#a83232;color:#fff;border:none;padding:6px 14px;border-radius:20px;cursor:pointer;font-size:12px;transition:.3s}
.btn-danger:hover{background:#c73e3e}
.btn-small{padding:5px 14px;font-size:12px;border-radius:20px;margin-top:0}
.admin-list-item{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid rgba(255,255,255,0.04)}
.admin-list-item span{color:rgba(255,255,255,0.6);font-size:14px}
.admin-empty{color:rgba(255,255,255,0.2);text-align:center;padding:40px 0;font-size:14px}
.toast{position:fixed;bottom:40px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.85);color:#fff;padding:12px 28px;border-radius:30px;font-size:14px;z-index:9999;opacity:0;transition:.4s;pointer-events:none}
.toast.show{opacity:1}

/* 登录弹窗 */
.login-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.82);backdrop-filter:blur(8px);z-index:5000;display:none;align-items:center;justify-content:center}
.login-card{background:#141e18;border:1px solid rgba(255,255,255,0.1);border-radius:20px;padding:40px 36px;width:340px;text-align:center}
.login-card h2{color:#fff;font-size:24px;letter-spacing:3px;margin-bottom:20px}
.login-card input{width:100%;padding:12px 16px;margin-bottom:14px;border:1px solid rgba(255,255,255,0.15);border-radius:10px;background:rgba(255,255,255,0.06);color:#fff;font-size:15px;outline:none}
.login-card input:focus{border-color:var(--klein)}
.login-card button{width:100%;padding:12px;border:none;border-radius:10px;background:var(--klein);color:#fff;font-size:16px;font-weight:600;cursor:pointer;transition:.3s}
.login-card button:hover{background:#003bb5}
.login-card .error{color:#ff6b6b;font-size:13px;margin-top:12px;min-height:20px}

/* 颜色选择器 */
.color-picker-row{display:flex;gap:10px;flex-wrap:wrap;margin:8px 0 16px}
.color-swatch{width:36px;height:36px;border-radius:50%;cursor:pointer;border:2px solid rgba(255,255,255,0.15);transition:.3s}
.color-swatch:hover{border-color:#fff;transform:scale(1.1)}
.color-swatch.active{border-color:var(--gold);transform:scale(1.15)}
.color-custom{width:36px;height:36px;border-radius:50%;cursor:pointer;border:2px dashed rgba(255,255,255,0.3);display:flex;align-items:center;justify-content:center;font-size:16px;color:rgba(255,255,255,0.4)}

/* 字体卡片 */
.font-card{background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);border-radius:12px;padding:16px 20px;margin-bottom:10px;cursor:pointer;transition:.3s;display:flex;justify-content:space-between;align-items:center}
.font-card:hover{border-color:rgba(0,47,167,0.5)}
.font-card.active{border-color:var(--klein);background:rgba(0,47,167,0.1)}
.font-card .font-name{color:#fff;font-size:15px}
.font-card .font-preview{color:rgba(255,255,255,0.4);font-size:13px;margin-top:4px}
.font-card .font-tag{font-size:11px;color:rgba(255,255,255,0.3);background:rgba(255,255,255,0.06);padding:2px 8px;border-radius:10px}

/* 上传区 */
.upload-zone{border:2px dashed rgba(255,255,255,0.15);border-radius:14px;padding:40px;text-align:center;cursor:pointer;transition:.3s;margin:12px 0}
.upload-zone:hover{border-color:var(--klein);background:rgba(0,47,167,0.05)}
.upload-zone.dragover{border-color:var(--gold);background:rgba(201,168,76,0.05)}
.upload-zone p{color:rgba(255,255,255,0.4);font-size:14px}
.upload-zone .upload-icon{font-size:36px;margin-bottom:10px}

/* 进度条 */
.progress-bar{width:100%;height:6px;background:rgba(255,255,255,0.08);border-radius:3px;overflow:hidden;margin:10px 0}
.progress-bar .progress-fill{height:100%;background:var(--klein);border-radius:3px;transition:width .3s}

/* 组照管理 */
.group-manage-item{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06);border-radius:14px;padding:20px 24px;margin-bottom:16px}
.group-manage-item .group-title-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.group-manage-item .group-title-row h4{color:#fff;font-size:16px}
.group-manage-item .group-actions{display:flex;gap:8px;align-items:center}
.group-manage-item .photo-count{color:rgba(255,255,255,0.35);font-size:12px}

/* 展览样式面板 */
.ex-style-panel{background:rgba(255,255,255,0.025);border:1px solid rgba(255,255,255,0.06);border-radius:16px;padding:28px 32px;margin-bottom:24px}
.ex-style-panel .ex-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.ex-style-panel .ex-header h3{color:#fff;font-size:18px}
.ex-style-panel .preview-area{background:rgba(0,0,0,0.2);border-radius:10px;padding:20px;margin:16px 0}

/* 策展人管理 */
.curator-edit-panel{background:rgba(255,255,255,0.025);border:1px solid rgba(255,255,255,0.06);border-radius:16px;padding:28px 32px;margin-bottom:24px}
.curator-edit-panel .ce-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.curator-edit-panel .ce-header h4{color:#fff;font-size:16px}
.curator-photo-upload{display:flex;gap:20px;align-items:flex-start}
.curator-photo-preview{width:120px;height:150px;object-fit:cover;border-radius:12px;background:#111;flex-shrink:0}
.curator-photo-placeholder{width:120px;height:150px;border-radius:12px;background:rgba(255,255,255,0.05);display:flex;align-items:center;justify-content:center;font-size:32px;color:rgba(255,255,255,0.2);flex-shrink:0}
.curator-form{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.curator-form .full{grid-column:1/-1}

/* 新增策展人高亮 */
.curator-add-panel{background:rgba(0,47,167,0.06);border:1px solid rgba(0,47,167,0.2);border-radius:16px;padding:28px 32px;margin-bottom:24px}

/* 面包屑 */
.breadcrumb{color:rgba(255,255,255,0.3);font-size:13px;margin-bottom:16px}
.breadcrumb a{color:rgba(255,255,255,0.5);cursor:pointer;text-decoration:none}
.breadcrumb a:hover{color:#fff}

/* 保存栏 */
.save-bar{position:sticky;bottom:0;background:rgba(10,21,16,0.95);backdrop-filter:blur(10px);padding:12px 0;border-top:1px solid rgba(255,255,255,0.06);margin-top:24px;display:flex;justify-content:flex-end;gap:10px}

/* 灯箱 */
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,0.92);z-index:3000;display:none;align-items:center;justify-content:center;backdrop-filter:blur(4px)}
.lightbox.active{display:flex}
.lightbox img{max-width:90vw;max-height:85vh;object-fit:contain;border-radius:8px;box-shadow:0 0 60px rgba(0,0,0,0.6)}
.lightbox .lb-close{position:absolute;top:24px;right:32px;font-size:32px;color:rgba(255,255,255,0.5);cursor:pointer;transition:.3s;background:none;border:none}
.lightbox .lb-close:hover{color:#fff}
.lightbox .lb-prev,.lightbox .lb-next{position:absolute;top:50%;transform:translateY(-50%);font-size:36px;color:rgba(255,255,255,0.4);cursor:pointer;transition:.3s;background:none;border:none;padding:10px 16px}
.lightbox .lb-prev{left:24px}
.lightbox .lb-next{right:24px}
.lightbox .lb-prev:hover,.lightbox .lb-next:hover{color:#fff;background:rgba(255,255,255,0.06);border-radius:8px}
.lightbox .lb-counter{position:absolute;bottom:24px;left:50%;transform:translateX(-50%);color:rgba(255,255,255,0.4);font-size:14px}

/* 响应式 */
@media(max-width:768px){
  .hero h1{font-size:40px;letter-spacing:6px}
  .exhibition-grid{grid-template-columns:1fr}
  .detail-grid{grid-template-columns:1fr}
  .admin-sidebar{width:140px}
  .admin-sidebar a{padding:10px 16px;font-size:13px}
  .admin-main{padding:20px}
  .curator-block{flex-direction:column!important;padding:24px}
  .curator-photo{width:100%;max-width:280px}
  .curator-info h2{font-size:28px}
  .curator-form{grid-template-columns:1fr}
}
</style>
</head>
<body>

<!-- 导航 -->
<nav class="navbar">
  <div class="nav-brand" onclick="showHome()">
    <svg viewBox="0 0 40 40" fill="none"><circle cx="20" cy="20" r="16" stroke="currentColor" stroke-width="1.5"/><circle cx="20" cy="20" r="10" stroke="currentColor" stroke-width="1.2"/><circle cx="29" cy="11" r="3" fill="currentColor" opacity="0.6"/></svg>
    镜中世界
  </div>
  <div class="nav-links">
    <a href="#" onclick="document.getElementById('exhibitions').scrollIntoView({behavior:'smooth'})">展览</a>
    <a href="#" onclick="document.getElementById('columns').scrollIntoView({behavior:'smooth'})">专栏</a>
    <a href="#" onclick="document.getElementById('curator').scrollIntoView({behavior:'smooth'})">策展人</a>
    <a href="#" class="nav-admin" onclick="openLogin()">⚙ 管理</a>
  </div>
</nav>

<!-- 登录弹窗 -->
<div class="login-overlay" id="loginOverlay">
  <div class="login-card">
    <h2>🔐 内部管理</h2>
    <input type="text" id="loginUser" placeholder="账号" value="海屿">
    <input type="password" id="loginPass" placeholder="密码">
    <button onclick="handleLogin()">验证身份</button>
    <div class="error" id="loginError"></div>
  </div>
</div>

<!-- ===== 首页 ===== -->
<div id="homePage">
<section class="hero">
  <div>
    <h1>镜中世界</h1>
    <p>摄影是现实的一面透镜，也是通往另一个世界的窗口。</p>
    <div class="curator">策展人：张昊文</div>
  </div>
</section>

<section class="section" id="exhibitions">
  <h2 class="section-title">展览</h2>
  <div class="exhibition-grid" id="exhibitionGrid"></div>
</section>

<section class="section" id="columns">
  <h2 class="section-title">文字专栏</h2>
  <div id="columnList"></div>
</section>

<section class="section" id="curator">
  <h2 class="section-title">策展人</h2>
  <div id="curatorList"></div>
</section>

<footer class="footer">© 2026 镜中世界 · 线上画廊 &nbsp;|&nbsp; 策展人：张昊文</footer>
</div>

<!-- ===== 展览详情页 ===== -->
<div class="detail-page" id="detailPage">
  <div class="detail-back"><a onclick="showHome()">← 返回首页</a></div>
  <div class="detail-header" id="detailHeader"></div>
  <div id="detailContent"></div>
</div>

<!-- ===== 后台管理页 ===== -->
<div class="admin-page" id="adminPage">
  <div class="admin-topbar">
    <div class="admin-title">⚙ 内部管理</div>
    <div style="display:flex;align-items:center;gap:16px">
      <span class="admin-user" id="adminUserLabel"></span>
      <span class="admin-logout" onclick="confirmLogout()">🚪 退出登录</span>
    </div>
  </div>
  <div class="admin-container">
    <div class="admin-sidebar" id="adminSidebar"></div>
    <div class="admin-main" id="adminMain"></div>
  </div>
</div>

<!-- 灯箱 -->
<div class="lightbox" id="lightbox">
  <button class="lb-close" onclick="closeLightbox()">×</button>
  <button class="lb-prev" onclick="lbPrev()">❮</button>
  <img id="lbImg" src="" alt="">
  <button class="lb-next" onclick="lbNext()">❯</button>
  <div class="lb-counter" id="lbCounter"></div>
</div>

<div class="toast" id="toast"></div>

<script>
// ============ 常量 & 默认数据 ============

const defaultData = {
  exhibitions: [
    { id:'ex0', title:'2025夏天的颜色', tags:['摄影·年度特展'], statement:'银盐的颗粒感与数字像素的冷冽在此交织。2025年的夏天，我们试图用镜头捕捉那些即将消逝的色彩——褪色的广告牌、夕照下的塑料花、地铁站里陌生人的瞳孔。摄影史告诉我们，每一次对色彩的记录，都是一次对时间的挽留。', artworks:[], groups:[], style:{boardColor:'',titleFont:'',bodyFont:''} },
    { id:'ex1', title:'2026夏天的颜色', tags:['摄影·年度特展'], statement:'当克莱因蓝遇见深绿，当胶片质感碰撞算法美学。2026年的夏天，色彩不再只是视觉经验，而成为了一种哲学追问。正如伊夫·克莱因所言："蓝色是没有维度的，它超越了维度。"', artworks:[], groups:[], style:{boardColor:'',titleFont:'',bodyFont:''} },
    { id:'ex2', title:'快乐之家', tags:['纪实·长期项目'], statement:'从维多利亚时代的家庭肖像到荒木经惟的私写真，家庭摄影始终在真实与表演之间摇摆。"快乐之家"试图在这个张力中寻找一条属于自己的道路——那些看似平凡的日常瞬间，或许才是摄影最动人的力量。', artworks:[], groups:[], style:{boardColor:'',titleFont:'',bodyFont:''} },
    { id:'ex3', title:'风光与星空', tags:['风景摄影·自然纪实'], statement:'从19世纪探险摄影师卡尔顿·沃特金斯穿越内华达山脉的玻璃底片，到安塞尔·亚当斯的月升时分，再到当代星空摄影师的银河长曝——人类对大地与星空的仰望从未改变。', artworks:[], groups:[], style:{boardColor:'',titleFont:'',bodyFont:''} }
  ],
  columns: [
    { id:'c0', title:'镜面与凝视：摄影的本质追问', date:'2026-03-15', body:'摄影是什么？\n\n是现实的镜像，还是观看的权力？苏珊·桑塔格在《论摄影》中写道："收集照片就是收集世界。"每一张照片都是一次切割，将流动的时间凝固成永恒的碎片。\n\n当我们举起相机，我们既是在记录，也是在创造。镜头前的世界经过取景框的筛选，已经不再是原本的模样。这就是摄影最迷人的悖论——它既忠实于现实，又不可避免地扭曲现实。' },

  ]
};

// ============ 初始化 ============
if(!localStorage.getItem(ACCOUNT_KEY)) localStorage.setItem(ACCOUNT_KEY,JSON.stringify(defaultAccount));
if(!localStorage.getItem(THEME_KEY)) localStorage.setItem(THEME_KEY,JSON.stringify(defaultTheme));

async function loadRemoteData() {
  try {
    const resp = await fetch('./data.json?_=' + Date.now());
    if(!resp.ok) throw 0;
    const d = await resp.json();
    localStorage.setItem(STORAGE_KEY, JSON.stringify(d));
    return true;
  } catch(e) { return false; }
}
async function loadRemoteTheme() {
  try {
    const resp = await fetch('./theme.json?_=' + Date.now());
    if(!resp.ok) throw 0;
    const t = await resp.json();
    localStorage.setItem(THEME_KEY, JSON.stringify(t));
    return true;
  } catch(e) { return false; }
}

function getData(){try{return JSON.parse(localStorage.getItem(STORAGE_KEY))||defaultData}catch(e){return defaultData}}
function saveData(d){localStorage.setItem(STORAGE_KEY,JSON.stringify(d))}
function getTheme(){try{return JSON.parse(localStorage.getItem(THEME_KEY))||defaultTheme}catch(e){return defaultTheme}}
function saveTheme(t){localStorage.setItem(THEME_KEY,JSON.stringify(t))}

// 兼容旧数据
function normalizeData(d){
  d.exhibitions.forEach(ex=>{
    if(!ex.groups) ex.groups = [];
    if(!ex.style) ex.style = {boardColor:'',titleFont:'',bodyFont:''};
    // 旧版 artworks 迁移
    if(ex.artworks && ex.artworks.length && (!ex.groups || !ex.groups.length)){
      ex.groups.push({id:'g'+Date.now(),title:'默认组照',desc:'',boardColor:'',photos:ex.artworks.map(a=>({title:a.title||'',desc:a.desc||'',image:a.image||a.src||''}))});
    }
    if(ex.artworks) ex.artworks = [];
  });
  if(!d.curators) d.curators = [];
  return d;
}

(async ()=>{
  await loadRemoteTheme();
  await loadRemoteData();
  let d = getData();
  d = normalizeData(d);
  saveData(d);
  applyTheme();
  renderHome();
})();

// ============ 主题应用 ============
function applyTheme(){
  const t = getTheme();
  const body = document.body;
  if(t.background.type==='color'){
    body.style.background = t.background.value;
    body.style.backgroundImage = 'none';
  } else if(t.background.type==='image' && t.background.value){
    body.style.backgroundImage = `linear-gradient(rgba(0,0,0,${t.background.overlay/100}),rgba(0,0,0,${t.background.overlay/100})),url(${t.background.value})`;
    body.style.backgroundSize = 'cover';
    body.style.backgroundAttachment = 'fixed';
  }
  // 字体
  if(t.fonts.title) document.documentElement.style.setProperty('--font-title', t.fonts.title);
  if(t.fonts.body) document.documentElement.style.setProperty('--font-body', t.fonts.body);
  if(t.fonts.curator) document.documentElement.style.setProperty('--font-curator', t.fonts.curator);
  // 自定义字体注入
  if(t.customFonts && t.customFonts.length){
    let styleEl = document.getElementById('customFontsStyle');
    if(!styleEl){styleEl=document.createElement('style');styleEl.id='customFontsStyle';document.head.appendChild(styleEl)}
    styleEl.textContent = t.customFonts.map(f=>{
      const fmt = f.format || 'truetype';
      return `@font-face{font-family:"${f.name}";src:url(${f.data});font-display:swap;}`;
    }).join('\n');
  }
}

// ============ 首页渲染 ============
function renderHome(){
  const data = getData();
  const theme = getTheme();

  // 展览卡片
  document.getElementById('exhibitionGrid').innerHTML = data.exhibitions.map((ex,i)=>{
    const totalPhotos = (ex.groups||[]).reduce((s,g)=>s+(g.photos?g.photos.length:0),0);
    return `
    <div class="exhibition-card" onclick="showDetail('${ex.id}')">
      <div class="tags">${ex.tags.map(t=>`<span class="tag">${t}</span>`).join('')}</div>
      <h3>${ex.title}</h3>
      <p>${ex.statement.slice(0,100)}${ex.statement.length>100?'...':''}</p>
      <div style="color:rgba(255,255,255,0.3);font-size:12px;margin-top:8px">${(ex.groups||[]).length} 组作品 · ${totalPhotos} 张照片</div>
      <div class="enter-hint">点击进入展览 →</div>
    </div>`;
  }).join('');

  // 专栏
  document.getElementById('columnList').innerHTML = data.columns.length ? data.columns.map(c=>`
    <div class="column-article">
      <h3>${c.title}</h3>
      <div class="date">${c.date}</div>
      <div class="body">${c.body.replace(/\n/g,'<br>')}</div>
    </div>`).join('') : '<div class="admin-empty">暂无专栏文章</div>';

  // 策展人
  const curList = document.getElementById('curatorList');
  if(!data.curators.length){curList.innerHTML='<div class="admin-empty">暂无策展人信息</div>';return}
  curList.innerHTML = data.curators.map((cu,idx)=>{
    const contactMatch = cu.bio.match(/(联系方式[：:]\s*\S+)/);
    const contact = contactMatch ? contactMatch[1] : '';
    const bioMain = contact ? cu.bio.replace(contact,'').trim() : cu.bio;
    return `
    <div class="curator-block">
      ${cu.photo ? `<img class="curator-photo" src="${cu.photo}" alt="${cu.name}">` : `<div class="curator-photo" style="display:flex;align-items:center;justify-content:center;font-size:48px;color:rgba(255,255,255,0.15)">📷</div>`}
      <div class="curator-info">
        <div class="index-num">— 0${idx+1} / 0${data.curators.length} —</div>
        <h2>${cu.name}</h2>
        <div class="role">${cu.role}</div>
        <div class="divider"></div>
        <div class="bio">${bioMain.replace(/\n/g,'<br>')}</div>
        ${contact?`<div class="contact">${contact}</div>`:''}
      </div>
    </div>`;
  }).join('');
}

// ============ 页面切换 ============
function showHome(){
  document.getElementById('homePage').style.display='block';
  document.getElementById('detailPage').style.display='none';
  document.getElementById('adminPage').style.display='none';
}
function showDetail(id){
  const data=getData();
  const ex=data.exhibitions.find(e=>e.id===id);
  if(!ex) return toast('展览不存在');
  document.getElementById('homePage').style.display='none';
  document.getElementById('adminPage').style.display='none';
  document.getElementById('detailPage').style.display='block';
  const theme=getTheme();
  const boardColor = (ex.style&&ex.style.boardColor)||theme.boardColor||'#0d1a14';
  const titleFont = (ex.style&&ex.style.titleFont)||theme.fonts.title||'';
  const bodyFont = (ex.style&&ex.style.bodyFont)||theme.fonts.body||'';
  document.getElementById('detailHeader').innerHTML=`
    <h1 style="${titleFont?`font-family:'${titleFont}'`:''}">${ex.title}</h1>
    <div class="statement" style="${bodyFont?`font-family:'${bodyFont}'`:''}">${ex.statement.replace(/\n/g,'<br>')}</div>
  `;
  let groupsHtml = '';
  (ex.groups||[]).forEach(g=>{
    const gc = g.boardColor || boardColor;
    groupsHtml += `
    <div class="group-section">
      <div class="group-header">
        <h3 style="${titleFont?`font-family:'${titleFont}'`:''}">${g.title}</h3>
        ${g.desc?`<p style="${bodyFont?`font-family:'${bodyFont}'`:''}">${g.desc.replace(/\n/g,'<br>')}</p>`:''}
      </div>
      <div class="detail-grid">
        ${(g.photos||[]).map(p=>`
          <div class="artwork-board" style="background:${gc}" onclick="openLightbox('${p.image}')">
            <img src="${p.image}" alt="${p.title}" loading="lazy">
            <div class="info">
              <h4 style="${titleFont?`font-family:'${titleFont}'`:''}">${p.title||''}</h4>
              <p style="${bodyFont?`font-family:'${bodyFont}'`:''}">${p.desc||''}</p>
            </div>
          </div>
        `).join('')}
      </div>
    </div>`;
  });
  if(!groupsHtml) groupsHtml = '<div class="admin-empty" style="padding:40px 32px">暂无作品</div>';
  document.getElementById('detailContent').innerHTML = groupsHtml;
}

// ============ 登录 ============
function openLogin(){document.getElementById('loginOverlay').style.display='flex';document.getElementById('loginError').textContent=''}
function handleLogin(){
  const u=document.getElementById('loginUser').value.trim();
  const p=document.getElementById('loginPass').value.trim();
  const acc=JSON.parse(localStorage.getItem(ACCOUNT_KEY));
  if(u===acc.username&&p===acc.password){
    sessionStorage.setItem(SESSION_KEY,'true');
    document.getElementById('loginOverlay').style.display='none';
    enterAdmin();
  }else{document.getElementById('loginError').textContent='账号或密码错误'}
}
function enterAdmin(){
  if(!sessionStorage.getItem(SESSION_KEY)){openLogin();return}
  document.getElementById('homePage').style.display='none';
  document.getElementById('detailPage').style.display='none';
  document.getElementById('adminPage').style.display='block';
  document.getElementById('adminUserLabel').textContent='登录身份：'+JSON.parse(localStorage.getItem(ACCOUNT_KEY)).username;
  buildSidebar();
  switchAdmin('dashboard');
}
function confirmLogout(){if(confirm('确定要退出内部管理吗？')){sessionStorage.removeItem(SESSION_KEY);showHome()}}

// ============ 展览样式面板初始化 ============
function initExStylePanel(ex, theme){
  // 颜色选择器
  const colors = ['#0d1a14','#002fa7','#0d2818','#1a0a2e','#2a1a00','#1a0000','#000000','#1a1a2e','#0a2e1a','#2e1a0a'];
  const container = document.getElementById('exBoardColors_'+ex.id);
  if(container){
    const cur = (ex.style&&ex.style.boardColor)||theme.boardColor||'#0d1a14';
    container.innerHTML = colors.map(c=>`<div class="color-swatch ${c===cur?'active':''}" style="background:${c}" onclick="setExBoardColor('${ex.id}','${c}',this)"></div>`).join('')+
      `<label class="color-custom" style="border-style:solid"><input type="color" value="${cur}" onchange="setExBoardColor('${ex.id}',this.value,this)" style="opacity:0;width:100%;height:100%;cursor:pointer"></label>`;
  }
  // 字体下拉
  const titleSel = document.getElementById('exTitleFont_'+ex.id);
  const bodySel = document.getElementById('exBodyFont_'+ex.id);
  if(titleSel){
    const fonts = getAvailableFonts();
    titleSel.innerHTML = fonts.map(f=>`<option value="${f.name}" ${f.name===(ex.style&&ex.style.titleFont)||theme.fonts.title?'selected':''}>${f.name}${f.custom?' (自定义)':''}</option>`).join('');
    bodySel.innerHTML = fonts.map(f=>`<option value="${f.name}" ${f.name===(ex.style&&ex.style.bodyFont)||theme.fonts.body?'selected':''}>${f.name}${f.custom?' (自定义)':''}</option>`).join('');
    titleSel.onchange = ()=>{document.getElementById('exPrevTitle_'+ex.id).style.fontFamily=titleSel.value?`'${titleSel.value}'`:''};
    bodySel.onchange = ()=>{document.getElementById('exPrevBody_'+ex.id).style.fontFamily=bodySel.value?`'${bodySel.value}'`:''};
    // 初始预览
    const tf = (ex.style&&ex.style.titleFont)||theme.fonts.title;
    const bf = (ex.style&&ex.style.bodyFont)||theme.fonts.body;
    if(tf) document.getElementById('exPrevTitle_'+ex.id).style.fontFamily=`'${tf}'`;
    if(bf) document.getElementById('exPrevBody_'+ex.id).style.fontFamily=`'${bf}'`;
  }
}

function getAvailableFonts(){
  const theme=getTheme();
  const builtin=[
    {name:'Noto Serif SC',custom:false},{name:'Noto Sans SC',custom:false},
    {name:'Playfair Display',custom:false},{name:'Cormorant Garamond',custom:false},
    {name:'Inter',custom:false},{name:'Lora',custom:false},
    {name:'DM Serif Display',custom:false},{name:'Source Han Serif SC',custom:false}
  ];
  (theme.customFonts||[]).forEach(f=>builtin.push({name:f.name,custom:true}));
  return builtin;
}

function setExBoardColor(exId, color, el){
  const data=getData();
  const ex=data.exhibitions.find(e=>e.id===exId);
  if(!ex.style) ex.style={};
  ex.style.boardColor=color;
  saveData(data);
  document.querySelectorAll(`#exBoardColors_${exId} .color-swatch`).forEach(s=>s.classList.remove('active'));
  if(el&&el.classList.contains('color-swatch')) el.classList.add('active');
  toast(`已设置 ${ex.title} 背景板颜色`);
}

function saveExStyle(exId){
  const data=getData();
  const ex=data.exhibitions.find(e=>e.id===exId);
  const tf=document.getElementById('exTitleFont_'+exId).value;
  const bf=document.getElementById('exBodyFont_'+exId).value;
  if(!ex.style) ex.style={};
  ex.style.titleFont=tf;ex.style.bodyFont=bf;
  saveData(data);
  applyTheme();
  toast(`✅ ${ex.title} 样式已保存`);
}

// ============ 组照操作（修复删除） ============
function addGroupToEx(exId){
  const title=prompt('组照标题：');
  if(!title||!title.trim()) return;
  const desc=prompt('组照介绍词（可选）：')||'';
  const data=getData();
  const ex=data.exhibitions.find(e=>e.id===exId);
  if(!ex.groups) ex.groups=[];
  ex.groups.push({id:'g'+Date.now(),title:title.trim(),desc:desc,boardColor:(ex.style&&ex.style.boardColor)||getTheme().boardColor||'#0d1a14',photos:[]});
  saveData(data);
  switchAdmin('exhibitions');
  toast('组照已添加');
}

function deleteGroup(exId, groupId){
  const data=getData();
  const ex=data.exhibitions.find(e=>e.id===exId);
  const grp=ex.groups.find(g=>g.id===groupId);
  if(!grp) {toast('组照不存在');return}
  if(!confirm(`确定要删除组照「${grp.title}」及其所有照片吗？`)) return;
  // 正确删除：从 groups 数组中按 id 过滤
  ex.groups = ex.groups.filter(g => g.id !== groupId);
  saveData(data);
  switchAdmin('exhibitions');
  toast('组照已删除');
}

function editGroup(exId, groupId){
  const data=getData();
  const ex=data.exhibitions.find(e=>e.id===exId);
  const grp=ex.groups.find(g=>g.id===groupId);
  if(!grp) {toast('组照不存在');return}
  const newTitle=prompt('修改组照标题：',grp.title);
  if(newTitle!==null&&newTitle.trim()) grp.title=newTitle.trim();
  const newDesc=prompt('修改组照介绍词：',grp.desc||'');
  if(newDesc!==null) grp.desc=newDesc;
  saveData(data);
  switchAdmin('exhibitions');
  toast('组照已更新');
}

function updateGroupBoard(exId, groupId, color){
  const data=getData();
  const ex=data.exhibitions.find(e=>e.id===exId);
  const grp=ex.groups.find(g=>g.id===groupId);
  if(grp) grp.boardColor=color;
  saveData(data);
}

// ============ 上传 ============
function previewUploadFiles(){
  const files=document.getElementById('uploadImgs').files;
  const preview=document.getElementById('uploadPreview');
  if(!files.length){preview.innerHTML='';return}
  let html='<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:8px;margin-top:12px">';
  for(const f of files){html+=`<div style="background:rgba(255,255,255,0.04);border-radius:8px;padding:6px;text-align:center"><div style="font-size:11px;color:rgba(255,255,255,0.5);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${f.name}</div><div style="font-size:10px;color:rgba(255,255,255,0.3)">${(f.size/1024).toFixed(0)}KB</div></div>`}
  preview.innerHTML=html+'</div>';
}

async function doUpload(){
  const exId=document.getElementById('uploadEx').value;
  const groupId=document.getElementById('uploadGroup').value;
  const gTitle=document.getElementById('uploadGroupTitle').value.trim();
  const gDesc=document.getElementById('uploadGroupDesc').value.trim();
  const boardColor=document.getElementById('uploadBoardColor').value;
  const files=document.getElementById('uploadImgs').files;
  if(!files.length){toast('请选择图片');return}
  const data=getData();
  const ex=data.exhibitions.find(e=>e.id===exId);
  if(!ex.groups) ex.groups=[];
  let targetGroup;
  if(groupId){targetGroup=ex.groups.find(g=>g.id===groupId)}
  else{
    if(!gTitle){toast('请输入组照标题');return}
    targetGroup={id:'g'+Date.now(),title:gTitle,desc:gDesc,boardColor:boardColor,photos:[]};
    ex.groups.push(targetGroup);
  }
  const status=document.getElementById('uploadStatus');
  status.textContent=`正在处理 ${files.length} 张图片...`;
  for(let i=0;i<files.length;i++){
    const f=files[i];
    if(f.size>20*1024*1024){status.textContent=`${f.name} 超过20MB，已跳过`;continue}
    const compressed=await compressImage(f,1600,0.82);
    targetGroup.photos.push({title:f.name.replace(/\.[^.]+$/,'')||'未命名',desc:'',image:compressed});
    status.textContent=`已处理 ${i+1}/${files.length}...`;
  }
  saveData(data);
  status.textContent=`✅ 上传完成：${files.length} 张`;
  toast('组照已上传');
  renderHome();

  document.getElementById('uploadImgs').value='';
  document.getElementById('uploadGroupTitle').value='';
  document.getElementById('uploadGroupDesc').value='';
  document.getElementById('uploadPreview').innerHTML='';
}

function compressImage(file,maxDim,quality){
  return new Promise((resolve)=>{
    const r=new FileReader();
    r.onload=e=>{const img=new Image();img.onload=()=>{const c=document.createElement('canvas');let w=img.width,h=img.height;if(w>maxDim||h>maxDim){if(w>h){w=maxDim;h=Math.round(img.height*(maxDim/img.width))}else{h=maxDim;w=Math.round(img.width*(maxDim/img.height))}}c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);let q=quality;let result;for(let i=0;i<4;i++){result=c.toDataURL('image/jpeg',q);if(result.length<900000)break;q-=0.1}resolve(result)};img.src=e.target.result};
    r.readAsDataURL(file);
  });
}

}

function showFontFileList(){

async function processFontBatch(){
  const files=document.getElementById('fontFiles').files;
  if(!files.length) return;
  const theme=getTheme();
  const progressBar=document.getElementById('fontProgress');
  const fill=document.getElementById('fontProgressFill');
  const status=document.getElementById('fontStatus');
  progressBar.style.display='block';
  const total=files.length;
  for(let i=0;i<total;i++){
    const f=files[i];
    fill.style.width=((i/total)*100)+'%';
    status.textContent=`处理 ${i+1}/${total}：${f.name}`;
    const ext=f.name.split('.').pop().toLowerCase();
    const formatMap={ttf:'truetype',otf:'truetype',woff:'woff',woff2:'woff2'};
    const format=formatMap[ext]||'truetype';
    const dataUrl=await new Promise(res=>{const r=new FileReader();r.onload=e=>res(e.target.result);r.readAsDataURL(f)});
    const fontName=f.name.replace(/\.[^.]+$/,'');
    if(!theme.customFonts) theme.customFonts=[];
    theme.customFonts.push({name:fontName,format,data:dataUrl});
  }
  fill.style.width='100%';
  status.textContent=`✅ ${total} 个字体已注册`;
  saveTheme(theme);
  applyTheme();
  renderCustomFontList();
  document.getElementById('fontUploadBtn').style.display='none';
  document.getElementById('fontFiles').value='';
  toast(`${total} 个字体已注册`);
}

function renderCustomFontList(){
  const theme=getTheme();
  const div=document.getElementById('customFontList');
  if(!div) return;
  if(!theme.customFonts.length){div.innerHTML='<div class="admin-empty">暂无自定义字体</div>';return}
  div.innerHTML=theme.customFonts.map((f,i)=>`
    <div class="font-card">
      <div><div class="font-name" style="font-family:'${f.name}'">${f.name}</div><div class="font-preview" style="font-family:'${f.name}'">${f.name} 效果预览</div></div>
      <div style="display:flex;gap:8px;align-items:center"><span class="font-tag">${f.format}</span><button class="btn-danger btn-small" onclick="deleteCustomFont(${i})">删除</button></div>
    </div>`).join('');
}

// ============ 灯箱 ============
let lbImages=[],lbIndex=0;
function openLightbox(src){
  const all=document.querySelectorAll('.artwork-board img');lbImages=Array.from(all).map(i=>i.src);lbIndex=lbImages.indexOf(src);if(lbIndex<0)lbIndex=0;
  document.getElementById('lbImg').src=src;document.getElementById('lightbox').classList.add('active');updateLbCounter();
}
function closeLightbox(){document.getElementById('lightbox').classList.remove('active')}
function lbPrev(){lbIndex=(lbIndex-1+lbImages.length)%lbImages.length;document.getElementById('lbImg').src=lbImages[lbIndex];updateLbCounter()}
function lbNext(){lbIndex=(lbIndex+1)%lbImages.length;document.getElementById('lbImg').src=lbImages[lbIndex];updateLbCounter()}
function updateLbCounter(){document.getElementById('lbCounter').textContent=`${lbIndex+1} / ${lbImages.length}`}
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeLightbox();document.getElementById('loginOverlay').style.display='none'}if(e.key==='ArrowLeft')lbPrev();if(e.key==='ArrowRight')lbNext()});
document.getElementById('loginOverlay').addEventListener('click',function(e){if(e.target===this)this.style.display='none'});
document.getElementById('lightbox').addEventListener('click',function(e){if(e.target===this)closeLightbox()});

// ============ Toast ============
function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');clearTimeout(el._timer);el._timer=setTimeout(()=>el.classList.remove('show'),2200)}
</script>
