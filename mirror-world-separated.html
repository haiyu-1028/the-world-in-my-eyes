<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>镜中世界 · 线上画廊</title>
<style>
:root {
  --bg: #0b0f1a;
  --panel: #111827;
  --panel2: #1a2236;
  --border: #243049;
  --text: #e6edf3;
  --muted: #8b95a5;
  --primary: #4f8cff;
  --primary2: #3a78e6;
  --danger: #f56565;
  --success: #38b2ac;
  --gold: #c9a84c;
  --klein: #002fa7;
  --title-font: '';
  --body-font: '';
  --curator-font: '';
  --board-color: #111827;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: var(--body-font, -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif);
  background: var(--bg); color: var(--text); line-height: 1.7;
  min-height: 100vh;
}
a { color: var(--primary); text-decoration: none; }
button {
  font-family: inherit; font-size: 14px; cursor: pointer;
  border: 1px solid var(--border); background: var(--panel);
  color: var(--text); padding: 8px 14px; border-radius: 8px;
  transition: .2s;
}
button:hover { border-color: var(--primary); }
button.primary { background: var(--primary); border-color: var(--primary); color: #fff; }
button.primary:hover { background: var(--primary2); }
button.danger { background: var(--danger); border-color: var(--danger); color: #fff; }
button.gold { background: var(--gold); border-color: var(--gold); color: #000; }

/* Navbar */
.navbar {
  position: fixed; top: 0; left: 0; right: 0; height: 60px;
  background: rgba(11,15,26,.92); backdrop-filter: blur(10px);
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 24px; z-index: 900; border-bottom: 1px solid var(--border);
}
.nav-brand { font-size: 20px; font-weight: 700; letter-spacing: 3px; cursor: pointer; }
.nav-links a { color: var(--muted); margin-left: 20px; font-size: 14px; }
.nav-links a:hover { color: var(--text); }
.nav-admin {
  background: var(--primary); color: #fff; padding: 6px 18px;
  border-radius: 20px; margin-left: 16px; font-size: 13px; border: none;
}

/* Hero */
.hero {
  min-height: 70vh; display: flex; flex-direction: column;
  align-items: center; justify-content: center; text-align: center;
  background: linear-gradient(160deg, #0b0f1a 0%, #0a1633 50%, #0b0f1a 100%);
  padding: 80px 24px 40px;
}
.hero h1 { font-family: var(--title-font); font-size: clamp(40px, 8vw, 80px); letter-spacing: 10px; color: #fff; }
.hero p { color: var(--muted); margin-top: 12px; font-size: 17px; }
.hero .cur { color: var(--gold); margin-top: 10px; font-size: 14px; }

/* Section */
.section { max-width: 1200px; margin: 0 auto; padding: 64px 24px; }
.sec-title {
  font-family: var(--title-font);
  font-size: 28px; color: #fff; text-align: center; margin-bottom: 36px;
  letter-spacing: 3px;
}
.sec-title::after { content: ""; display: block; width: 40px; height: 2px; background: var(--primary); margin: 10px auto 0; }

/* Exhibition cards */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px,1fr)); gap: 24px; }
.card {
  background: var(--panel); border: 1px solid var(--border); border-radius: 14px;
  padding: 28px 24px; cursor: pointer; transition: .3s;
}
.card:hover { border-color: var(--primary); transform: translateY(-4px); }
.card h3 { font-family: var(--title-font); font-size: 20px; color: #fff; margin-bottom: 8px; }
.card .tags { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
.card .tag { background: rgba(79,140,255,.15); color: #8ab4ff; padding: 2px 10px; border-radius: 12px; font-size: 12px; }
.card p { color: var(--muted); font-size: 14px; }
.card .meta { color: var(--muted); font-size: 12px; margin-top: 12px; }

/* Column */
.col-article { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 24px 28px; margin-bottom: 16px; }
.col-article h3 { font-family: var(--title-font); color: #fff; font-size: 18px; margin-bottom: 4px; }
.col-article .date { color: var(--muted); font-size: 13px; margin-bottom: 8px; }
.col-article .body { color: var(--muted); font-size: 14px; white-space: pre-wrap; }

/* Curator */
.cur-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px,1fr)); gap: 28px; }
.cur-card {
  background: var(--panel); border: 1px solid var(--border); border-radius: 16px;
  padding: 32px; display: flex; gap: 20px; align-items: flex-start;
}
.cur-card .photo {
  width: 140px; height: 180px; border-radius: 12px; object-fit: cover;
  background: #1a2236; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  color: var(--muted); font-size: 28px;
}
.cur-card .info h3 { font-family: var(--curator-font); color: #fff; font-size: 22px; }
.cur-card .info .role { color: var(--gold); font-size: 13px; margin: 4px 0 10px; }
.cur-card .info .bio { color: var(--muted); font-size: 13px; white-space: pre-wrap; }
.cur-card .info .contact { color: var(--gold); font-size: 13px; margin-top: 8px; }

/* Detail page */
.detail-page { display: none; padding-top: 60px; }
.detail-back { padding: 20px 32px 0; max-width: 1200px; margin: 0 auto; }
.detail-back a { color: var(--muted); cursor: pointer; }
.detail-header { padding: 32px 32px 16px; max-width: 1200px; margin: 0 auto; }
.detail-header h1 { font-family: var(--title-font); font-size: 34px; color: #fff; letter-spacing: 2px; }
.detail-header .stmt { color: var(--muted); margin-top: 10px; white-space: pre-wrap; }
.detail-groups { padding: 16px 32px 60px; max-width: 1200px; margin: 0 auto; }
.detail-group { margin-bottom: 40px; }
.detail-group h2 { font-family: var(--title-font); font-size: 20px; color: #fff; margin-bottom: 4px; }
.detail-group .gdesc { color: var(--muted); font-size: 14px; margin-bottom: 14px; white-space: pre-wrap; }
.detail-photos { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px,1fr)); gap: 18px; }
.photo-item {
  background: var(--board-color); border: 1px solid var(--border); border-radius: 12px;
  overflow: hidden; transition: .3s;
  box-shadow: 0 4px 20px rgba(0,0,0,.4), 0 1px 3px rgba(0,0,0,.3);
}
.photo-item:hover { border-color: var(--primary); transform: translateY(-2px); }
.photo-item img { width: 100%; aspect-ratio: 4/3; object-fit: cover; display: block; background: #111; }
.photo-item .pinfo { padding: 10px 12px; }
.photo-item .pinfo .ptitle { color: #fff; font-size: 14px; }
.photo-item .pinfo .pdesc { color: var(--muted); font-size: 12px; }

/* Lightbox */
.lightbox { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.92); z-index: 5000; align-items: center; justify-content: center; }
.lightbox img { max-width: 90vw; max-height: 85vh; border-radius: 8px; }
.lightbox .lb-close { position: absolute; top: 20px; right: 28px; font-size: 28px; color: #fff; cursor: pointer; }
.lightbox .lb-prev, .lightbox .lb-next { position: absolute; top: 50%; transform: translateY(-50%); font-size: 36px; color: #fff; cursor: pointer; padding: 12px; }
.lightbox .lb-prev { left: 20px; }
.lightbox .lb-next { right: 20px; }
.lightbox .lb-count { position: absolute; bottom: 20px; color: #fff; font-size: 14px; }

/* Admin */
.admin-page { display: none; padding-top: 60px; }
.admin-wrap { display: flex; min-height: calc(100vh - 60px); }
.admin-side {
  width: 200px; background: rgba(0,0,0,.3); border-right: 1px solid var(--border);
  padding: 20px 0; flex-shrink: 0;
}
.admin-side a {
  display: block; padding: 11px 20px; color: var(--muted);
  text-decoration: none; font-size: 14px; cursor: pointer; border-left: 3px solid transparent;
}
.admin-side a:hover, .admin-side a.active {
  color: #fff; background: rgba(79,140,255,.1); border-left-color: var(--primary);
}
.admin-side a.logout { color: var(--danger); margin-top: 20px; }
.admin-main { flex: 1; padding: 28px 32px; overflow-y: auto; }
.admin-main h2 { font-size: 22px; color: #fff; margin-bottom: 20px; }
.admin-main h3 { font-size: 16px; color: #fff; margin: 16px 0 8px; }

/* Forms */
.form-row { margin-bottom: 14px; }
.form-row label { display: block; color: var(--muted); font-size: 13px; margin-bottom: 4px; }
.form-row input, .form-row textarea, .form-row select {
  width: 100%; padding: 9px 12px; background: var(--panel);
  border: 1px solid var(--border); color: var(--text); border-radius: 8px;
  font-size: 14px; font-family: inherit;
}
.form-row textarea { min-height: 80px; resize: vertical; }

/* Drop zone */
.drop-zone {
  position: relative; border: 2px dashed var(--border); border-radius: 12px;
  padding: 36px; text-align: center; cursor: pointer; margin: 12px 0;
}
.drop-zone:hover { border-color: var(--primary); }
.drop-zone .dz-inner { position: relative; z-index: 1; pointer-events: none; }
.drop-zone .dz-inner .ico { font-size: 32px; margin-bottom: 8px; }
.drop-zone .dz-inner .hint { color: var(--muted); font-size: 13px; }
.drop-zone input[type=file] {
  position: absolute; top: 0; left: 0; width: 100%; height: 100%;
  opacity: 0; cursor: pointer; z-index: 2;
}
.file-list { margin: 10px 0; }
.file-item {
  display: flex; justify-content: space-between; align-items: center;
  background: var(--panel2); padding: 8px 12px; border-radius: 8px; margin-bottom: 6px; font-size: 13px;
}
.file-item .rem { color: var(--danger); cursor: pointer; font-size: 16px; }

/* Toast */
.toast {
  position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%);
  background: rgba(0,0,0,.88); color: #fff; padding: 10px 20px;
  border-radius: 8px; font-size: 14px; z-index: 9999;
  opacity: 0; transition: opacity .3s; pointer-events: none;
}
.toast.show { opacity: 1; }

/* Status bar */
.status-bar {
  display: none; position: fixed; top: 60px; left: 0; right: 0;
  background: var(--primary); color: #fff; text-align: center;
  padding: 8px; font-size: 13px; z-index: 800;
}
.status-bar.show { display: block; }

/* Modal */
.modal-overlay {
  display: none; position: fixed; inset: 0; background: rgba(0,0,0,.7);
  z-index: 4000; align-items: center; justify-content: center;
}
.modal-overlay.show { display: flex; }
.modal {
  background: var(--panel); border: 1px solid var(--border); border-radius: 16px;
  padding: 32px; width: 460px; max-width: 92vw; max-height: 86vh; overflow-y: auto;
}
.modal h2 { color: #fff; font-size: 20px; margin-bottom: 16px; }
.modal label { display: block; color: var(--muted); font-size: 13px; margin: 10px 0 4px; }
.modal input, .modal textarea {
  width: 100%; padding: 9px 12px; background: var(--panel2);
  border: 1px solid var(--border); color: var(--text); border-radius: 8px; font-size: 14px;
  font-family: inherit;
}
.modal textarea { min-height: 100px; resize: vertical; }
.modal .actions { display: flex; gap: 10px; margin-top: 18px; justify-content: flex-end; }

/* Login */
.login-overlay {
  display: none; position: fixed; inset: 0; background: rgba(0,0,0,.8);
  z-index: 6000; align-items: center; justify-content: center;
}
.login-overlay.show { display: flex; }
.login-card {
  background: var(--panel); border: 1px solid var(--border); border-radius: 16px;
  padding: 36px; width: 340px; text-align: center;
}
.login-card h2 { color: #fff; font-size: 22px; margin-bottom: 18px; letter-spacing: 2px; }
.login-card input {
  width: 100%; padding: 11px 14px; margin-bottom: 12px;
  background: var(--panel2); border: 1px solid var(--border); color: var(--text);
  border-radius: 8px; font-size: 15px;
}
.login-card button { width: 100%; padding: 11px; border: none; border-radius: 8px; background: var(--primary); color: #fff; font-size: 15px; cursor: pointer; }
.login-card .err { color: var(--danger); font-size: 13px; margin-top: 10px; min-height: 18px; }

/* Footer */
.footer { text-align: center; padding: 36px 24px; color: var(--muted); font-size: 13px; border-top: 1px solid var(--border); margin-top: 48px; }

/* Color swatches */
.swatch-row { display: flex; gap: 8px; flex-wrap: wrap; margin: 8px 0; }
.swatch {
  width: 32px; height: 32px; border-radius: 8px; cursor: pointer; border: 2px solid transparent;
}
.swatch:hover, .swatch.active { border-color: #fff; }

/* Preview board */
.preview-board {
  background: var(--panel2); border: 1px solid var(--border); border-radius: 12px;
  padding: 20px; margin: 12px 0;
}
.preview-board .pb-title { color: #fff; font-size: 16px; margin-bottom: 8px; }
.preview-board .pb-body { color: var(--muted); font-size: 13px; }
.pb-sample {
  width: 100%; aspect-ratio: 4/3; border-radius: 8px; margin-top: 12px;
  display: flex; align-items: center; justify-content: center;
  background: var(--board-color, #111827); border: 1px solid var(--border);
  color: var(--muted); font-size: 13px;
}

/* Photo storage indicator */
.storage-info {
  background: var(--panel); border: 1px solid var(--border); border-radius: 8px;
  padding: 8px 12px; font-size: 12px; color: var(--muted); margin-top: 8px;
}
.storage-info .ok { color: var(--success); }
.storage-info .warn { color: #f6ad55; }
</style>
</head>
<body>

<!-- Navbar -->
<nav class="navbar">
  <div class="nav-brand" onclick="goHome()">镜中世界</div>
  <div class="nav-links" id="navLinks">
    <a href="#exhibitions" onclick="scrollToSec('exhibitions')">展览</a>
    <a href="#columns" onclick="scrollToSec('columns')">专栏</a>
    <a href="#curators" onclick="scrollToSec('curators')">策展人</a>
    <button class="nav-admin" onclick="openLogin()">⚙ 管理</button>
  </div>
</nav>

<!-- Status bar -->
<div class="status-bar" id="statusBar"></div>

<!-- Login -->
<div class="login-overlay" id="loginOverlay">
  <div class="login-card">
    <h2>🔐 内部管理</h2>
    <input type="text" id="loginUser" placeholder="账号" value="海屿" />
    <input type="password" id="loginPass" placeholder="密码" />
    <button onclick="doLogin()">验证身份</button>
    <div class="err" id="loginErr"></div>
  </div>
</div>

<!-- Home -->
<div id="homePage">
  <section class="hero">
    <h1>镜中世界</h1>
    <p>摄影是现实的一面透镜，也是通往另一个世界的窗口。</p>
    <div class="cur">策展人：张昊文</div>
  </section>

  <section class="section" id="exhibitions">
    <h2 class="sec-title">展览</h2>
    <div class="grid" id="exGrid"></div>
  </section>

  <section class="section" id="columns">
    <h2 class="sec-title">文字专栏</h2>
    <div id="colList"></div>
  </section>

  <section class="section" id="curators">
    <h2 class="sec-title">策展人</h2>
    <div class="cur-grid" id="curGrid"></div>
  </section>

  <footer class="footer">© 2026 镜中世界 · 线上画廊 | 策展人：张昊文</footer>
</div>

<!-- Detail -->
<div class="detail-page" id="detailPage">
  <div class="detail-back"><a onclick="goHome()">← 返回首页</a></div>
  <div class="detail-header" id="detailHeader"></div>
  <div class="detail-groups" id="detailGroups"></div>
</div>

<!-- Admin -->
<div class="admin-page" id="adminPage">
  <div class="admin-wrap">
    <div class="admin-side" id="adminSide"></div>
    <div class="admin-main" id="adminMain"></div>
  </div>
</div>

<!-- Lightbox -->
<div class="lightbox" id="lightbox">
  <span class="lb-close" onclick="closeLightbox()">✕</span>
  <span class="lb-prev" onclick="lbNav(-1)">‹</span>
  <img id="lbImg" src="" alt="" />
  <span class="lb-next" onclick="lbNav(1)">›</span>
  <div class="lb-count" id="lbCount"></div>
</div>

<!-- Curator Modal -->
<div class="modal-overlay" id="curModal">
  <div class="modal">
    <h2 id="curModalTitle">编辑策展人</h2>
    <label>写真（选文件后自动预览）</label>
    <input type="file" id="curPhotoFile" accept="image/*" />
    <img id="curPhotoPreview" style="width:120px;height:150px;object-fit:cover;border-radius:8px;margin:8px 0;display:none;" />
    <label>姓名</label>
    <input type="text" id="curName" />
    <label>头衔</label>
    <input type="text" id="curRole" />
    <label>履历</label>
    <textarea id="curBio"></textarea>
    <div class="actions">
      <button class="danger" id="curDeleteBtn" style="display:none;margin-right:auto;">🗑 删除</button>
      <button class="secondary" onclick="closeCurModal()">取消</button>
      <button class="primary" onclick="saveCurator()">💾 保存</button>
    </div>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
/* ============================================================
   镜中世界 · 分离式存储版
   - data.json  → 文字数据（展览/专栏/策展人/浏览量）
   - photos.json → 照片数据（base64，独立存储）
   - data 中的图片引用 photos["photo_xxx"] 的 key
============================================================ */

var STORAGE_KEY = 'mirror_world_data';
var PHOTO_KEY = 'mirror_world_photos';
var THEME_KEY = 'mirror_world_theme';
var SESSION_KEY = 'mirror_admin_logged';

/* ---------- 默认数据（不含照片） ---------- */
var defaultData = {
  exhibitions: [
    { id:'ex0', title:'2025夏天的颜色', tags:['摄影·年度特展'],
      statement:'银盐的颗粒感与数字像素的冷冽在此交织。2025年的夏天，我们试图用镜头捕捉那些即将消逝的色彩——褪色的广告牌、夕照下的塑料花、地铁站里陌生人的瞳孔。摄影史告诉我们，每一次对色彩的记录，都是一次对时间的挽留。',
      groups:[], views:0,
      style:{ boardColor:'#002fa7', titleFont:'', bodyFont:'' } },
    { id:'ex1', title:'2026夏天的颜色', tags:['摄影·年度特展'],
      statement:'当克莱因蓝遇见深绿，当胶片质感碰撞算法美学。2026年的夏天，色彩不再只是视觉经验，而成为了一种哲学追问。正如伊夫·克莱因所言："蓝色是没有维度的，它超越了维度。"',
      groups:[], views:0,
      style:{ boardColor:'#0d2818', titleFont:'', bodyFont:'' } },
    { id:'ex2', title:'快乐之家', tags:['纪实·长期项目'],
      statement:'从维多利亚时代的家庭肖像到荒木经惟的私写真，家庭摄影始终在真实与表演之间摇摆。"快乐之家"试图在这个张力中寻找一条属于自己的道路——那些看似平凡的日常瞬间，或许才是摄影最动人的力量。',
      groups:[], views:0,
      style:{ boardColor:'#1a3320', titleFont:'', bodyFont:'' } },
    { id:'ex3', title:'风光与星空', tags:['风景摄影·自然纪实'],
      statement:'从19世纪探险摄影师卡尔顿·沃特金斯穿越内华达山脉的玻璃底片，到安塞尔·亚当斯的月升时分，再到当代星空摄影师的银河长曝——人类对大地与星空的仰望从未改变。',
      groups:[], views:0,
      style:{ boardColor:'#1a1a2e', titleFont:'', bodyFont:'' } }
  ],
  columns: [
    { id:'c0', title:'镜面与凝视：摄影的本质追问', date:'2026-03-15',
      body:'摄影是什么？\n\n是现实的镜像，还是观看的权力？苏珊·桑塔格在《论摄影》中写道："收集照片就是收集世界。"每一张照片都是一次切割，将流动的时间凝固成永恒的碎片。\n\n当我们举起相机，我们既是在记录，也是在创造。镜头前的世界经过取景框的筛选，已经不再是原本的模样。这就是摄影最迷人的悖论——它既忠实于现实，又不可避免地扭曲现实。' },
    { id:'c1', title:'夏天的视觉考古学', date:'2026-06-01',
      body:'夏天，或许是摄影最钟情的季节。\n\n强烈的光线制造出戏剧性的阴影，饱和的色彩在高温中几乎要融化。从威廉·埃格尔斯顿的美国南部夏日到川内伦子的微光世界，摄影家们一直在用镜头挖掘夏天深处的秘密。\n\n这个系列专栏将不定期更新，探讨摄影与时间、记忆、情感之间的微妙关系。' }
  ],
  curators: [
    { id:'cur0', name:'张昊文', role:'策展人 · 摄影研究者',
      bio:'张昊文，24级本科在读，人文、风光摄影师，摄影批评写作者。专注于当代摄影与视觉文化研究与光影艺术表达，关注图像如何塑造、表达情绪与故事内容。致力于在技术与人文的交汇处寻找摄影的新可能。\n\n联系方式：1964391340@qq.com',
      photoRef:'' }
  ]
};

var defaultTheme = {
  bg:'', boardColor:'#111827',
  titleFont:'', bodyFont:'', curatorFont:'',
  customFonts:[]
};

/* ---------- 数据读写 ---------- */
function loadFromStorage(){
  try {
    var d = localStorage.getItem(STORAGE_KEY);
    if(d){ data = JSON.parse(d); }
    var p = localStorage.getItem(PHOTO_KEY);
    if(p){ photos = JSON.parse(p); }
    var t = localStorage.getItem(THEME_KEY);
    if(t){ theme = JSON.parse(t); }
  } catch(e){ console.error('load error', e); }
  // 补全缺失字段
  if(!data.exhibitions) data.exhibitions = clone(defaultData.exhibitions);
  if(!data.columns) data.columns = clone(defaultData.columns);
  if(!data.curators) data.curators = clone(defaultData.curators);
  data.exhibitions.forEach(function(ex){
    if(!ex.groups) ex.groups = [];
    if(!ex.style) ex.style = {boardColor:'#111827',titleFont:'',bodyFont:''};
  });
  data.curators.forEach(function(c){
    if(c.photoRef === undefined) c.photoRef = '';
  });
  if(!theme.customFonts) theme.customFonts = [];
}

function saveToStorage(){
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    localStorage.setItem(PHOTO_KEY, JSON.stringify(photos));
    localStorage.setItem(THEME_KEY, JSON.stringify(theme));
  } catch(e){
    showToast('⚠️ 存储已满，请导出后清除部分数据再试');
    console.error('save error', e);
  }
}

/* ---------- 远程加载（分离式） ---------- */
async function loadRemoteData(){
  try {
    var resp = await fetch('./data.json?_='+Date.now());
    if(resp.ok){
      var d = await resp.json();
      if(d && d.exhibitions){ data = d; }
    }
  } catch(e){ console.log('ℹ️ 无远程 data.json，使用本地'); }

  try {
    var r2 = await fetch('./photos.json?_='+Date.now());
    if(r2.ok){
      photos = await r2.json();
      console.log('✅ photos.json 已加载，共 '+Object.keys(photos).length+' 张照片');
    }
  } catch(e){ console.log('ℹ️ 无远程 photos.json'); }

  try {
    var r3 = await fetch('./theme.json?_='+Date.now());
    if(r3.ok){ theme = await r3.json(); }
  } catch(e){}
}

/* ---------- 照片解析：ref → url ---------- */
function resolvePhoto(ref){

  return photos[ref] || '';
}

function openDetail(exId){
  var ex = data.exhibitions.find(function(e){ return e.id===exId; });
  if(!ex) return;
  ex.views = (ex.views||0) + 1;
  saveToStorage();

  $('homePage').style.display = 'none';
  $('adminPage').style.display = 'none';
  $('detailPage').style.display = 'block';

  $('detailHeader').innerHTML = '<h1>'+ex.title+'</h1>'+
    '<div class="stmt">'+(ex.statement||'').replace(/\n/g,'<br>')+'</div>';

  var html = '';
  if(!ex.groups || ex.groups.length===0){
    html = '<div style="color:var(--muted)">暂无作品</div>';
  } else {
    ex.groups.forEach(function(g){
      html += '<div class="detail-group"><h2>'+g.title+'</h2>';
      if(g.desc) html += '<div class="gdesc">'+(g.desc||'').replace(/\n/g,'<br>')+'</div>';
      html += '<div class="detail-photos">';
      (g.photos||[]).forEach(function(photoRef, idx){
        var url = resolvePhoto(photoRef);
        var allImgs = collectImages(ex);
        var gi = allImgs.indexOf(photoRef);
        html += '<div class="photo-item" onclick="openLightbox('+gi+')">'+
          '<img src="'+url+'" alt="" loading="lazy" />'+
          '<div class="pinfo"><div class="ptitle">'+(g.title||'未命名')+'</div></div></div>';
      });
      html += '</div></div>';
    });
  }
  $('detailGroups').innerHTML = html;
  window.scrollTo(0,0);
}

function collectImages(ex){
  var arr = [];
  ex.groups.forEach(function(g){
    (g.photos||[]).forEach(function(ref){
      arr.push(ref);
    });
  });
  return arr;
}

  });
  saveToStorage(); markUnsaved();
  renderAdminMain('exhibitions'); renderHome(); showToast('✅ 展览已添加');

function delEx(id){
  if(!confirm('确定删除该展览及其所有照片引用？')) return;
  var ex = data.exhibitions.find(function(e){ return e.id===id; });
  // 释放照片引用（不删 photos.json 里的数据，留给用户手动清理）
  if(ex && ex.groups){
    ex.groups.forEach(function(g){
      (g.photos||[]).forEach(function(ref){
        // 检查是否还有其他地方引用这张照片
        var stillUsed = false;
        data.exhibitions.forEach(function(e2){
          e2.groups.forEach(function(g2){
            if(g2.photos && g2.photos.indexOf(ref)>=0) stillUsed = true;
          });
        });
        if(!stillUsed && photos[ref]){
          delete photos[ref];
        }
      });
    });
  }
  data.exhibitions = data.exhibitions.filter(function(e){ return e.id!==id; });
  saveToStorage(); markUnsaved();
  renderAdminMain('exhibitions'); renderHome(); showToast('✅ 已删除');
}

function delGroup(exId, gi){
  if(!confirm('确定删除该组照及其照片引用？')) return;
  var ex = data.exhibitions.find(function(e){ return e.id===exId; });
  if(!ex || !ex.groups) return;
  var g = ex.groups[gi];
  // 释放照片
  (g.photos||[]).forEach(function(ref){
    var stillUsed = false;
    data.exhibitions.forEach(function(e2){
      e2.groups.forEach(function(g2){
        if(g2!==g && g2.photos && g2.photos.indexOf(ref)>=0) stillUsed = true;
      });
    });
    if(!stillUsed && photos[ref]) delete photos[ref];
  });
  ex.groups.splice(gi, 1);
  saveToStorage(); markUnsaved();
  renderAdminMain('exhibitions'); renderHome(); showToast('✅ 组照已删除');
}

  pendingCurPhoto = c.photoRef || '';

  if(url){ prev.src = url; prev.style.display = 'block'; }
  else { prev.style.display = 'none'; }
  $('curDeleteBtn').style.display = data.curators.length>1 ? 'block' : 'none';

  $('curPhotoFile').onchange = function(){

    if(!f) return;
    if(f.size > 5*1024*1024){ showToast('写真不能超过 5MB'); return; }
    var reader = new FileReader();
    reader.onload = function(e){
      var ref = 'photo_'+Date.now();
      photos[ref] = e.target.result;
      pendingCurPhoto = ref;
      prev.src = e.target.result;
      prev.style.display = 'block';
    };
    reader.readAsDataURL(f);
  };

    data.curators.push({
      id:'cur'+Date.now(), name:name,
      role: $('newCurRole').value || '策展人',
      bio: $('newCurBio').value || '',
      photoRef: photoRef
    });
    saveToStorage(); markUnsaved();
    renderAdminMain('curators'); renderHome();
    $('newCurName').value=''; $('newCurRole').value=''; $('newCurBio').value='';
    $('newCurPhoto').value='';
    showToast('✅ 策展人已添加');
  };
  if(f){
    if(f.size>5*1024*1024){ showToast('写真不能超过 5MB'); return; }
    var reader = new FileReader();
    reader.onload = function(e){
      photoRef = 'photo_'+Date.now();
      photos[photoRef] = e.target.result;
      done();
    };
    reader.readAsDataURL(f);
  } else { done(); }
}

function delCur(id){
  if(data.curators.length<=1){ showToast('至少保留一位策展人'); return; }
  if(!confirm('确定删除该策展人？')) return;
  var c = data.curators.find(function(x){ return x.id===id; });
  if(c && c.photoRef && photos[c.photoRef]) delete photos[c.photoRef];
  data.curators = data.curators.filter(function(c2){ return c2.id!==id; });
  saveToStorage(); markUnsaved();
  renderAdminMain('curators'); renderHome(); showToast('✅ 已删除');
}

/* --- 上传（核心：写入 photos.json） --- */
function renderUpload(main){
  var html = '<h2>🖼 上传组照</h2>';
  // 选展览
  html += '<div class="form-row"><label>选择展览</label><select id="upEx">';
  data.exhibitions.forEach(function(ex){ html += '<option value="'+ex.id+'">'+ex.title+'</option>'; });
  html += '</select></div>';
  // 组照标题
  html += '<div class="form-row"><label>组照标题</label><input id="upTitle" placeholder="如：霓虹与夕照" /></div>';
  // 组照介绍
  html += '<div class="form-row"><label>组照介绍词</label><textarea id="upDesc" placeholder="写几句关于这组照片的故事..."></textarea></div>';
  // 选图片
  html += '<div class="form-row"><label>选择图片（可多选，≤20MB/张）</label>'+
    '<div class="drop-zone" id="upDrop">'+
      '<input type="file" id="upFile" accept="image/*" multiple />'+
      '<div class="dz-inner"><div class="ico">📁</div><div class="hint">拖拽图片到此处，或点击选择多个文件<br/>支持 JPG / PNG / WebP</div></div>'+
    '</div>'+
    '<button class="primary" onclick="document.getElementById(\'upFile\').click()" style="margin-top:8px">选择图片文件</button>'+
    '</div>';
  // 文件列表
  html += '<div class="file-list" id="upFileList"></div>';
  // 保存按钮
  html += '<button class="primary" id="upSave" style="margin-top:16px" disabled>⬆️ 上传并保存组照</button>';
  html += '<div id="upStatus" style="color:var(--muted);font-size:12px;margin-top:8px"></div>';

  // 照片存储信息
  var photoSize = 0;
  try { photoSize = Math.round(new Blob([JSON.stringify(photos)]).size/1024); } catch(e){}
  html += '<div class="storage-info">📷 当前照片存储：'+Object.keys(photos).length+' 张 · '+photoSize+'KB（独立存储于 photos.json）</div>';

  main.innerHTML = html;

  // 绑定上传区
  bindUploadZone('upDrop', 'upFile', function(files){
    pendingFiles = [];
    Array.from(files).forEach(function(f){
      if(!f.type.startsWith('image/')) return;
      if(f.size > 20*1024*1024){ showToast(f.name+' 超过 20MB，已跳过'); return; }
      pendingFiles.push(f);
    });
    renderFileList();
    checkSaveBtn();
  });

  $('upTitle').addEventListener('input', checkSaveBtn);
  $('upSave').onclick = doUpload;

  function renderFileList(){
    var el = $('upFileList');
    el.innerHTML = '';
    pendingFiles.forEach(function(f, i){
      var item = document.createElement('div');
      item.className = 'file-item';
      item.innerHTML = '<span>🖼 '+f.name+' ('+Math.round(f.size/1024)+'KB)</span>'+
        '<span class="rem" onclick="removePending('+i+')">✕</span>';
      el.appendChild(item);
    });
  }

  function checkSaveBtn(){
    var ok = pendingFiles.length>0 && $('upTitle').value.trim().length>0;
    $('upSave').disabled = !ok;
  }

  window.removePending = function(i){
    pendingFiles.splice(i,1);
    renderFileList();
    checkSaveBtn();
  };

  window.doUpload = function(){
    var title = $('upTitle').value.trim();
    var desc = $('upDesc').value.trim();
    var exId = $('upEx').value;
    if(!title || pendingFiles.length===0){ showToast('请填写标题并选择至少一张图片'); return; }
    var ex = data.exhibitions.find(function(e){ return e.id===exId; });
    if(!ex){ showToast('展览不存在'); return; }

    var group = { title:title, desc:desc, photos:[] };
    var processed = 0;
    $('upStatus').textContent = '正在处理 ' + pendingFiles.length + ' 张图片（高质量模式 95%）...';

    pendingFiles.forEach(function(f){
      var reader = new FileReader();
      reader.onload = function(evt){
        var img = new Image();
        img.onload = function(){
          // 高质量压缩：宽不超过 2400px，质量 95%
          var w = img.width, h = img.height;
          var maxW = 2400;
          if(w > maxW){ h = Math.round(h * maxW/w); w = maxW; }
          var canvas = document.createElement('canvas');
          canvas.width = w; canvas.height = h;
          var ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, w, h);
          // 用 95% 质量 → 照片清晰，体积可控
          var url = canvas.toDataURL('image/jpeg', 0.95);
          // 极端情况再降
          var attempts = 0;
          while(url.length > 5*1024*1024 && attempts < 5){
            url = canvas.toDataURL('image/jpeg', 0.95 - attempts*0.1);
            attempts++;
          }
          var ref = 'photo_'+Date.now()+'_'+processed;
          photos[ref] = url;
          group.photos.push(ref);
          processed++;
          if(processed === pendingFiles.length){
            ex.groups.push(group);
            saveToStorage();
            var photoSize2 = 0;
            try { photoSize2 = Math.round(new Blob([JSON.stringify(photos)]).size/1024); } catch(e){}
            showStatus('📋 已暂存 '+group.photos.length+' 张照片到「'+ex.title+' → '+group.title+'」（photos.json 当前 '+photoSize2+'KB）记得去「设置」→「导出照片」');
            renderAdminMain('upload');
            renderHome();
            showToast('✅ 已保存 '+group.photos.length+' 张高质量照片');
          }
        };
        img.src = evt.target.result;
      };
      reader.readAsDataURL(f);
    });
  };
}

/* 绑定上传区 */
function bindUploadZone(zoneId, inputId, onFiles){
  var zone = $(zoneId);
  var input = $(inputId);
  if(!zone || !input) return;
  zone.addEventListener('click', function(e){
    if(e.target !== input) input.click();
  });
  input.addEventListener('change', function(){ onFiles(input.files); input.value=''; });
  zone.addEventListener('dragover', function(e){ e.preventDefault(); zone.style.borderColor='var(--primary)'; });
  zone.addEventListener('dragleave', function(){ zone.style.borderColor=''; });
  zone.addEventListener('drop', function(e){
    e.preventDefault(); zone.style.borderColor='';
    onFiles(e.dataTransfer.files);
  });
}

/* --- 外观设置 --- */
function renderAppearance(main){
  var html = '<h2>🎨 外观设置</h2>';

  // 背景颜色
  html += '<div style="background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:20px;margin-bottom:16px">'+
    '<h3>背景颜色</h3>'+
    '<div class="form-row"><label>页面背景色</label><input type="color" id="bgColor" value="'+(theme.bg||'#0b0f1a')+'" /></div>'+
    '<button class="primary" onclick="applyBg()">💾 保存背景</button></div>';

  // 背景板颜色
  html += '<div style="background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:20px;margin-bottom:16px">'+
    '<h3>背景板颜色</h3>'+
    '<div class="form-row"><label>照片展板颜色</label><input type="color" id="boardColor" value="'+(theme.boardColor||'#111827')+'" /></div>'+
    '<div class="preview-board"><div class="pb-title">实时预览</div><div class="pb-body">这里是照片下方展板效果</div><div class="pb-sample" id="pbSample">背景板颜色预览</div></div>'+
    '<button class="primary" onclick="applyBoard()">💾 保存背景板</button></div>';

  // 字体
  var fonts = ['默认','Georgia','Times New Roman','Arial','Helvetica','Courier New','Microsoft YaHei','PingFang SC','Noto Serif SC'];
  (theme.customFonts||[]).forEach(function(f){ fonts.push(f.name); });
  html += '<div style="background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:20px;margin-bottom:16px">'+
    '<h3>字体</h3>'+
    '<div class="form-row"><label>标题字体</label><select id="titleFont">'+fonts.map(function(f){return '<option value="'+f+'">'+f+'</option>';}).join('')+'</select></div>'+
    '<div class="form-row"><label>正文字体</label><select id="bodyFont">'+fonts.map(function(f){return '<option value="'+f+'">'+f+'</option>';}).join('')+'</select></div>'+
    '<div class="form-row"><label>策展人字体</label><select id="curatorFont">'+fonts.map(function(f){return '<option value="'+f+'">'+f+'</option>';}).join('')+'</select></div>'+
    '<button class="primary" onclick="applyFonts()">💾 保存字体</button></div>';

  // 自定义字体上传
  html += '<div style="background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:20px;margin-bottom:16px">'+
    '<h3>自定义字体</h3>'+
    '<div class="drop-zone" id="fontDrop">'+
      '<input type="file" id="fontFile" accept=".ttf,.otf,.woff,.woff2" multiple />'+
      '<div class="dz-inner"><div class="ico">📁</div><div class="hint">拖拽字体文件或点击选择<br/>支持 .ttf .otf .woff .woff2</div></div>'+
    '</div>'+
    '<button class="primary" onclick="document.getElementById(\'fontFile\').click()" style="margin-top:8px">选择字体文件</button>'+
    '<div id="fontList" style="margin-top:10px;font-size:12px;color:var(--muted)"></div></div>';

  main.innerHTML = html;

  // 填充字体选择
  if(theme.titleFont) $('titleFont').value = theme.titleFont;
  if(theme.bodyFont) $('bodyFont').value = theme.bodyFont;
  if(theme.curatorFont) $('curatorFont').value = theme.curatorFont;

  // 背景板预览
  $('boardColor').addEventListener('input', function(){
    $('pbSample').style.background = this.value;
  });
  $('pbSample').style.background = theme.boardColor || '#111827';

  // 渲染已注册字体
  renderFontList();

  // 绑定字体上传
  bindUploadZone('fontDrop', 'fontFile', function(files){
    Array.from(files).forEach(function(f){
      var reader = new FileReader();
      reader.onload = function(e){
        var ext = (f.name.match(/\.(ttf|otf|woff2?)$/i)||[])[1]||'ttf';
        var format = ext==='woff2'?'woff2':ext==='woff'?'woff':ext==='otf'?'opentype':'truetype';
        var fname = f.name.replace(/\.(ttf|otf|woff2?)$/i,'');
        if(!theme.customFonts) theme.customFonts = [];
        theme.customFonts.push({ name:fname, data:e.target.result, format:format });
        // 注入 @font-face
        var style = document.getElementById('customFontsStyle') || document.createElement('style');
        style.id = 'customFontsStyle';
        style.innerHTML = theme.customFonts.map(function(ft,i){
          return '@font-face{font-family:"cf'+i+'";src:url("'+ft.data+'") format("'+(ft.format||'truetype')+'");}';
        }).join('');
        document.head.appendChild(style);
        saveToStorage(); markUnsaved();
        renderFontList();
        showToast('✅ 字体 '+fname+' 已注册（导出 theme.json 永久保存）');
      };
      reader.readAsDataURL(f);
    });
  });

  function renderFontList(){
    var el = $('fontList');
    if(!theme.customFonts || theme.customFonts.length===0){
      el.textContent = '暂无自定义字体';
    } else {
      el.innerHTML = theme.customFonts.map(function(f,i){
        return '<div>📄 '+f.name+' <span style="color:var(--muted)">('+(f.format||'truetype')+')</span> <span style="color:var(--danger);cursor:pointer" onclick="delFont('+i+')">✕</span></div>';
      }).join('');
    }
  }

  window.delFont = function(i){
    if(!confirm('删除该字体？')) return;
    theme.customFonts.splice(i,1);
    saveToStorage(); markUnsaved();
    renderAppearance($('adminMain'));
    showToast('✅ 已删除');
  };

  window.applyBg = function(){
    theme.bg = $('bgColor').value;
    document.body.style.background = theme.bg;
    saveToStorage(); markUnsaved();
    showToast('✅ 背景已保存');
  };

  window.applyBoard = function(){
    theme.boardColor = $('boardColor').value;
    document.documentElement.style.setProperty('--board-color', theme.boardColor);
    data.exhibitions.forEach(function(ex){ if(ex.style) ex.style.boardColor = theme.boardColor; });
    saveToStorage(); markUnsaved();
    showToast('✅ 背景板颜色已保存');
  };

  window.applyFonts = function(){
    theme.titleFont = $('titleFont').value;
    theme.bodyFont = $('bodyFont').value;
    theme.curatorFont = $('curatorFont').value;
    if(theme.titleFont) document.documentElement.style.setProperty('--title-font', theme.titleFont);
    if(theme.bodyFont) document.documentElement.style.setProperty('--body-font', theme.bodyFont);
    if(theme.curatorFont) document.documentElement.style.setProperty('--curator-font', theme.curatorFont);
    saveToStorage(); markUnsaved();
    showToast('✅ 字体已保存');
  };
}

function exportData(){
  var blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url; a.download = 'data.json'; a.click();
  URL.revokeObjectURL(url);
  hideStatus();
  showToast('✅ data.json 已下载 — 请上传到 GitHub 覆盖旧的');
}

function exportPhotos(){
  var blob = new Blob([JSON.stringify(photos, null, 2)], {type:'application/json'});
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url; a.download = 'photos.json'; a.click();
  URL.revokeObjectURL(url);
  showToast('✅ photos.json 已下载（'+Object.keys(photos).length+' 张照片）— 请上传到 GitHub');
}

function importData(){
  var input = document.createElement('input');
  input.type = 'file'; input.accept = '.json';
  input.onchange = function(e){
    var f = e.target.files[0];
    var reader = new FileReader();
    reader.onload = function(ev){
      try {
        var d = JSON.parse(ev.target.result);
        if(!d.exhibitions) throw new Error('格式错误');
        data = d;
        saveToStorage(); markUnsaved();
        renderHome(); renderAdminMain('settings');
        showToast('✅ data.json 导入成功');
      } catch(err){ showToast('❌ 文件格式不正确'); }
    };
    reader.readAsText(f);
  };
  input.click();
}

function importPhotos(){
  var input = document.createElement('input');
  input.type = 'file'; input.accept = '.json';
  input.onchange = function(e){
    var f = e.target.files[0];
    var reader = new FileReader();
    reader.onload = function(ev){
      try {
        var p = JSON.parse(ev.target.result);
        if(typeof p !== 'object') throw new Error('格式错误');
        photos = p;
        saveToStorage(); markUnsaved();
        renderHome(); renderAdminMain('settings');
        showToast('✅ photos.json 导入成功（'+Object.keys(photos).length+' 张）');
      } catch(err){ showToast('❌ 文件格式不正确'); }
    };
    reader.readAsText(f);
  };
  input.click();
}

function exportTheme(){
  var blob = new Blob([JSON.stringify(theme, null, 2)], {type:'application/json'});
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url; a.download = 'theme.json'; a.click();
  URL.revokeObjectURL(url);
  showToast('✅ theme.json 已下载');
}

function changePass(){
  var np = $('newPass').value.trim();
  if(np.length<4){ showToast('密码至少4位'); return; }
  localStorage.setItem('mirror_world_pass', np);
  $('newPass').value = '';
  showToast('✅ 密码已修改');
}

function resetViews(){
  if(!confirm('确定重置所有浏览量？')) return;
  data.exhibitions.forEach(function(ex){ ex.views = 0; });
  saveToStorage(); markUnsaved();
  renderAdminMain('dashboard');
  showToast('✅ 浏览量已重置');
}

function clearAllPhotos(){
  if(!confirm('确定清空所有照片？此操作不可恢复！')) return;
  photos = {};
  // 清除所有组照引用
  data.exhibitions.forEach(function(ex){
    (ex.groups||[]).forEach(function(g){ g.photos = []; });
  });
  saveToStorage(); markUnsaved();
  renderHome(); renderAdminMain('settings');
  showToast('✅ 所有照片已清空');
}

function goHome(){
  $('homePage').style.display = 'block';
  $('detailPage').style.display = 'none';
  $('adminPage').style.display = 'none';
  renderHome();
}

  loadFromStorage();
  await loadRemoteData();
  renderHome();

  // 应用主题
  if(theme.bg) document.body.style.background = theme.bg;
  if(theme.boardColor) document.documentElement.style.setProperty('--board-color', theme.boardColor);
  if(theme.titleFont) document.documentElement.style.setProperty('--title-font', theme.titleFont);
  if(theme.bodyFont) document.documentElement.style.setProperty('--body-font', theme.bodyFont);
  if(theme.curatorFont) document.documentElement.style.setProperty('--curator-font', theme.curatorFont);

  // 注入自定义字体
  if(theme.customFonts && theme.customFonts.length){
    var style = document.createElement('style');
    style.id = 'customFontsStyle';
    style.innerHTML = theme.customFonts.map(function(ft,i){
      return '@font-face{font-family:"cf'+i+'";src:url("'+ft.data+'") format("'+(ft.format||'truetype')+'");}';
    }).join('');
    document.head.appendChild(style);
  }

  console.log('✅ 镜中世界初始化完成（分离式存储版）');
  console.log('   展览: '+data.exhibitions.length+' | 照片: '+Object.keys(photos).length+' | 浏览量: '+data.exhibitions.reduce(function(s,e){return s+(e.views||0);},0));
}

init();
