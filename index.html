<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>镜中世界 · 线上画廊</title>
<style>
:root{
  --bg:#0b0f1a;
  --panel:#12182b;
  --border:#1e2a4a;
  --txt:#e0e6ed;
  --sub:#8fa3bf;
  --klein:#4fc3f7;
  --btn:#1976d2;
  --btn-hover:#1565c0;
  --danger:#d32f2f;
}
html,body{
  margin:0;padding:0;
  background:var(--bg);
  color:var(--txt);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  height:100%;
}
#app{
  display:flex;
  height:100vh;
  overflow:hidden;
}
/* Sidebar */
aside{
  width:220px;
  background:var(--panel);
  border-right:1px solid var(--border);
  display:flex;
  flex-direction:column;
  padding:16px 0;
}
aside h1{
  font-size:18px;
  padding:0 16px 12px;
  margin:0;
  display:flex;
  align-items:center;
  gap:8px;
}
aside nav{
  flex:1;
  display:flex;
  flex-direction:column;
  gap:4px;
  padding:0 8px;
}
aside nav a{
  color:var(--sub);
  text-decoration:none;
  padding:10px 12px;
  border-radius:8px;
  font-size:14px;
}
aside nav a:hover,aside nav a.active{
  background:rgba(79,195,247,.12);
  color:var(--klein);
}
/* Main */
main{
  flex:1;
  display:flex;
  flex-direction:column;
  overflow:hidden;
}
header{
  height:56px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 24px;
  border-bottom:1px solid var(--border);
}
header .tabs{
  display:flex;
  gap:24px;
}
header .tabs a{
  color:var(--sub);
  text-decoration:none;
  font-size:14px;
}
header .tabs a.active{
  color:var(--klein);
  font-weight:600;
}
header .user{
  display:flex;
  align-items:center;
  gap:12px;
  font-size:13px;
}
header .user button{
  background:transparent;
  border:1px solid var(--border);
  color:var(--txt);
  padding:6px 12px;
  border-radius:6px;
  cursor:pointer;
}
header .user button.logout{
  background:var(--danger);
  border:none;
  color:#fff;
}

/* Panel */
.panel{
  flex:1;
  overflow-y:auto;
  padding:24px;
}
.panel.hidden{display:none;}
.section-title{
  font-size:16px;
  margin-bottom:12px;
  display:flex;
  align-items:center;
  gap:8px;
}
/* Form */
.form-group{
  margin-bottom:16px;
}
.form-group label{
  display:block;
  margin-bottom:6px;
  font-size:13px;
  color:var(--sub);
}
.form-group input,
.form-group textarea{
  width:100%;
  background:var(--panel);
  border:1px solid var(--border);
  color:var(--txt);
  padding:10px 12px;
  border-radius:8px;
  font-size:14px;
  box-sizing:border-box;
}
.form-group textarea{
  min-height:80px;
  resize:vertical;
}
/* Upload Zone */
.drop-zone{
  position:relative;
  border:2px dashed var(--border);
  border-radius:12px;
  padding:40px;
  text-align:center;
  cursor:pointer;
  margin-bottom:16px;
}
.drop-zone:hover{border-color:var(--klein);}
.drop-zone input[type=file]{
  position:absolute;top:0;left:0;width:100%;height:100%;
  opacity:0;cursor:pointer;z-index:2;
}
.drop-zone .hint{
  color:var(--sub);
  font-size:13px;
  margin-top:8px;
}
/* File List */
.file-list{
  margin-bottom:16px;
}
.file-item{
  display:flex;
  align-items:center;
  justify-content:space-between;
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:8px;
  padding:10px 12px;
  margin-bottom:8px;
}
.file-item .name{display:flex;align-items:center;gap:8px;font-size:13px;}
.file-item .remove{
  color:var(--danger);
  cursor:pointer;
  font-size:16px;
  line-height:1;
}
/* Buttons */
.btn{
  background:var(--btn);
  color:#fff;
  border:none;
  padding:10px 18px;
  border-radius:8px;
  font-size:14px;
  cursor:pointer;
  display:inline-flex;
  align-items:center;
  gap:6px;
}
.btn:hover{background:var(--btn-hover);}
.btn:disabled{opacity:.6;cursor:not-allowed;}
/* Toast */
.toast{
  position:fixed;
  bottom:24px;
  left:50%;
  transform:translateX(-50%);
  background:rgba(0,0,0,.85);
  color:#fff;
  padding:10px 18px;
  border-radius:8px;
  font-size:13px;
  z-index:9999;
  opacity:0;
  transition:opacity .25s;
}
.toast.show{opacity:1;}
</style>
</head>
<body>
<div id="app">
  <aside>
    <h1>🌀 镜中世界</h1>
    <nav id="nav"></nav>
    <div style="padding:16px;">
      <button class="btn logout" onclick="logout()">🚪 退出登录</button>
    </div>
  </aside>

  <main>
    <header>
      <div class="tabs" id="tabs"></div>
      <div class="user">
        <span>登录身份：<b id="loginName">海屿</b></span>
        <button class="logout" onclick="logout()">退出登录</button>
      </div>
    </header>

    <!-- 后台面板 -->
    <section id="adminPanel" class="panel hidden">
      <div class="section-title">⚙ 内部管理</div>
      <nav id="adminNav"></nav>
    </section>

    <!-- 上传面板 -->
    <section id="uploadPanel" class="panel hidden">
      <div class="section-title">🖼 上传组照</div>
      <div class="form-group">
        <label>组照标题</label>
        <input id="groupTitle" placeholder="请输入组照标题（必填）" />
      </div>
      <div class="form-group">
        <label>组照介绍词</label>
        <textarea id="groupDesc" placeholder="写几句关于这组照片的故事或感受..."></textarea>
      </div>

      <div class="form-group">
        <label>选择图片（可多选，最大 20MB/张）</label>
        <div id="dropZone" class="drop-zone">
          <div style="pointer-events:none;">
            <div style="font-size:32px;">📁</div>
            <div>拖拽图片到此处，或点击选择多个文件</div>
            <div class="hint">支持 JPG / PNG / WebP，可一次选多张</div>
          </div>
          <input type="file" id="uploadImg" accept="image/*" multiple />
          <button class="btn" style="margin-top:12px;" onclick="document.getElementById('uploadImg').click()">选择图片文件</button>
        </div>
      </div>

      <div id="fileList" class="file-list"></div>

      <button class="btn" id="submitUpload" onclick="doUpload()" disabled>⬆️ 上传并保存组照</button>
    </section>

    <!-- 外观面板 -->
    <section id="appearancePanel" class="panel hidden">
      <div class="section-title">🎨 外观设置</div>
      <div class="form-group">
        <label>背景颜色/图片</label>
        <input id="boardBg" type="color" value="#0b0f1a" />
      </div>
      <div class="form-group">
        <label>背景板颜色</label>
        <input id="boardColor" type="color" value="#12182b" />
      </div>
      <div class="form-group">
        <label>标题字体</label>
        <select id="titleFont"></select>
      </div>
      <div class="form-group">
        <label>正文字体</label>
        <select id="bodyFont"></select>
      </div>
      <div class="form-group">
        <label>策展人字体</label>
        <select id="curatorFont"></select>
      </div>
      <div class="form-group">
        <label>自定义字体（上传 woff2/ttf）</label>
        <div id="customFontDrop" class="drop-zone" style="padding:24px;">
          <div style="pointer-events:none;">
            <div style="font-size:28px;">📁</div>
            <div>拖拽字体文件到此处，或点击选择</div>
          </div>
          <input type="file" id="uploadFont" accept=".woff2,.woff,.ttf,.otf" />
          <button class="btn" style="margin-top:12px;" onclick="document.getElementById('uploadFont').click()">选择字体文件</button>
        </div>
        <div id="fontList" style="margin-top:8px;font-size:12px;color:var(--sub);"></div>
      </div>
      <button class="btn" onclick="exportTheme()">⬇️ 导出外观 (theme.json)</button>
      <button class="btn" onclick="importTheme()">⬆️ 导入外观</button>
    </section>

    <!-- 策展人面板 -->
    <section id="curatorPanel" class="panel hidden">
      <div class="section-title">👤 策展人管理</div>
      <div class="form-group">
        <label>当前策展人</label>
        <select id="curatorSelect"></select>
      </div>
      <button class="btn" onclick="openCuratorEdit()">✏️ 编辑</button>
      <button class="btn" onclick="addCurator()">➕ 新增</button>
    </section>

    <!-- 设置面板 -->
    <section id="settingPanel" class="panel hidden">
      <div class="section-title">⚙ 系统设置</div>
      <div class="form-group">
        <label>数据备份</label>
        <button class="btn" onclick="exportData()">⬇️ 导出数据 (data.json)</button>
        <button class="btn" onclick="importData()">⬆️ 导入数据</button>
      </div>
    </section>
  </main>
</div>

<script>
/* ====== 状态 ====== */
let currentAdminTab = 'upload';
let data = { groups:[], curators:[], theme:{ customFonts:[] } };
let loginUser = '海屿';

/* ====== Toast ====== */
function toast(msg){
  const t = document.createElement('div');
  t.className='toast show';
  t.innerText=msg;
  document.body.appendChild(t);
  setTimeout(()=>{ t.remove(); },2200);
}

/* ====== Nav ====== */
function renderNav(){
  const nav = document.getElementById('nav');
  nav.innerHTML = `
    <a href="#" onclick="switchAdmin('upload')" class="${currentAdminTab=='upload'?'active':''}">📤 上传</a>
    <a href="#" onclick="switchAdmin('appearance')" class="${currentAdminTab=='appearance'?'active':''}">🎨 外观</a>
    <a href="#" onclick="switchAdmin('curator')" class="${currentAdminTab=='curator'?'active':''}">👤 策展人</a>
    <a href="#" onclick="switchAdmin('setting')" class="${currentAdminTab=='setting'?'active':''}">⚙ 设置</a>
  `;
  document.getElementById('adminPanel').classList.remove('hidden');
  switchAdmin(currentAdminTab);
}

function switchAdmin(tab){
  currentAdminTab=tab;
  ['uploadPanel','appearancePanel','curatorPanel','settingPanel'].forEach(p=>document.getElementById(p).classList.add('hidden'));
  document.getElementById(tab+'Panel').classList.remove('hidden');
  renderNav();
  if(tab==='upload') renderUpload();
  if(tab==='appearance') renderAppearance();
  if(tab==='curator') renderCurator();
}

/* ====== Upload ====== */
let uploadFiles = [];
function bindUploadZone(){
  const zone = document.getElementById('dropZone');
  const input = document.getElementById('uploadImg');
  if(!zone || !input) return;
  zone.addEventListener('click', e => {
    if(e.target !== input) input.click();
  });
  zone.addEventListener('dragover', e => { e.preventDefault(); zone.style.borderColor='var(--klein)'; });
  zone.addEventListener('dragleave', e => { zone.style.borderColor='var(--border)'; });
  zone.addEventListener('drop', e => {
    e.preventDefault(); zone.style.borderColor='var(--border)';
    handleFiles(input, e.dataTransfer.files);
  });
  input.addEventListener('change', () => handleFiles(input, input.files));
}
function handleFiles(inputEl, files){
  uploadFiles = Array.from(files).filter(f => f.type.startsWith('image/'));
  renderFileList();
  checkSubmit();
}
function renderFileList(){
  const ul = document.getElementById('fileList');
  ul.innerHTML = '';
  uploadFiles.forEach((f,i)=>{
    const li = document.createElement('div');
    li.className='file-item';
    li.innerHTML = `<div class="name">🖼 ${f.name} (${Math.round(f.size/1024)}KB)</div><div class="remove" onclick="removeFile(${i})">×</div>`;
    ul.appendChild(li);
  });
}
function removeFile(i){
  uploadFiles.splice(i,1);
  renderFileList();
  checkSubmit();
}
function checkSubmit(){
  const ok = uploadFiles.length>0 && document.getElementById('groupTitle').value.trim().length>0;
  document.getElementById('submitUpload').disabled = !ok;
}
function doUpload(){
  const title = document.getElementById('groupTitle').value.trim();
  const desc = document.getElementById('groupDesc').value.trim();
  if(!title || uploadFiles.length===0){
    toast('请填写标题并选择至少一张图片');
    return;
  }
  const id = 'g_'+Date.now();
  data.groups.push({
    id,
    title,
    desc,
    imgs: uploadFiles.map(f => ({ name:f.name, size:f.size, url:URL.createObjectURL(f) })),
    curator:loginUser
  });
  toast(`✅ 上传成功：${uploadFiles.length} 张图片`);
  uploadFiles=[];
  renderFileList();
  document.getElementById('groupTitle').value='';
  document.getElementById('groupDesc').value='';
  checkSubmit();
  saveData();
}

/* ====== Appearance ====== */
function renderAppearance(){
  ['titleFont','bodyFont','curatorFont'].forEach(id=>{
    const s = document.getElementById(id);
    s.innerHTML='';
    ['默认','站酷快乐体','思源黑体','自定义'].forEach(font=>{
      const o = document.createElement('option');
      o.value=font;
      o.innerText=font;
      s.appendChild(o);
    });
  });
  renderCustomFonts();
}
function renderCustomFonts(){
  const list = document.getElementById('fontList');
  list.innerHTML = data.theme.customFonts.map(f=>`<div>${f.name}</div>`).join('');
}
function bindFontZone(){
  const zone = document.getElementById('customFontDrop');
  const input = document.getElementById('uploadFont');
  if(!zone || !input) return;
  zone.addEventListener('click', e => {
    if(e.target !== input) input.click();
  });
  zone.addEventListener('dragover', e => { e.preventDefault(); zone.style.borderColor='var(--klein)'; });
  zone.addEventListener('dragleave', e => { zone.style.borderColor='var(--border)'; });
  zone.addEventListener('drop', e => {
    e.preventDefault(); zone.style.borderColor='var(--border)';
    handleFonts(input, e.dataTransfer.files);
  });
  input.addEventListener('change', () => handleFonts(input, input.files));
}
function handleFonts(inputEl, files){
  Array.from(files).forEach(f=>{
    const reader = new FileReader();
    reader.onload = e => {
      data.theme.customFonts.push({ name:f.name, data:e.target.result });
      renderCustomFonts();
      toast(`✅ 字体 ${f.name} 已添加（当前会话有效，记得导出 theme.json）`);
      applyCustomFonts();
    };
    reader.readAsDataURL(f);
  });
}
function applyCustomFonts(){
  const style = document.getElementById('customFontStyle') || document.createElement('style');
  style.id='customFontStyle';
  style.innerHTML = data.theme.customFonts.map((f,i)=>`
    @font-face{ font-family:'custom${i}'; src:url('${f.data}'); }
  `).join('');
  document.head.appendChild(style);
}
function exportTheme(){
  const blob = new Blob([JSON.stringify(data.theme,null,2)],{type:'application/json'});
  const a = document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='theme.json';
  a.click();
  toast('✅ 外观已导出');
}
function importTheme(){
  const input = document.createElement('input');
  input.type='file';
  input.accept='.json';
  input.onchange = e => {
    const file = e.target.files[0];
    const reader = new FileReader();
    reader.onload = ev => {
      try {
        data.theme = JSON.parse(ev.target.result);
        renderAppearance();
        applyCustomFonts();
        toast('✅ 外观导入成功');
      } catch(e){ toast('❌ 导入失败'); }
    };
    reader.readAsText(file);
  };
  input.click();
}

/* ====== Curator ====== */
function renderCurator(){
  const sel = document.getElementById('curatorSelect');
  sel.innerHTML='';
  data.curators.forEach(c=>{
    const o = document.createElement('option');
    o.value=c.id;
    o.innerText=c.name;
    sel.appendChild(o);
  });
}
function openCuratorEdit(){
  const id = document.getElementById('curatorSelect').value;
  const c = data.curators.find(x=>x.id===id);
  const name = prompt('策展人名字',c?.name||'');
  if(name){
    if(!c) data.curators.push({id:'c_'+Date.now(),name});
    else c.name=name;
    renderCurator();
    saveData();
    toast('✅ 已保存');
  }
}
function addCurator(){
  const name = prompt('新策展人名字');
  if(name){
    data.curators.push({id:'c_'+Date.now(),name});
    renderCurator();
    saveData();
    toast('✅ 已添加');
  }
}

/* ====== Setting ====== */
function exportData(){
  const blob = new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const a = document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='data.json';
  a.click();
  toast('✅ 数据已导出');
}
function importData(){
  const input = document.createElement('input');
  input.type='file';
  input.accept='.json';
  input.onchange = e => {
    const file = e.target.files[0];
    const reader = new FileReader();
    reader.onload = ev => {
      try {
        data = JSON.parse(ev.target.result);
        renderUpload();
        renderAppearance();
        renderCurator();
        toast('✅ 数据导入成功');
      } catch(e){ toast('❌ 导入失败'); }
    };
    reader.readAsText(file);
  };
  input.click();
}

/* ====== Save / Load ====== */
function saveData(){
  try {
    localStorage.setItem('mirror_world_data', JSON.stringify(data));
    // 提示用户导出持久化
    console.log('数据已存 localStorage，请记得在“设置”中导出 data.json 覆盖 GitHub 以保持永久生效。');
  } catch(e){
    toast('❌ 存储失败（可能超限）');
  }
}
function loadData(){
  const d = localStorage.getItem('mirror_world_data');
  if(d) data = JSON.parse(d);
  if(!data.groups) data.groups=[];
  if(!data.curators) data.curators=[{id:'default',name:loginUser}];
  if(!data.theme) data.theme={ customFonts:[] };
}

/* ====== Init ====== */
function init(){
  loadData();
  renderNav();
  bindUploadZone();
  bindFontZone();
  document.getElementById('groupTitle').addEventListener('input',checkSubmit);
  document.getElementById('loginName').innerText=loginUser;
  toast('🎉 镜中世界后台已就绪');
}

function logout(){
  if(confirm('确定退出？')) location.href='.';
}

init();
</script>
</body>
</html>
