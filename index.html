<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>镜中世界 · 线上画廊</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:#0a1a10;color:#e0e0e0;line-height:1.7;overflow-x:hidden}
:root{--klein:#002fa7;--green:#0d2818;--gold:#c9a84c}
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-track{background:#0a1a10}
::-webkit-scrollbar-thumb{background:var(--klein);border-radius:3px}

/* 导航 */
.navbar{position:fixed;top:0;left:0;right:0;height:64px;background:rgba(13,40,24,0.95);backdrop-filter:blur(14px);display:flex;align-items:center;justify-content:space-between;padding:0 32px;z-index:900;border-bottom:1px solid rgba(255,255,255,0.06)}
.nav-brand{font-size:22px;font-weight:700;letter-spacing:4px;color:#fff;cursor:pointer;display:flex;align-items:center;gap:10px}
.nav-brand svg{width:28px;height:28px}
.nav-links{display:flex;align-items:center;gap:18px}
.nav-links a{color:rgba(255,255,255,0.7);text-decoration:none;font-size:14px;transition:.3s;padding:6px 14px;border-radius:20px}
.nav-links a:hover{color:#fff;background:rgba(255,255,255,0.06)}
.nav-admin{background:var(--klein)!important;color:#fff!important;padding:6px 20px!important;border-radius:30px!important}

/* Hero */
.hero{height:70vh;min-height:420px;background:linear-gradient(160deg,#0a1a10 0%,#001633 50%,#0a1a10 100%);display:flex;align-items:center;justify-content:center;text-align:center;padding-top:64px}
.hero h1{font-size:68px;letter-spacing:12px;color:#fff;margin-bottom:16px;text-shadow:0 4px 40px rgba(0,47,167,0.3)}
.hero p{font-size:18px;color:rgba(255,255,255,0.55);max-width:520px;margin:0 auto}
.hero .curator{color:var(--gold);font-size:15px;letter-spacing:3px;margin-top:12px}

/* 展览区 */
.section{max-width:1200px;margin:0 auto;padding:80px 24px}
.section-title{font-size:32px;letter-spacing:4px;color:#fff;margin-bottom:44px;text-align:center}
.section-title::after{content:'';display:block;width:50px;height:2px;background:var(--klein);margin:14px auto 0}

/* 展览卡片网格 */
.exhibition-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:28px}
.exhibition-card{background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);border-radius:18px;padding:32px 28px;cursor:pointer;transition:.4s;position:relative;overflow:hidden}
.exhibition-card:hover{border-color:var(--klein);transform:translateY(-6px);background:rgba(255,255,255,0.07)}
.exhibition-card h3{font-size:22px;color:#fff;margin-bottom:8px;letter-spacing:1px}
.exhibition-card .tags{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.exhibition-card .tag{background:rgba(0,47,167,0.2);color:#8ab4ff;padding:2px 12px;border-radius:20px;font-size:11px}
.exhibition-card p{color:rgba(255,255,255,0.45);font-size:14px;line-height:1.8}
.exhibition-card .enter-hint{color:var(--klein);font-size:13px;margin-top:16px;opacity:0;transition:.4s}
.exhibition-card:hover .enter-hint{opacity:1}
.exhibition-card .view-count{color:rgba(255,255,255,0.35);font-size:12px;margin-top:8px}

/* 专栏 */
.column-article{background:rgba(255,255,255,0.035);border:1px solid rgba(255,255,255,0.07);border-radius:16px;padding:28px 30px;margin-bottom:20px}
.column-article h3{font-size:20px;color:#fff;margin-bottom:4px}
.column-article .date{color:rgba(255,255,255,0.3);font-size:13px;margin-bottom:10px}
.column-article .body{color:rgba(255,255,255,0.5);font-size:14px;line-height:1.9;white-space:pre-wrap}

/* 策展人 */
.curator-section{margin-top:20px}
.curator-block{display:flex;gap:40px;align-items:flex-start;padding:48px 0;border-bottom:1px solid rgba(255,255,255,0.05);max-width:1000px;margin:0 auto}
.curator-block:nth-child(even){flex-direction:row-reverse}
.curator-photo{width:42%;aspect-ratio:3/4;object-fit:cover;border-radius:16px;background:#111;box-shadow:0 20px 60px rgba(0,0,0,0.5),0 0 40px rgba(0,47,167,0.15);flex-shrink:0}
.curator-info{flex:1;display:flex;flex-direction:column;justify-content:center}
.curator-info .index{color:var(--klein);font-size:13px;letter-spacing:3px;margin-bottom:8px}
.curator-info h3{font-size:42px;color:#fff;margin-bottom:6px;letter-spacing:2px;line-height:1.2}
.curator-info .role{color:var(--gold);font-size:15px;letter-spacing:2px;margin-bottom:16px}
.curator-info .bio{color:rgba(255,255,255,0.5);font-size:15px;line-height:2;white-space:pre-wrap}
.curator-info .contact{color:var(--gold);font-size:13px;margin-top:14px;letter-spacing:1px}

/* 页脚 */
.footer{text-align:center;padding:40px 24px;color:rgba(255,255,255,0.2);font-size:13px;border-top:1px solid rgba(255,255,255,0.04)}

/* ===== 展览详情页 ===== */
.detail-page{display:none;min-height:100vh;padding-top:64px}
.detail-back{padding:24px 32px 0;max-width:1200px;margin:0 auto}
.detail-back a{color:rgba(255,255,255,0.5);text-decoration:none;font-size:14px;cursor:pointer;transition:.3s}
.detail-back a:hover{color:#fff}
.detail-header{padding:40px 32px 20px;max-width:1200px;margin:0 auto}
.detail-header h1{font-size:38px;color:#fff;letter-spacing:3px;margin-bottom:8px}
.detail-header .statement{color:rgba(255,255,255,0.5);font-size:15px;line-height:1.9;max-width:800px}
.detail-group{margin-bottom:60px;max-width:1200px;margin-left:auto;margin-right:auto;padding:0 32px}
.detail-group h2{font-size:22px;color:#fff;margin-bottom:6px;letter-spacing:1px}
.detail-group .group-desc{color:rgba(255,255,255,0.4);font-size:14px;margin-bottom:20px;line-height:1.8}
.photo-board{background:var(--board-color,#1a1a2e);border-radius:16px;padding:20px;margin-bottom:24px;box-shadow:0 12px 40px rgba(0,0,0,0.4),0 4px 12px rgba(0,0,0,0.3),inset 0 1px 0 rgba(255,255,255,0.05);border-top:4px solid var(--klein);transition:.4s}
.photo-board:hover{transform:translateY(-4px);box-shadow:0 20px 60px rgba(0,0,0,0.5),0 0 30px rgba(0,47,167,0.2)}
.photo-board img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;border-radius:10px;background:#111}
.photo-board .info{padding:14px 8px 4px}
.photo-board .info h4{font-size:16px;color:#fff;margin-bottom:2px}
.photo-board .info p{font-size:13px;color:rgba(255,255,255,0.4)}

/* ===== 后台 ===== */
.admin-page{display:none;min-height:100vh;padding-top:64px;background:#0a1510}
.admin-container{display:flex;min-height:calc(100vh - 64px)}
.admin-sidebar{width:220px;background:rgba(0,0,0,0.3);padding:24px 0;border-right:1px solid rgba(255,255,255,0.05);flex-shrink:0;overflow-y:auto}
.admin-sidebar a{display:block;padding:10px 22px;color:rgba(255,255,255,0.5);text-decoration:none;font-size:13px;transition:.3s;cursor:pointer;border-left:3px solid transparent}
.admin-sidebar a:hover,.admin-sidebar a.active{color:#fff;background:rgba(0,47,167,0.12);border-left-color:var(--klein)}
.admin-sidebar .sub-item{padding-left:36px;font-size:12px}
.admin-sidebar .logout-item{color:#ff6b6b!important;margin-top:20px;border-top:1px solid rgba(255,255,255,0.05);padding-top:14px}
.admin-topbar{display:flex;justify-content:space-between;align-items:center;padding:0 32px;height:48px;background:rgba(0,0,0,0.2);border-bottom:1px solid rgba(255,255,255,0.04)}
.admin-topbar .breadcrumb{color:rgba(255,255,255,0.4);font-size:13px}
.admin-topbar .admin-user{color:rgba(255,255,255,0.5);font-size:13px;display:flex;align-items:center;gap:12px}
.admin-topbar .admin-user button{background:#a83232;color:#fff;border:none;padding:5px 14px;border-radius:20px;cursor:pointer;font-size:12px}
.admin-main{flex:1;padding:28px 36px;overflow-y:auto}
.admin-main h2{font-size:24px;color:#fff;margin-bottom:20px;letter-spacing:2px}
.admin-form label{display:block;color:rgba(255,255,255,0.6);margin:12px 0 4px;font-size:13px}
.admin-form input,.admin-form textarea,.admin-form select{width:100%;padding:10px 14px;border:1px solid rgba(255,255,255,0.12);border-radius:10px;background:rgba(255,255,255,0.04);color:#fff;font-size:14px;outline:none;transition:.3s}
.admin-form input:focus,.admin-form textarea:focus{border-color:var(--klein)}
.admin-form textarea{min-height:90px;resize:vertical}
.btn{background:var(--klein);color:#fff;border:none;padding:10px 26px;border-radius:30px;cursor:pointer;font-size:14px;transition:.3s;margin-top:10px}
.btn:hover{background:#003bb5;transform:translateY(-1px)}
.btn-danger{background:#a83232;color:#fff;border:none;padding:6px 14px;border-radius:20px;cursor:pointer;font-size:12px;transition:.3s}
.btn-danger:hover{background:#c73e3e}
.btn-success{background:#2a8a4a;color:#fff;border:none;padding:8px 20px;border-radius:30px;cursor:pointer;font-size:13px}
.admin-list-item{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid rgba(255,255,255,0.04)}
.admin-list-item span{color:rgba(255,255,255,0.6);font-size:14px}
.admin-empty{color:rgba(255,255,255,0.2);text-align:center;padding:40px 0;font-size:14px}
.toast{position:fixed;bottom:40px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.85);color:#fff;padding:12px 28px;border-radius:30px;font-size:14px;z-index:9999;opacity:0;transition:.4s;pointer-events:none}
.toast.show{opacity:1}

/* 登录弹窗 */
.login-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.82);backdrop-filter:blur(8px);z-index:5000;display:none;align-items:center;justify-content:center}
.login-card{background:#141e18;border:1px solid rgba(255,255,255,0.1);border-radius:20px;padding:40px 36px;width:340px;text-align:center}
.login-card h2{color:#fff;font-size:24px;letter-spacing:3px;margin-bottom:20px}
.login-card input{width:100%;padding:12px 16px;margin-bottom:14px;border:1px solid rgba(255,255,255,0.15);border-radius:10px;background:rgba(255,255,255,0.06);color:#fff;font-size:15px;outline:none}
.login-card input:focus{border-color:var(--klein)}
.login-card button{width:100%;padding:12px;border:none;border-radius:10px;background:var(--klein);color:#fff;font-size:16px;font-weight:600;cursor:pointer;transition:.3s}
.login-card button:hover{background:#003bb5}
.login-card .error{color:#ff6b6b;font-size:13px;margin-top:12px;min-height:20px}

/* 弹窗 */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.75);backdrop-filter:blur(6px);z-index:3000;display:none;align-items:center;justify-content:center;padding:20px}
.modal-content{background:#141e18;border:1px solid rgba(255,255,255,0.1);border-radius:20px;width:90%;max-width:680px;max-height:85vh;overflow-y:auto;padding:32px 36px;position:relative}
.modal-close{position:absolute;top:14px;right:20px;font-size:28px;color:rgba(255,255,255,0.4);cursor:pointer}
.modal-close:hover{color:#fff}

/* 拖拽区 */
.drop-zone{border:2px dashed rgba(255,255,255,0.15);border-radius:14px;padding:28px;text-align:center;cursor:pointer;transition:.3s;margin-top:8px;position:relative}
.drop-zone:hover,.drop-zone.dragover{border-color:var(--klein);background:rgba(0,47,167,0.05)}
.drop-zone .dz-btn{display:inline-block;background:var(--klein);color:#fff;padding:8px 22px;border-radius:30px;font-size:14px;margin-top:10px;cursor:pointer}
.drop-zone input[type="file"]{display:none}
.drop-zone .file-list{margin-top:12px;text-align:left}
.drop-zone .file-item{display:flex;justify-content:space-between;align-items:center;padding:6px 12px;background:rgba(255,255,255,0.04);border-radius:8px;margin-bottom:4px;font-size:13px;color:rgba(255,255,255,0.6)}

/* 颜色选择 */
.color-picker-row{display:flex;align-items:center;gap:12px;margin-top:8px;flex-wrap:wrap}
.color-picker-row input[type="color"]{width:48px;height:36px;border:none;border-radius:8px;cursor:pointer;background:transparent}
.color-swatch{width:28px;height:28px;border-radius:50%;cursor:pointer;border:2px solid rgba(255,255,255,0.1);transition:.3s}
.color-swatch:hover{border-color:#fff;transform:scale(1.15)}

/* 进度条 */
.progress-bar{width:100%;height:8px;background:rgba(255,255,255,0.08);border-radius:4px;overflow:hidden;margin-top:10px}
.progress-fill{height:100%;background:var(--klein);border-radius:4px;transition:.3s;width:0%}

/* 浏览量统计条 */
.view-bar{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid rgba(255,255,255,0.04)}
.view-bar .vb-label{color:rgba(255,255,255,0.6);font-size:14px;min-width:160px}
.view-bar .vb-track{flex:1;height:8px;background:rgba(255,255,255,0.06);border-radius:4px;overflow:hidden}
.view-bar .vb-fill{height:100%;background:linear-gradient(90deg,var(--klein),var(--gold));border-radius:4px;transition:.5s}
.view-bar .vb-count{color:#fff;font-size:14px;min-width:50px;text-align:right}

/* 策展人卡片（后台列表） */
.curator-card-admin{display:flex;gap:20px;align-items:flex-start;padding:20px;background:rgba(255,255,255,0.03);border-radius:14px;margin-bottom:16px;border:1px solid rgba(255,255,255,0.06)}
.curator-card-admin .photo{width:100px;height:130px;object-fit:cover;border-radius:10px;background:#111;flex-shrink:0}
.curator-card-admin .info{flex:1}
.curator-card-admin .info h4{color:#fff;font-size:18px;margin-bottom:4px}
.curator-card-admin .info .role{color:var(--gold);font-size:13px;margin-bottom:8px}
.curator-card-admin .info .bio-preview{color:rgba(255,255,255,0.4);font-size:13px;line-height:1.6}
.curator-card-admin .actions{display:flex;flex-direction:column;gap:8px;flex-shrink:0}

/* 预览区 */
.preview-box{margin-top:16px;padding:20px;background:rgba(255,255,255,0.03);border-radius:12px;border:1px solid rgba(255,255,255,0.06)}
.preview-box .pb-title{font-size:24px;color:#fff;margin-bottom:6px}
.preview-box .pb-body{font-size:14px;color:rgba(255,255,255,0.5);line-height:1.8}

/* 响应式 */
@media(max-width:768px){
  .hero h1{font-size:40px;letter-spacing:6px}
  .exhibition-grid{grid-template-columns:1fr}
  .admin-sidebar{width:140px}
  .admin-sidebar a{padding:8px 14px;font-size:12px}
  .admin-main{padding:16px}
  .curator-block{flex-direction:column!important;gap:20px}
  .curator-photo{width:100%;max-width:320px}
}
</style>
</head>

<!-- 导航 -->
<nav class="navbar">
  <div class="nav-brand" onclick="showHome()">
    <svg viewBox="0 0 40 40" fill="none"><circle cx="20" cy="20" r="16" stroke="currentColor" stroke-width="1.5"/><circle cx="20" cy="20" r="10" stroke="currentColor" stroke-width="1.2"/><circle cx="29" cy="11" r="3" fill="currentColor" opacity="0.6"/></svg>
    镜中世界
  </div>

    <a href="#" onclick="document.getElementById('curator').scrollIntoView({behavior:'smooth'})">策展人</a>

<!-- 登录弹窗 -->
<div class="login-overlay" id="loginOverlay">
  <div class="login-card">
    <h2>🔐 内部管理</h2>
    <input type="text" id="loginUser" placeholder="账号" value="海屿">
    <input type="password" id="loginPass" placeholder="密码">
    <button onclick="handleLogin()">验证身份</button>
    <div class="error" id="loginError"></div>
  </div>
</div>

<!-- ===== 首页 ===== -->
<div id="homePage">
<section class="hero">
  <div>
    <h1>镜中世界</h1>
    <p>摄影是现实的一面透镜，也是通往另一个世界的窗口。</p>

</section>

<section class="section" id="exhibitions">

</section>

<!-- ===== 展览详情页 ===== -->
<div class="detail-page" id="detailPage">

</div>

<!-- ===== 后台管理页 ===== -->
<div class="admin-page" id="adminPage">
  <div class="admin-topbar">
    <div class="breadcrumb" id="breadcrumb">⚙ 内部管理</div>
    <div class="admin-user">
      <span>登录身份：<span id="adminName"></span></span>
      <button onclick="logout()">🚪 退出登录</button>
    </div>
  </div>
  <div class="admin-container">
    <div class="admin-sidebar" id="adminSidebar"></div>
    <div class="admin-main" id="adminMain"></div>
  </div>
</div>

<!-- 策展人编辑弹窗 -->
<div class="modal-overlay" id="curatorModal">
  <div class="modal-content">
    <span class="modal-close" onclick="closeCuratorModal()">×</span>
    <h2 id="curatorModalTitle">编辑策展人</h2>
    <div class="admin-form">
      <div style="display:flex;gap:24px;align-items:flex-start;margin-top:16px">
        <div>
          <div style="width:120px;height:150px;border-radius:12px;overflow:hidden;background:#111;border:1px solid rgba(255,255,255,0.1)">
            <img id="curatorModalPhoto" style="width:100%;height:100%;object-fit:cover;display:block">
          </div>
          <label style="margin-top:12px">更换写真</label>
          <input type="file" id="curatorModalFile" accept="image/*" style="font-size:13px;color:rgba(255,255,255,0.5)">
        </div>
        <div style="flex:1">
          <label>姓名</label>
          <input type="text" id="curatorModalName">
          <label>头衔</label>
          <input type="text" id="curatorModalRole">
          <label>履历</label>
          <textarea id="curatorModalBio" style="min-height:140px"></textarea>
        </div>
      </div>
      <div style="display:flex;gap:12px;margin-top:20px;justify-content:flex-end">
        <button class="btn-danger" id="curatorModalDelete" onclick="deleteCuratorFromModal()">🗑 删除策展人</button>
        <button class="btn" onclick="saveCuratorFromModal()">💾 保存修改</button>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ============ 数据 ============
const STORAGE_KEY = 'mirror_world_data';
const ACCOUNT_KEY = 'mirror_world_account';
const SESSION_KEY = 'mirror_admin_logged';
const THEME_KEY = 'mirror_world_theme';

const defaultAccount = { username: '海屿', password: 'mse20221028' };
const defaultData = {
  exhibitions: [

const defaultTheme = {
  bgColor:'#0a1a10', bgImage:'', bgDarken:40,
  boardColor:'#1a1a2e',
  titleFont:'', bodyFont:'', curatorFont:'',
  customFonts:{}
};

// ===== 从远程 JSON 加载数据 =====
async function loadRemoteData() {
  try {
    const r1 = await fetch('./data.json?_='+Date.now());
    if(r1.ok){ const d=await r1.json(); localStorage.setItem(STORAGE_KEY,JSON.stringify(d)); }
  }catch(e){}
  try {
    const r2 = await fetch('./theme.json?_='+Date.now());
    if(r2.ok){ const t=await r2.json(); localStorage.setItem(THEME_KEY,JSON.stringify(t)); }
  }catch(e){}
}

function getData(){return JSON.parse(localStorage.getItem(STORAGE_KEY))||defaultData}
function saveData(d){localStorage.setItem(STORAGE_KEY,JSON.stringify(d))}
function getTheme(){return JSON.parse(localStorage.getItem(THEME_KEY))||defaultTheme}
function saveTheme(t){localStorage.setItem(THEME_KEY,JSON.stringify(t))}

// ============ 初始化 ============
if(!localStorage.getItem(ACCOUNT_KEY)) localStorage.setItem(ACCOUNT_KEY,JSON.stringify(defaultAccount));
if(!localStorage.getItem(THEME_KEY)) localStorage.setItem(THEME_KEY,JSON.stringify(defaultTheme));

(async()=>{
  await loadRemoteData();
  if(!localStorage.getItem(STORAGE_KEY)) saveData(defaultData);
  // 兼容旧数据：确保 exhibitions 有 views 和 style 和 groups
  const data=getData();
  data.exhibitions.forEach(ex=>{
    if(ex.views===undefined) ex.views=0;
    if(!ex.style) ex.style={boardColor:'#1a1a2e',titleFont:'',bodyFont:''};
    if(!ex.groups) ex.groups=[];
    if(!ex.artworks) ex.artworks=[];
    // 迁移旧 artworks 到 groups
    if(ex.artworks.length>0 && ex.groups.length===0){
      ex.groups.push({id:'g'+Date.now(),title:'默认组照',desc:'',photos:ex.artworks.map(a=>({src:a.image,title:a.title,desc:a.desc||''})),boardColor:ex.style.boardColor||'#1a1a2e'});
    }
  });
  saveData(data);
  applyTheme();
  renderHome();
})();

// ============ 主题应用 ============
function applyTheme(){
  const t=getTheme();
  document.body.style.background=t.bgColor||'#0a1a10';
  if(t.bgImage){
    document.body.style.backgroundImage=`url(${t.bgImage})`;
    document.body.style.backgroundSize='cover';
    document.body.style.backgroundAttachment='fixed';
    const darken=t.bgDarken||40;
    document.body.style.background=`linear-gradient(rgba(0,0,0,${darken/100}),rgba(0,0,0,${darken/100})),url(${t.bgImage})`;
    document.body.style.backgroundSize='cover';
    document.body.style.backgroundAttachment='fixed';
  }
  // 注册自定义字体
  if(t.customFonts){
    Object.keys(t.customFonts).forEach(name=>{
      const f=t.customFonts[name];
      let ff=name.replace(/[^a-zA-Z0-9]/g,'');
      if(!document.getElementById('font-'+ff)){
        const style=document.createElement('style');
        style.id='font-'+ff;
        style.textContent=`@font-face{font-family:"${name}";src:url(${f.data}) format("${f.format}");font-display:swap;}`;
        document.head.appendChild(style);
      }
    });
  }
  // 应用字体
  if(t.titleFont) document.documentElement.style.setProperty('--title-font',t.titleFont);
  if(t.bodyFont) document.documentElement.style.setProperty('--body-font',t.bodyFont);
  if(t.curatorFont) document.documentElement.style.setProperty('--curator-font',t.curatorFont);
}

// ============ 首页渲染 ============
function renderHome(){
  const data=getData();
  const theme=getTheme();
  document.getElementById('exhibitionGrid').innerHTML=data.exhibitions.map((ex,i)=>{
    const groupCount=ex.groups?ex.groups.length:0;
    const photoCount=(ex.groups||[]).reduce((s,g)=>s+(g.photos?g.photos.length:0),0);
    return `
    <div class="exhibition-card" onclick="showDetail('${ex.id}')">
      <div class="tags">${ex.tags.map(t=>`<span class="tag">${t}</span>`).join('')}</div>
      <h3>${ex.title}</h3>
      <p>${ex.statement.slice(0,100)}${ex.statement.length>100?'...':''}</p>
      <div class="enter-hint">点击进入展览 →</div>
      <div class="view-count">📷 ${groupCount} 组 · ${photoCount} 张${ex.views?` · 👁 ${ex.views} 次浏览`:''}</div>
    </div>`;
  }).join('');

  document.getElementById('columnList').innerHTML=data.columns.map(c=>`
    <div class="column-article">
      <h3>${c.title}</h3>
      <div class="date">${c.date}</div>
      <div class="body">${c.body.slice(0,200)}${c.body.length>200?'...':''}</div>
    </div>`).join('')||'<div class="admin-empty">暂无专栏文章</div>';

  // 策展人渲染
  const cc=document.getElementById('curatorContainer');
  cc.innerHTML=data.curator.map((c,i)=>{
    const contact=(c.bio.match(/联系方式[：:]\s*\S+/)||[''])[0];
    const bioMain=c.bio.replace(/联系方式[：:]\s*\S+/,'').trim();
    const photoHtml=c.photo?`<img class="curator-photo" src="${c.photo}" alt="${c.name}">`:`<div class="curator-photo" style="display:flex;align-items:center;justify-content:center;background:#1a1a2e"><svg width="48" height="48" viewBox="0 0 24 24" fill="rgba(255,255,255,0.15)"><path d="M12 12a5 5 0 100-10 5 5 0 000 10zm0 2c-5 0-9 2.5-9 6v2h18v-2c0-3.5-4-6-9-6z"/></svg></div>`;
    return `
    <div class="curator-block">
      ${photoHtml}
      <div class="curator-info">
        <div class="index">— 0${i+1} / 0${data.curator.length} —</div>
        <h3>${c.name}</h3>
        <div class="role">${c.role}</div>
        <div class="bio">${bioMain.replace(/\n/g,'<br>')}</div>
        ${contact?`<div class="contact">${contact}</div>`:''}
      </div>
    </div>`;
  }).join('');
}

// ============ 展览详情 ============
function showDetail(id){
  const data=getData();
  const ex=data.exhibitions.find(e=>e.id===id);
  if(!ex) return toast('展览不存在');
  // 浏览量+1
  ex.views=(ex.views||0)+1;
  saveData(data);

  document.getElementById('homePage').style.display='none';
  document.getElementById('adminPage').style.display='none';
  document.getElementById('detailPage').style.display='block';
  document.getElementById('detailHeader').innerHTML=`
    <h1>${ex.title}</h1>
    <div class="statement">${ex.statement.replace(/\n/g,'<br>')}</div>
    <div style="color:rgba(255,255,255,0.3);font-size:13px;margin-top:8px">👁 ${ex.views} 次浏览</div>
  `;
  const groups=ex.groups||[];
  const boardColor=ex.style&&ex.style.boardColor?ex.style.boardColor:'#1a1a2e';
  document.getElementById('detailGroups').innerHTML=groups.length?groups.map(g=>{
    const gc=g.boardColor||boardColor;
    return `
    <div class="detail-group">
      <h2>${g.title}</h2>
      ${g.desc?`<div class="group-desc">${g.desc.replace(/\n/g,'<br>')}</div>`:''}
      <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:20px">
        ${(g.photos||[]).map(p=>`
          <div class="photo-board" style="--board-color:${gc}">
            <img src="${p.src}" alt="${p.title||''}" loading="lazy">
            <div class="info"><h4>${p.title||''}</h4><p>${p.desc||''}</p></div>
          </div>`).join('')}
      </div>
    </div>`;
  }).join(''):'<div class="admin-empty" style="padding:40px 32px">暂无作品，请在后台上传</div>';
}

// ============ 登录 ============
function openLogin(){
  document.getElementById('loginOverlay').style.display='flex';
  document.getElementById('loginError').textContent='';
}
function handleLogin(){
  const u=document.getElementById('loginUser').value.trim();
  const p=document.getElementById('loginPass').value.trim();
  const acc=JSON.parse(localStorage.getItem(ACCOUNT_KEY));
  if(u===acc.username&&p===acc.password){
    sessionStorage.setItem(SESSION_KEY,'true');
    document.getElementById('loginOverlay').style.display='none';
    enterAdmin();
  }else{
    document.getElementById('loginError').textContent='账号或密码错误';
  }
}
function enterAdmin(){
  if(!sessionStorage.getItem(SESSION_KEY)){openLogin();return}
  const acc=JSON.parse(localStorage.getItem(ACCOUNT_KEY));
  document.getElementById('adminName').textContent=acc.username;
  document.getElementById('homePage').style.display='none';
  document.getElementById('detailPage').style.display='none';
  document.getElementById('adminPage').style.display='block';
  buildSidebar();
  switchAdmin('dashboard');
}
function logout(){
  if(!confirm('确定要退出内部管理吗？')) return;
  sessionStorage.removeItem(SESSION_KEY);
  showHome();
}

// ============ 字体选项 ============
function fontOptions(selected){
  const builtin=[
    {name:'系统默认',val:''},
    {name:'Noto Serif SC（思源宋体）',val:'"Noto Serif SC",serif'},
    {name:'Noto Sans SC（思源黑体）',val:'"Noto Sans SC",sans-serif'},
    {name:'Playfair Display',val:'"Playfair Display",serif'},
    {name:'Cormorant Garamond',val:'"Cormorant Garamond",serif'},
    {name:'Inter',val:'"Inter",sans-serif'},
    {name:'DM Serif Display',val:'"DM Serif Display",serif'},
    {name:'Lora',val:'"Lora",serif'},
    {name:'Montserrat',val:'"Montserrat",sans-serif'},
    {name:'思源黑体 Bold',val:'"Source Han Sans CN",sans-serif'},
  ];
  const theme=getTheme();
  const custom=Object.keys(theme.customFonts||{});
  let html='';
  builtin.forEach(f=>{html+=`<option value="${f.val}" ${selected===f.val?'selected':''}>${f.name}</option>`});
  if(custom.length){html+='<optgroup label="自定义字体">';custom.forEach(n=>{html+=`<option value="${n}" ${selected===n?'selected':''}>${n}</option>`});html+='</optgroup>'}
  return html;
}

function editExhibitionStyle(id){

  const c=document.getElementById('exBoard_'+id).value;

function saveExhibitionStyle(id){
  const data=getData();
  const ex=data.exhibitions.find(e=>e.id===id);
  if(!ex) return;
  if(!ex.style) ex.style={};
  ex.style.boardColor=document.getElementById('exBoard_'+id).value;
  ex.style.titleFont=document.getElementById('exTitleFont_'+id).value;
  ex.style.bodyFont=document.getElementById('exBodyFont_'+id).value;

// ============ 组照 ============
function editGroup(exId,gId){
  const data=getData();
  const ex=data.exhibitions.find(e=>e.id===exId);
  const g=ex.groups.find(g=>g.id===gId);
  if(!g) return;
  const newTitle=prompt('组照标题：',g.title);
  if(newTitle===null) return;
  const newDesc=prompt('组照介绍词：',g.desc||'');
  if(newDesc===null) return;
  g.title=newTitle.trim()||g.title;
  g.desc=newDesc.trim();
  saveData(data);
  toast('组照已更新');
  switchAdmin('exhibitions');
}
function deleteGroup(exId,gId){
  const data=getData();
  const ex=data.exhibitions.find(e=>e.id===exId);
  if(!ex) return;
  const g=ex.groups.find(g=>g.id===gId);
  if(!g) return;
  if(!confirm(`确定要删除组照「${g.title}」及其所有照片吗？`)) return;
  ex.groups=ex.groups.filter(g=>g.id!==gId);
  saveData(data);
  toast('组照已删除');
  switchAdmin('exhibitions');
}

function closeCuratorModal(){
  document.getElementById('curatorModal').style.display='none';
  editingCuratorIdx=-1;
}
function saveCuratorFromModal(){
  if(editingCuratorIdx<0) return;
  const data=getData();
  const c=data.curator[editingCuratorIdx];
  c.name=document.getElementById('curatorModalName').value.trim()||c.name;
  c.role=document.getElementById('curatorModalRole').value.trim()||c.role;
  c.bio=document.getElementById('curatorModalBio').value.trim()||c.bio;
  // 处理新上传的写真
  const fileInput=document.getElementById('curatorModalFile');
  if(fileInput.files[0]){
    const reader=new FileReader();
    reader.onload=function(e){
      // 压缩
      const img=new Image();
      img.onload=function(){
        const canvas=document.createElement('canvas');
        let w=img.width,h=img.height;
        const max=800;
        if(w>max){h=Math.round(h*(max/w));w=max}
        canvas.width=w;canvas.height=h;
        canvas.getContext('2d').drawImage(img,0,0,w,h);
        c.photo=canvas.toDataURL('image/jpeg',0.85);
        saveData(data);
        renderHome();
        toast('策展人信息已保存');
        closeCuratorModal();
        switchAdmin('curator');
      };
      img.src=e.target.result;
    };
    reader.readAsDataURL(fileInput.files[0]);
  }else{
    saveData(data);
    renderHome();
    toast('策展人信息已保存');
    closeCuratorModal();
    switchAdmin('curator');
  }
}
function deleteCuratorFromModal(){
  if(editingCuratorIdx<0) return;
  const data=getData();
  if(data.curator.length<=1){toast('至少保留一位策展人');return}
  if(!confirm(`确定删除策展人「${data.curator[editingCuratorIdx].name}」吗？`)) return;

}

        let w=img.width,h=img.height;const max=800;
        if(w>max){h=Math.round(h*(max/w));w=max}
        canvas.width=w;canvas.height=h;
        canvas.getContext('2d').drawImage(img,0,0,w,h);
        doAdd(canvas.toDataURL('image/jpeg',0.85));
      };
      img.src=e.target.result;
    };
    reader.readAsDataURL(fileInput.files[0]);
  }else{
    doAdd();
  }
}

// ============ 多选上传 ============
let pendingFiles=[];
function initMultiUpload(){
  const input=document.getElementById('uploadInput');
  const drop=document.getElementById('uploadDrop');
  const list=document.getElementById('uploadFileList');
  input.addEventListener('change',function(){
    for(const f of this.files) pendingFiles.push(f);
    renderFileList();
  });
  drop.addEventListener('dragover',e=>{e.preventDefault();drop.classList.add('dragover')});
  drop.addEventListener('dragleave',()=>drop.classList.remove('dragover'));
  drop.addEventListener('drop',e=>{
    e.preventDefault();drop.classList.remove('dragover');
    for(const f of e.dataTransfer.files) pendingFiles.push(f);
    renderFileList();
  });
  function renderFileList(){
    list.innerHTML=pendingFiles.map((f,i)=>`<div class="file-item"><span>📷 ${f.name} (${(f.size/1024).toFixed(0)}KB)</span><button onclick="pendingFiles.splice(${i},1);renderFileList()" style="background:none;border:none;color:#ff6b6b;cursor:pointer;font-size:16px">✕</button></div>`).join('');
  }
  // 暴露给全局
  window.pendingFiles=pendingFiles;
  window.renderFileList=renderFileList;
}
function doUploadMulti(){
  const files=window.pendingFiles||[];
  if(!files.length){toast('请先选择图片');return}
  const exId=document.getElementById('uploadEx').value;
  const gTitle=document.getElementById('uploadGroupTitle').value.trim()||'未命名组照';
  const gDesc=document.getElementById('uploadGroupDesc').value.trim();
  const status=document.getElementById('uploadStatus');
  const progress=document.getElementById('uploadProgress');
  const fill=document.getElementById('uploadProgressFill');
  progress.style.display='block';
  status.textContent=`准备处理 ${files.length} 张图片...`;
  const data=getData();
  const ex=data.exhibitions.find(e=>e.id===exId);
  if(!ex){toast('展览不存在');return}
  const group={id:'g'+Date.now(),title:gTitle,desc:gDesc,photos:[],boardColor:(ex.style&&ex.style.boardColor)||'#1a1a2e'};
  let processed=0;
  files.forEach((file,i)=>{
    const reader=new FileReader();
    reader.onload=function(e){
      const img=new Image();
      img.onload=function(){
        const canvas=document.createElement('canvas');
        let w=img.width,h=img.height;const max=2400;
        if(w>max||h>max){if(w>h){w=max;h=Math.round(img.height*(max/img.width))}else{h=max;w=Math.round(img.width*(max/img.height))}}
        canvas.width=w;canvas.height=h;
        canvas.getContext('2d').drawImage(img,0,0,w,h);
        let quality=0.88;let dataUrl;
        for(let j=0;j<5;j++){dataUrl=canvas.toDataURL('image/jpeg',quality);if(dataUrl.length<1048576)break;quality-=0.1}
        group.photos.push({src:dataUrl,title:file.name.replace(/\.[^.]+$/,'')});
        processed++;
        fill.style.width=(processed/files.length*100)+'%';
        status.textContent=`已处理 ${processed}/${files.length}...`;
        if(processed===files.length){
          if(!ex.groups) ex.groups=[];
          ex.groups.push(group);
          saveData(data);
          renderHome();
          status.textContent=`✅ 上传完成：${group.photos.length} 张`;
          toast('组照已上传');
          window.pendingFiles=[];
          if(window.renderFileList) window.renderFileList();
          document.getElementById('uploadGroupTitle').value='';
          document.getElementById('uploadGroupDesc').value='';
          progress.style.display='none';
        }
      };
      img.src=e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

// ============ 背景上传 ============
function initBgUpload(){
  const input=document.getElementById('bgInput');
  const drop=document.getElementById('bgDrop');
  const list=document.getElementById('bgFileList');
  let bgPending=null;
  input.addEventListener('change',function(){
    if(this.files[0]){bgPending=this.files[0];renderBgList()}
  });
  drop.addEventListener('dragover',e=>{e.preventDefault();drop.classList.add('dragover')});
  drop.addEventListener('dragleave',()=>drop.classList.remove('dragover'));
  drop.addEventListener('drop',e=>{
    e.preventDefault();drop.classList.remove('dragover');
    if(e.dataTransfer.files[0]){bgPending=e.dataTransfer.files[0];renderBgList()}
  });
  function renderBgList(){
    list.innerHTML=bgPending?`<div class="file-item"><span>🖼 ${bgPending.name} (${(bgPending.size/1024).toFixed(0)}KB)</span><button onclick="bgPending=null;renderBgList()" style="background:none;border:none;color:#ff6b6b;cursor:pointer;font-size:16px">✕</button></div>`:'';
  }
  window.bgPending=bgPending;
  window.renderBgList=renderBgList;
}
function previewBg(){
  const c=document.getElementById('bgColor').value;
  const d=document.getElementById('bgDarken').value;
  document.getElementById('bgPreview').style.background=c;
  document.getElementById('bgPreview').style.background=`linear-gradient(rgba(0,0,0,${d/100}),rgba(0,0,0,${d/100})),${c}`;
}
function saveBg(){
  const t=getTheme();
  t.bgColor=document.getElementById('bgColor').value;
  t.bgDarken=parseInt(document.getElementById('bgDarken').value);
  // 处理上传的图片
  const bgFile=window.bgPending;
  if(bgFile){
    const reader=new FileReader();
    reader.onload=function(e){
      const img=new Image();
      img.onload=function(){
        const canvas=document.createElement('canvas');
        let w=img.width,h=img.height;const max=1920;
        if(w>max){h=Math.round(h*(max/w));w=max}
        canvas.width=w;canvas.height=h;
        canvas.getContext('2d').drawImage(img,0,0,w,h);
        let q=0.82;let url;
        for(let i=0;i<5;i++){url=canvas.toDataURL('image/jpeg',q);if(url.length<5242880)break;q-=0.1}
        t.bgImage=url;
        saveTheme(t);
        applyTheme();
        window.bgPending=null;
        if(window.renderBgList) window.renderBgList();
        toast('背景设置已保存');
        switchAdmin('bg-color');
      };
      img.src=e.target.result;
    };
    reader.readAsDataURL(bgFile);
  }else{
    t.bgImage='';
    saveTheme(t);
    applyTheme();
    toast('背景设置已保存');
    switchAdmin('bg-color');
  }
}

// ============ 自定义字体批量上传 ============
function initFontUpload(){
  const input=document.getElementById('fontInput');
  const drop=document.getElementById('fontDrop');
  const list=document.getElementById('fontFileList');
  let fontFiles=[];
  input.addEventListener('change',function(){
    for(const f of this.files) fontFiles.push(f);
    renderFontList();
  });
  drop.addEventListener('dragover',e=>{e.preventDefault();drop.classList.add('dragover')});
  drop.addEventListener('dragleave',()=>drop.classList.remove('dragover'));
  drop.addEventListener('drop',e=>{
    e.preventDefault();drop.classList.remove('dragover');
    for(const f of e.dataTransfer.files) fontFiles.push(f);
    renderFontList();
  });
  function renderFontList(){
    list.innerHTML=fontFiles.map((f,i)=>`<div class="file-item"><span>📄 ${f.name} (${(f.size/1024).toFixed(0)}KB)</span><button onclick="fontFiles.splice(${i},1);renderFontList()" style="background:none;border:none;color:#ff6b6b;cursor:pointer;font-size:16px">✕</button></div>`).join('');
  }
  window.fontFiles=fontFiles;
  window.renderFontList=renderFontList;
}
function doUploadFonts(){
  const files=window.fontFiles||[];
  if(!files.length){toast('请先选择字体文件');return}
  const progress=document.getElementById('fontProgress');
  const fill=document.getElementById('fontProgressFill');
  progress.style.display='block';
  const t=getTheme();
  if(!t.customFonts) t.customFonts={};
  let processed=0;
  files.forEach((file,i)=>{
    const reader=new FileReader();
    reader.onload=function(e){
      let format='truetype';
      const name=file.name.toLowerCase();
      if(name.endsWith('.woff2')) format='woff2';
      else if(name.endsWith('.woff')) format='woff';
      else if(name.endsWith('.otf')) format='truetype';
      const fontName=file.name.replace(/\.[^.]+$/,'');
      t.customFonts[fontName]={data:e.target.result,format};
      processed++;
      fill.style.width=(processed/files.length*100)+'%';
      if(processed===files.length){
        saveTheme(t);
        applyTheme();
        progress.style.display='none';
        window.fontFiles=[];
        if(window.renderFontList) window.renderFontList();
        toast(`✅ ${processed} 个字体已注册`);
        switchAdmin('custom-fonts');
      }
    };
    reader.readAsDataURL(file);
  });
}
function deleteCustomFont(name){
  if(!confirm(`删除字体「${name}」？`)) return;
  const t=getTheme();
  if(t.customFonts&&t.customFonts[name]) delete t.customFonts[name];
  saveTheme(t);applyTheme();toast('字体已删除');switchAdmin('custom-fonts');
}

function addExhibition(){
  const t=document.getElementById('newExTitle').value.trim();
  if(!t){toast('请输入展览名称');return}
  const data=getData();
  data.exhibitions.push({id:'ex'+Date.now(),title:t,tags:(document.getElementById('newExTags').value||'').split(/[,，]/).map(s=>s.trim()).filter(Boolean),statement:document.getElementById('newExStmt').value||'暂无策展陈述',artworks:[],groups:[],views:0,style:{boardColor:(getTheme().boardColor||'#1a1a2e'),titleFont:'',bodyFont:''}});
  saveData(data);renderHome();toast('展览已添加');switchAdmin('exhibitions');
}
function delExhibition(id){
  if(!confirm('确定删除该展览及其所有作品？')) return;
  const data=getData();
  data.exhibitions=data.exhibitions.filter(e=>e.id!==id);
  saveData(data);renderHome();toast('已删除');switchAdmin('exhibitions');
}
function addColumn(){
  const t=document.getElementById('newColTitle').value.trim();
  if(!t){toast('请输入标题');return}
  const data=getData();
  data.columns.push({id:'c'+Date.now(),title:t,date:document.getElementById('newColDate').value||new Date().toISOString().slice(0,10),body:document.getElementById('newColBody').value||''});
  saveData(data);renderHome();toast('文章已添加');switchAdmin('columns');
}
function delColumn(id){
  if(!confirm('确定删除？')) return;
  const data=getData();
  data.columns=data.columns.filter(c=>c.id!==id);
  saveData(data);renderHome();toast('已删除');switchAdmin('columns');
}
function exportData(){
  const blob=new Blob([localStorage.getItem(STORAGE_KEY)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download='data.json';a.click();
  URL.revokeObjectURL(url);toast('数据已导出');
}
function exportTheme(){
  const blob=new Blob([JSON.stringify(getTheme(),null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download='theme.json';a.click();
  URL.revokeObjectURL(url);toast('外观已导出');
}
function importData(){
  const file=document.getElementById('importFile').files[0];
  if(!file){toast('请选择文件');return}
  const reader=new FileReader();
  reader.onload=function(e){
    try{const d=JSON.parse(e.target.result);if(!d.exhibitions||!d.columns)throw 0;saveData(d);renderHome();switchAdmin('dashboard');toast('导入成功')}catch(err){toast('格式不正确')}
  };
  reader.readAsText(file);
}
function changePass(){
  const np=document.getElementById('newPass').value.trim();
  if(!np||np.length<4){toast('密码至少4位');return}
  const acc=JSON.parse(localStorage.getItem(ACCOUNT_KEY));
  acc.password=np;localStorage.setItem(ACCOUNT_KEY,JSON.stringify(acc));
  document.getElementById('settingsMsg').textContent='✅ 密码已修改';toast('密码已更新');
}
function resetViews(){
  if(!confirm('确定清零所有展览的浏览量吗？')) return;
  const data=getData();
  data.exhibitions.forEach(ex=>ex.views=0);
  saveData(data);toast('浏览量已清零');switchAdmin('dashboard');
}

// ============ Toast ============
function toast(msg){
  const el=document.getElementById('toast');
  el.textContent=msg;el.classList.add('show');
  clearTimeout(el._timer);el._timer=setTimeout(()=>el.classList.remove('show'),2200);
}
