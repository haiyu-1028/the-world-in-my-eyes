<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>镜中世界 · 线上画廊</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter','PingFang SC','Microsoft YaHei',sans-serif;background:#0a1a10;color:#e0e0e0;line-height:1.7;overflow-x:hidden}
:root{--klein:#002fa7;--green:#0d2818;--gold:#c9a84c}
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-track{background:#0a1a10}
::-webkit-scrollbar-thumb{background:var(--klein);border-radius:3px}

/* ========== 导航栏 ========== */
.navbar{position:fixed;top:0;left:0;right:0;height:64px;background:rgba(13,40,24,0.95);backdrop-filter:blur(14px);display:flex;align-items:center;justify-content:space-between;padding:0 32px;z-index:900;border-bottom:1px solid rgba(255,255,255,0.06)}
.nav-brand{font-size:22px;font-weight:700;letter-spacing:4px;color:#fff;cursor:pointer;display:flex;align-items:center;gap:10px}
.nav-brand svg{width:28px;height:28px}
.nav-links{display:flex;align-items:center;gap:18px}
.nav-links a{color:rgba(255,255,255,0.7);text-decoration:none;font-size:14px;transition:.3s;padding:6px 14px;border-radius:20px}
.nav-links a:hover{color:#fff;background:rgba(255,255,255,0.06)}
.nav-admin{background:var(--klein)!important;color:#fff!important;padding:6px 20px!important;border-radius:30px!important}

/* ========== Hero ========== */
.hero{height:70vh;min-height:420px;background:linear-gradient(160deg,#0a1a10 0%,#001633 50%,#0a1a10 100%);display:flex;align-items:center;justify-content:center;text-align:center;padding-top:64px}
.hero h1{font-size:68px;letter-spacing:12px;color:#fff;margin-bottom:16px;text-shadow:0 4px 40px rgba(0,47,167,0.3)}
.hero p{font-size:18px;color:rgba(255,255,255,0.55);max-width:520px;margin:0 auto}
.hero .curator{color:var(--gold);font-size:15px;letter-spacing:3px;margin-top:12px}

/* ========== Section ========== */
.section{max-width:1200px;margin:0 auto;padding:80px 24px}
.section-title{font-size:32px;letter-spacing:4px;color:#fff;margin-bottom:44px;text-align:center}
.section-title::after{content:'';display:block;width:50px;height:2px;background:var(--klein);margin:14px auto 0}

/* ========== 展览卡片 ========== */
.exhibition-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:28px}
.exhibition-card{background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);border-radius:18px;padding:32px 28px;cursor:pointer;transition:.4s;position:relative;overflow:hidden}
.exhibition-card:hover{border-color:var(--klein);transform:translateY(-6px);background:rgba(255,255,255,0.07)}
.exhibition-card h3{font-size:22px;color:#fff;margin-bottom:8px;letter-spacing:1px}
.exhibition-card .tags{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.exhibition-card .tag{background:rgba(0,47,167,0.2);color:#8ab4ff;padding:2px 12px;border-radius:20px;font-size:11px}
.exhibition-card p{color:rgba(255,255,255,0.45);font-size:14px;line-height:1.8}
.exhibition-card .enter-hint{color:var(--klein);font-size:13px;margin-top:16px;opacity:0;transition:.4s}
.exhibition-card:hover .enter-hint{opacity:1}
.exhibition-card .views{font-size:12px;color:rgba(255,255,255,0.3);margin-top:8px;display:flex;align-items:center;gap:4px}

/* ========== 专栏 ========== */
.column-article{background:rgba(255,255,255,0.035);border:1px solid rgba(255,255,255,0.07);border-radius:16px;padding:28px 30px;margin-bottom:20px}
.column-article h3{font-size:20px;color:#fff;margin-bottom:4px}
.column-article .date{color:rgba(255,255,255,0.3);font-size:13px;margin-bottom:10px}
.column-article .body{color:rgba(255,255,255,0.5);font-size:14px;line-height:1.9;white-space:pre-wrap}

/* ========== 策展人（前台大气版） ========== */
.curator-block{display:flex;gap:36px;align-items:flex-start;background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.07);border-radius:24px;padding:40px;margin-bottom:32px;position:relative;overflow:hidden}
.curator-block:nth-child(even){flex-direction:row-reverse}
.curator-block .photo-wrap{width:42%;flex-shrink:0;position:relative}
.curator-block .photo-wrap img{width:100%;aspect-ratio:4/5;object-fit:cover;border-radius:16px;display:block;box-shadow:0 20px 60px rgba(0,0,0,0.5),0 0 40px rgba(0,47,167,0.15),inset 0 0 60px rgba(0,0,0,0.3)}
.curator-block .photo-wrap::after{content:'';position:absolute;inset:0;border-radius:16px;box-shadow:inset 0 0 80px rgba(0,0,0,0.4);pointer-events:none}
.curator-block .info{width:58%;padding:20px 0}
.curator-block .index{position:absolute;top:24px;right:32px;font-size:13px;color:rgba(255,255,255,0.2);letter-spacing:2px}
.curator-block .name{font-size:42px;color:#fff;margin-bottom:8px;letter-spacing:2px;line-height:1.2}
.curator-block .role{color:var(--gold);font-size:15px;letter-spacing:2px;margin-bottom:16px}
.curator-block .divider{width:40px;height:2px;background:var(--klein);margin-bottom:16px}
.curator-block .bio{color:rgba(255,255,255,0.55);font-size:15px;line-height:2;white-space:pre-wrap}
.curator-block .contact{color:var(--gold);font-size:14px;margin-top:16px;letter-spacing:1px}
.curator-block .photo-placeholder{width:100%;aspect-ratio:4/5;background:rgba(255,255,255,0.05);border:2px dashed rgba(255,255,255,0.1);border-radius:16px;display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,0.2);font-size:48px}

/* ========== 页脚 ========== */
.footer{text-align:center;padding:40px 24px;color:rgba(255,255,255,0.2);font-size:13px;border-top:1px solid rgba(255,255,255,0.04)}

/* ========== 展览详情页 ========== */
.detail-page{display:none;min-height:100vh;padding-top:64px}
.detail-back{padding:24px 32px 0;max-width:1200px;margin:0 auto}
.detail-back a{color:rgba(255,255,255,0.5);text-decoration:none;font-size:14px;cursor:pointer;transition:.3s}
.detail-back a:hover{color:#fff}
.detail-header{padding:40px 32px 20px;max-width:1200px;margin:0 auto}
.detail-header h1{font-size:38px;color:#fff;letter-spacing:3px;margin-bottom:8px}
.detail-header .statement{color:rgba(255,255,255,0.5);font-size:15px;line-height:1.9;max-width:800px}
.detail-grid{padding:20px 32px 60px;max-width:1200px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:24px}

/* ========== 组照展板 ========== */
.group-section{margin-bottom:48px}
.group-section h3{font-size:20px;color:#fff;margin-bottom:6px}
.group-section .group-desc{color:rgba(255,255,255,0.4);font-size:14px;margin-bottom:20px;line-height:1.8}
.artwork-item{background:rgba(255,255,255,0.03);border-radius:14px;overflow:hidden;transition:.3s;position:relative}
.artwork-item:hover{transform:translateY(-4px)}
.artwork-item .board{position:absolute;inset:0;border-radius:14px;z-index:-1;margin:-6px}
.artwork-item img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;background:#111;border-radius:10px;position:relative;z-index:1}
.artwork-item .info{padding:14px 16px;position:relative;z-index:1;background:rgba(0,0,0,0.4);border-radius:0 0 10px 10px}
.artwork-item .info h4{font-size:15px;color:#fff;margin-bottom:2px}
.artwork-item .info p{font-size:12px;color:rgba(255,255,255,0.4)}

/* ========== 灯箱 ========== */
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,0.92);z-index:3000;display:none;align-items:center;justify-content:center;backdrop-filter:blur(6px)}
.lightbox.active{display:flex}
.lightbox img{max-width:90vw;max-height:85vh;object-fit:contain;border-radius:8px;box-shadow:0 0 80px rgba(0,47,167,0.2)}
.lightbox .lb-close{position:absolute;top:24px;right:32px;font-size:36px;color:rgba(255,255,255,0.5);cursor:pointer;transition:.3s;background:none;border:none}
.lightbox .lb-close:hover{color:#fff}
.lightbox .lb-prev,.lightbox .lb-next{position:absolute;top:50%;transform:translateY(-50%);font-size:48px;color:rgba(255,255,255,0.4);cursor:pointer;transition:.3s;background:none;border:none;padding:20px}
.lightbox .lb-prev{left:24px}
.lightbox .lb-next{right:24px}
.lightbox .lb-prev:hover,.lightbox .lb-next:hover{color:#fff}
.lightbox .lb-counter{position:absolute;bottom:24px;left:50%;transform:translateX(-50%);color:rgba(255,255,255,0.4);font-size:14px}

/* ========== 后台 ========== */
.admin-page{display:none;min-height:100vh;padding-top:64px;background:#0a1510}
.admin-topbar{position:fixed;top:64px;left:200px;right:0;height:48px;background:rgba(10,21,16,0.95);backdrop-filter:blur(10px);display:flex;align-items:center;justify-content:flex-end;padding:0 24px;z-index:800;border-bottom:1px solid rgba(255,255,255,0.04)}
.admin-topbar .user-info{color:rgba(255,255,255,0.4);font-size:13px;margin-right:16px}
.admin-topbar .btn-logout{background:transparent;border:1px solid rgba(255,107,107,0.3);color:#ff6b6b;padding:6px 18px;border-radius:20px;cursor:pointer;font-size:13px;transition:.3s}
.admin-topbar .btn-logout:hover{background:rgba(255,107,107,0.1)}
.admin-container{display:flex;min-height:calc(100vh - 64px)}
.admin-sidebar{width:200px;background:rgba(0,0,0,0.3);padding:24px 0;border-right:1px solid rgba(255,255,255,0.05);flex-shrink:0;margin-top:48px}
.admin-sidebar a{display:block;padding:12px 24px;color:rgba(255,255,255,0.5);text-decoration:none;font-size:14px;transition:.3s;cursor:pointer;border-left:3px solid transparent}
.admin-sidebar a:hover,.admin-sidebar a.active{color:#fff;background:rgba(0,47,167,0.15);border-left-color:var(--klein)}
.admin-sidebar .sub-item{padding-left:40px;font-size:13px}
.admin-sidebar .logout-item{margin-top:auto;color:#ff6b6b!important;border-top:1px solid rgba(255,255,255,0.05);margin-top:20px}
.admin-main{flex:1;padding:32px 40px;overflow-y:auto;margin-top:48px}
.admin-main h2{font-size:24px;color:#fff;margin-bottom:24px;letter-spacing:2px}
.admin-form label{display:block;color:rgba(255,255,255,0.6);margin:14px 0 4px;font-size:13px}
.admin-form input,.admin-form textarea,.admin-form select{width:100%;padding:10px 14px;border:1px solid rgba(255,255,255,0.12);border-radius:10px;background:rgba(255,255,255,0.04);color:#fff;font-size:14px;outline:none;transition:.3s}
.admin-form input:focus,.admin-form textarea:focus{border-color:var(--klein)}
.admin-form textarea{min-height:100px;resize:vertical}
.btn{background:var(--klein);color:#fff;border:none;padding:10px 28px;border-radius:30px;cursor:pointer;font-size:14px;transition:.3s;margin-top:12px}
.btn:hover{background:#003bb5;transform:translateY(-1px)}
.btn-danger{background:#a83232;color:#fff;border:none;padding:6px 14px;border-radius:20px;cursor:pointer;font-size:12px;transition:.3s}
.btn-danger:hover{background:#c73e3e}
.btn-warning{background:transparent;border:1px solid rgba(255,107,107,0.4);color:#ff6b6b;padding:8px 20px;border-radius:20px;cursor:pointer;font-size:13px;transition:.3s;margin-top:12px}
.btn-warning:hover{background:rgba(255,107,107,0.1)}
.admin-list-item{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid rgba(255,255,255,0.04)}
.admin-list-item span{color:rgba(255,255,255,0.6);font-size:14px}
.admin-empty{color:rgba(255,255,255,0.2);text-align:center;padding:40px 0;font-size:14px}
.toast{position:fixed;bottom:40px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.85);color:#fff;padding:12px 28px;border-radius:30px;font-size:14px;z-index:9999;opacity:0;transition:.4s;pointer-events:none}
.toast.show{opacity:1}

/* ========== 登录弹窗 ========== */
.login-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.82);backdrop-filter:blur(8px);z-index:5000;display:none;align-items:center;justify-content:center}
.login-overlay.active{display:flex}
.login-card{background:#141e18;border:1px solid rgba(255,255,255,0.1);border-radius:20px;padding:40px 36px;width:340px;text-align:center}
.login-card h2{color:#fff;font-size:24px;letter-spacing:3px;margin-bottom:20px}
.login-card input{width:100%;padding:12px 16px;margin-bottom:14px;border:1px solid rgba(255,255,255,0.15);border-radius:10px;background:rgba(255,255,255,0.06);color:#fff;font-size:15px;outline:none}
.login-card input:focus{border-color:var(--klein)}
.login-card button{width:100%;padding:12px;border:none;border-radius:10px;background:var(--klein);color:#fff;font-size:16px;font-weight:600;cursor:pointer;transition:.3s}
.login-card button:hover{background:#003bb5}
.login-card .error{color:#ff6b6b;font-size:13px;margin-top:12px;min-height:20px}

/* ========== 编辑弹窗 ========== */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.78);backdrop-filter:blur(6px);z-index:2500;display:none;align-items:center;justify-content:center}
.modal-overlay.active{display:flex}
.modal-content{background:#141e18;border:1px solid rgba(255,255,255,0.1);border-radius:24px;width:90%;max-width:680px;max-height:85vh;overflow-y:auto;padding:36px 40px;position:relative}
.modal-content .close-btn{position:absolute;top:16px;right:24px;font-size:30px;color:rgba(255,255,255,0.4);cursor:pointer;transition:.3s;background:none;border:none}
.modal-content .close-btn:hover{color:#fff}
.modal-content h2{font-size:22px;color:#fff;margin-bottom:8px}
.modal-content .subtitle{color:rgba(255,255,255,0.35);font-size:13px;margin-bottom:24px}

/* ========== 上传区 ========== */
.drop-zone{border:2px dashed rgba(255,255,255,0.12);border-radius:14px;padding:32px;text-align:center;cursor:pointer;transition:.3s;margin-top:8px}
.drop-zone:hover{border-color:var(--klein);background:rgba(0,47,167,0.05)}
.drop-zone p{color:rgba(255,255,255,0.35);font-size:14px;margin:0}
.drop-zone .hint{font-size:12px;color:rgba(255,255,255,0.2);margin-top:6px}
.file-list{margin-top:12px}
.file-list .file-item{display:flex;justify-content:space-between;align-items:center;padding:6px 12px;background:rgba(255,255,255,0.04);border-radius:8px;margin-bottom:4px;font-size:13px;color:rgba(255,255,255,0.6)}
.file-list .file-item .remove{color:#ff6b6b;cursor:pointer;margin-left:8px}

/* ========== 颜色选择器 ========== */
.color-picker-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px}
.color-swatch{width:32px;height:32px;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:.3s}
.color-swatch:hover{border-color:rgba(255,255,255,0.3)}
.color-swatch.active{border-color:#fff;box-shadow:0 0 12px currentColor}

/* ========== 字体卡片 ========== */
.font-card{background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);border-radius:12px;padding:16px 20px;cursor:pointer;transition:.3s;margin-bottom:8px}
.font-card:hover{border-color:var(--klein)}
.font-card.active{border-color:var(--klein);background:rgba(0,47,167,0.1)}
.font-card .font-name{color:#fff;font-size:15px;margin-bottom:4px}
.font-card .font-preview{color:rgba(255,255,255,0.4);font-size:14px}
.font-card .font-meta{color:rgba(255,255,255,0.25);font-size:11px;margin-top:2px}

/* ========== 总览仪表盘 ========== */
.dash-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:16px;margin-bottom:32px}
.dash-card{background:rgba(255,255,255,0.04);border-radius:14px;padding:24px;text-align:center;border:1px solid rgba(255,255,255,0.05)}
.dash-card .num{font-size:36px;color:#fff;font-weight:700}
.dash-card .label{color:rgba(255,255,255,0.35);font-size:12px;margin-top:4px;letter-spacing:1px}
.bar-chart{margin-top:16px}
.bar-row{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.bar-row .bar-label{width:160px;color:rgba(255,255,255,0.5);font-size:13px;text-align:right;flex-shrink:0}
.bar-row .bar-track{flex:1;height:20px;background:rgba(255,255,255,0.04);border-radius:10px;overflow:hidden;position:relative}
.bar-row .bar-fill{height:100%;background:linear-gradient(90deg,var(--klein),#4a7fff);border-radius:10px;transition:width 1s ease}
.bar-row .bar-num{font-size:13px;color:rgba(255,255,255,0.4);min-width:48px}

/* ========== 策展人后台卡片 ========== */
.curator-admin-card{display:flex;gap:20px;align-items:flex-start;background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.07);border-radius:16px;padding:24px;margin-bottom:16px}
.curator-admin-card .photo{width:120px;height:150px;object-fit:cover;border-radius:10px;flex-shrink:0;background:rgba(255,255,255,0.05)}
.curator-admin-card .photo-placeholder{width:120px;height:150px;background:rgba(255,255,255,0.05);border:2px dashed rgba(255,255,255,0.1);border-radius:10px;display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,0.2);font-size:32px;flex-shrink:0}
.curator-admin-card .fields{flex:1}
.curator-admin-card .fields input,.curator-admin-card .fields textarea{width:100%;padding:8px 12px;margin-bottom:8px;border:1px solid rgba(255,255,255,0.1);border-radius:8px;background:rgba(255,255,255,0.04);color:#fff;font-size:13px;outline:none}
.curator-admin-card .fields textarea{min-height:80px;resize:vertical}
.curator-admin-card .actions{display:flex;gap:8px;margin-top:8px}
.curator-admin-card .photo-upload{margin-bottom:8px}

/* ========== 新增策展人面板 ========== */
.add-curator-panel{background:rgba(0,47,167,0.06);border:1px dashed rgba(0,47,167,0.3);border-radius:16px;padding:24px;margin-bottom:24px}
.add-curator-panel h3{color:#fff;font-size:16px;margin-bottom:12px}

/* ========== 面包屑 ========== */
.breadcrumb{color:rgba(255,255,255,0.3);font-size:13px;margin-bottom:16px}
.breadcrumb a{color:rgba(255,255,255,0.5);text-decoration:none;cursor:pointer}
.breadcrumb a:hover{color:#fff}

/* ========== 进度条 ========== */
.progress-bar{width:100%;height:6px;background:rgba(255,255,255,0.06);border-radius:3px;overflow:hidden;margin-top:8px}
.progress-bar .progress-fill{height:100%;background:var(--klein);border-radius:3px;transition:width .3s;width:0%}

/* ========== 保存栏 ========== */
.save-bar{position:sticky;bottom:0;background:rgba(10,21,16,0.95);backdrop-filter:blur(10px);padding:12px 0;border-top:1px solid rgba(255,255,255,0.06);margin-top:24px;display:flex;justify-content:flex-end;gap:8px}

/* ========== 展览面板 ========== */
.ex-panel{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.07);border-radius:16px;padding:24px;margin-bottom:20px}
.ex-panel .ex-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.ex-panel .ex-header h3{color:#fff;font-size:18px}
.ex-panel .ex-header .actions{display:flex;gap:8px}
.preview-box{background:rgba(255,255,255,0.02);border:1px solid rgba(255,255,255,0.05);border-radius:10px;padding:20px;margin-top:12px}
.preview-box .preview-title{font-size:20px;color:#fff;margin-bottom:4px}
.preview-box .preview-body{font-size:14px;color:rgba(255,255,255,0.4);line-height:1.8}

/* ========== 组照项 ========== */
.group-admin-item{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid rgba(255,255,255,0.04)}
.group-admin-item .group-info{display:flex;align-items:center;gap:12px}
.group-admin-item .group-thumb{width:48px;height:48px;object-fit:cover;border-radius:8px;background:#111}
.group-admin-item .group-name{color:#fff;font-size:14px}
.group-admin-item .group-count{color:rgba(255,255,255,0.3);font-size:12px}
.group-admin-item .group-actions{display:flex;gap:6px}

/* ========== 响应式 ========== */
@media(max-width:768px){
  .hero h1{font-size:40px;letter-spacing:6px}
  .exhibition-grid{grid-template-columns:1fr}
  .detail-grid{grid-template-columns:1fr}
  .admin-sidebar{width:140px}
  .admin-sidebar a{padding:10px 16px;font-size:13px}
  .admin-main{padding:20px}
  .curator-block{flex-direction:column!important}
  .curator-block .photo-wrap{width:100%}
  .curator-block .info{width:100%}
  .curator-block .name{font-size:32px}
}
</style>
</head>
<body>

<!-- ===== 导航 ===== -->

const defaultTheme = {

// ===== 从远程 JSON 加载 =====
async function loadRemoteData() {
  try {
    const r = await fetch('./data.json?_='+Date.now());
    if(!r.ok) throw 0;
    const d = await r.json();
    localStorage.setItem(STORAGE_KEY, JSON.stringify(d));
    console.log('✅ 远程 data.json 已加载');
    return true;
  } catch(e) { console.log('ℹ️ 无远程数据，用本地'); return false; }
}
async function loadRemoteTheme() {
  try {
    const r = await fetch('./theme.json?_='+Date.now());
    if(!r.ok) throw 0;
    const t = await r.json();
    localStorage.setItem(THEME_KEY, JSON.stringify(t));
    console.log('✅ 远程 theme.json 已加载');
  } catch(e) {}
}

function getData(){try{return JSON.parse(localStorage.getItem(STORAGE_KEY))||defaultData}catch(e){return defaultData}}
function saveData(d){localStorage.setItem(STORAGE_KEY,JSON.stringify(d))}
function getTheme(){try{return JSON.parse(localStorage.getItem(THEME_KEY))||defaultTheme}catch(e){return defaultTheme}}
function saveTheme(t){localStorage.setItem(THEME_KEY,JSON.stringify(t))}

// ===== 初始化 =====
if(!localStorage.getItem(ACCOUNT_KEY)) localStorage.setItem(ACCOUNT_KEY,JSON.stringify(defaultAccount));

(async () => {
  await loadRemoteData();
  await loadRemoteTheme();
  if(!localStorage.getItem(STORAGE_KEY)) saveData(defaultData);
  if(!localStorage.getItem(THEME_KEY)) saveTheme(defaultTheme);
  applyTheme();
  renderHome();
})();

// ===== 主题应用 =====
function applyTheme(){
  const t = getTheme();
  document.body.style.backgroundColor = t.bgColor || '#0a1a10';
  if(t.bgImage){
    document.body.style.backgroundImage = `linear-gradient(rgba(0,0,0,${t.bgDarken/100}),rgba(0,0,0,${t.bgDarken/100})),url(${t.bgImage})`;
    document.body.style.backgroundSize = 'cover';
    document.body.style.backgroundAttachment = 'fixed';
  }
  // 注册自定义字体
  if(t.customFonts && t.customFonts.length){
    let style = document.getElementById('dynamicFonts');
    if(!style){style=document.createElement('style');style.id='dynamicFonts';document.head.appendChild(style)}
    style.textContent = t.customFonts.map((f,i)=>`@font-face{font-family:'cf${i}';src:url(${f.data});font-display:swap}`).join('\n');
  }
}

// ===== 首页渲染 =====
function renderHome(){
  const data = getData();
  const t = getTheme();

  // 展览
  document.getElementById('exhibitionGrid').innerHTML = data.exhibitions.map((ex,i)=>{
    const totalPhotos = (ex.groups||[]).reduce((s,g)=>s+(g.photos?g.photos.length:0),0);
    const groupCount = (ex.groups||[]).length;
    return `
    <div class="exhibition-card" onclick="showDetail('${ex.id}')">
      <div class="tags">${(ex.tags||[]).map(tag=>`<span class="tag">${tag}</span>`).join('')}</div>
      <h3>${ex.title}</h3>
      <p>${(ex.statement||'').slice(0,100)}${ex.statement&&ex.statement.length>100?'...':''}</p>
      <div class="enter-hint">点击进入展览 →</div>
      <div class="views">👁 ${ex.views||0} 次浏览 · ${groupCount} 组作品 · ${totalPhotos} 张照片</div>
    </div>`;
  }).join('');

  // 专栏
  document.getElementById('columnList').innerHTML = (data.columns||[]).map(c=>`
    <div class="column-article">
      <h3>${c.title}</h3>
      <div class="date">${c.date||''}</div>
      <div class="body">${(c.body||'').slice(0,200)}${c.body&&c.body.length>200?'...':''}</div>
    </div>`).join('') || '<div class="admin-empty">暂无专栏文章</div>';

    const contact = lines.find(l=>l.includes('联系方式'))||'';

    return `
    <div class="curator-block">
      <div class="index">— 0${idx+1} / 0${curators.length} —</div>
      <div class="photo-wrap">

        <div class="name" style="${t.curatorFont?`font-family:'${t.curatorFont}'`:''}">${cu.name}</div>
        <div class="role">${cu.role||''}</div>
        <div class="divider"></div>
        <div class="bio">${bioMain}</div>

// ===== 页面切换 =====
function showHome(){
  document.getElementById('homePage').style.display='block';
  document.getElementById('detailPage').style.display='none';
  document.getElementById('adminPage').style.display='none';
  window.scrollTo(0,0);
}
function showDetail(id){
  const data=getData();
  const ex=data.exhibitions.find(e=>e.id===id);
  if(!ex) return toast('展览不存在');
  // 浏览量+1
  ex.views = (ex.views||0)+1;
  saveData(data);
  // 应用展览级样式
  const t = getTheme();
  const exStyle = ex.style||{};
  if(exStyle.titleFont) document.documentElement.style.setProperty('--ex-title-font', exStyle.titleFont);
  if(exStyle.bodyFont) document.documentElement.style.setProperty('--ex-body-font', exStyle.bodyFont);
  const boardColor = exStyle.boardColor || t.boardColor || '#111';

  document.getElementById('homePage').style.display='none';
  document.getElementById('adminPage').style.display='none';
  document.getElementById('detailPage').style.display='block';
  document.getElementById('detailHeader').innerHTML=`
    <h1 style="${exStyle.titleFont?`font-family:'${exStyle.titleFont}'`:''}">${ex.title}</h1>
    <div class="statement" style="${exStyle.bodyFont?`font-family:'${exStyle.bodyFont}'`:''}">${(ex.statement||'').replace(/\n/g,'<br>')}</div>
    <div class="views" style="margin-top:12px;color:rgba(255,255,255,0.3);font-size:13px">👁 ${ex.views} 次浏览</div>
  `;
  const groups = ex.groups||[];
  document.getElementById('detailGrid').innerHTML = groups.length ? groups.map(g=>{
    const photos = g.photos||[];
    return `
    <div style="grid-column:1/-1">
      <div class="group-section">
        <h3 style="${exStyle.titleFont?`font-family:'${exStyle.titleFont}'`:''}">${g.title||'未命名组照'}</h3>
        <div class="group-desc" style="${exStyle.bodyFont?`font-family:'${exStyle.bodyFont}'`:''}">${g.desc||''}</div>
        <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:20px">
          ${photos.map((p,i)=>`
            <div class="artwork-item" onclick="openLightbox('${ex.id}','${g.id}',${i})" style="box-shadow:0 12px 40px rgba(0,0,0,0.4),0 0 30px ${boardColor}40">
              <div class="board" style="background:${boardColor}"></div>
              <img src="${p.src}" alt="${p.title||''}" loading="lazy">
              <div class="info"><h4>${p.title||'未命名'}</h4><p>${p.desc||''}</p></div>
            </div>`).join('')}
        </div>
      </div>
    </div>`;
  }).join('') : '<div class="admin-empty" style="grid-column:1/-1">暂无作品，请在后台上传</div>';
  window.scrollTo(0,0);
}

// ===== 灯箱 =====
let lbPhotos=[], lbIndex=0, lbExId='', lbGroupId='';
function openLightbox(exId,gid,idx){
  const data=getData();
  const ex=data.exhibitions.find(e=>e.id===exId);
  if(!ex) return;
  const g=ex.groups.find(g=>g.id===gid);
  if(!g) return;
  lbPhotos=g.photos;lbIndex=idx;lbExId=exId;lbGroupId=gid;
  document.getElementById('lbImg').src=lbPhotos[idx].src;
  document.getElementById('lbCounter').textContent=(idx+1)+'/'+lbPhotos.length;
  document.getElementById('lightbox').classList.add('active');
}
function closeLightbox(){document.getElementById('lightbox').classList.remove('active')}
function lbPrev(){lbIndex=(lbIndex-1+lbPhotos.length)%lbPhotos.length;document.getElementById('lbImg').src=lbPhotos[lbIndex].src;document.getElementById('lbCounter').textContent=(lbIndex+1)+'/'+lbPhotos.length}
function lbNext(){lbIndex=(lbIndex+1)%lbPhotos.length;document.getElementById('lbImg').src=lbPhotos[lbIndex].src;document.getElementById('lbCounter').textContent=(lbIndex+1)+'/'+lbPhotos.length}

// ===== 登录 =====
function openLogin(){document.getElementById('loginOverlay').classList.add('active');document.getElementById('loginError').textContent=''}
function handleLogin(){
  const u=document.getElementById('loginUser').value.trim();
  const p=document.getElementById('loginPass').value.trim();
  const acc=JSON.parse(localStorage.getItem(ACCOUNT_KEY));
  if(u===acc.username&&p===acc.password){
    sessionStorage.setItem(SESSION_KEY,'true');
    document.getElementById('loginOverlay').classList.remove('active');
    enterAdmin();
  }else{document.getElementById('loginError').textContent='账号或密码错误'}
}
function enterAdmin(){
  if(!sessionStorage.getItem(SESSION_KEY)){openLogin();return}
  document.getElementById('homePage').style.display='none';
  document.getElementById('detailPage').style.display='none';
  document.getElementById('adminPage').style.display='block';
  document.getElementById('adminUser').textContent='登录身份：'+JSON.parse(localStorage.getItem(ACCOUNT_KEY)).username;
  buildSidebar();
  switchAdmin('dashboard');
  window.scrollTo(0,0);
}
function confirmLogout(){
  if(confirm('确定要退出内部管理吗？')){
    sessionStorage.removeItem(SESSION_KEY);
    showHome();
    toast('已退出登录');
  }
}

// ===== 侧边栏 =====
let currentTab='dashboard';
function buildSidebar(){
  const sidebar=document.getElementById('adminSidebar');
  const items=[
    {id:'dashboard',label:'📊 总览',tab:'dashboard'},
    {id:'exhibitions',label:'📂 展览',tab:'exhibitions'},
    {id:'columns',label:'📝 专栏',tab:'columns'},
    {id:'curators',label:'👤 策展人',tab:'curators'},
    {id:'upload',label:'🖼 上传',tab:'upload'},
    {id:'theme',label:'🎨 外观设置',tab:'theme',sub:[
      {label:'背景颜色/图片',tab:'theme-bg'},
      {label:'背景板颜色',tab:'theme-board'},
      {label:'标题字体',tab:'theme-title'},
      {label:'正文字体',tab:'theme-body'},
      {label:'策展人字体',tab:'theme-curator'},
      {label:'自定义字体',tab:'theme-custom'},
    ]},
    {id:'settings',label:'⚙ 设置',tab:'settings'},
  ];
  function renderItems(list,indent=0){
    return list.map(it=>{
      if(it.sub) return `<div style="color:rgba(255,255,255,0.3);font-size:11px;padding:8px ${12+indent*16}px 4px;letter-spacing:1px;text-transform:uppercase">${it.label}</div>`+renderItems(it.sub,indent+1);
      return `<a class="${currentTab===it.tab?'active':''}" style="padding-left:${12+indent*16}px" onclick="switchAdmin('${it.tab}')">${it.label}</a>`;
    }).join('');
  }
  sidebar.innerHTML=renderItems(items)+'<a class="logout-item" onclick="confirmLogout()">🚪 退出登录</a>';
}

// ===== 后台路由 =====
function switchAdmin(tab){
  currentTab=tab;
  buildSidebar();
  const main=document.getElementById('adminMain');
  const data=getData();
  const t=getTheme();

  // === 总览 ===
  if(tab==='dashboard'){
    const totalWorks=data.exhibitions.reduce((s,e)=>s+((e.groups||[]).reduce((a,g)=>a+(g.photos?g.photos.length:0),0)),0);

// ===== 图片上传（批量） =====
let pendingFiles=[];
function handleUploadSelect(e){
  const files=Array.from(e.target.files||[]);

  renderFileList();

function renderFileList(){
  const list=document.getElementById('uploadFileList');
  if(!list) return;
  list.innerHTML=pendingFiles.map((f,i)=>`<div class="file-item"><span>📷 ${f.name} (${(f.size/1024).toFixed(1)}KB)</span><span class="remove" onclick="removePendingFile(${i})">✕</span></div>`).join('');
}
function removePendingFile(i){pendingFiles.splice(i,1);renderFileList()}

async function doUpload(){
  if(!pendingFiles.length){toast('请先选择图片');return}
  const exId=document.getElementById('uploadEx').value;
  const groupTitle=document.getElementById('uploadGroupTitle').value.trim()||'未命名组照';
  const groupDesc=document.getElementById('uploadGroupDesc').value.trim();
  const data=getData();
  const ex=data.exhibitions.find(e=>e.id===exId);
  if(!ex){toast('展览不存在');return}
  const status=document.getElementById('uploadStatus');
  const progress=document.getElementById('uploadProgress');
  const photos=[];
  for(let i=0;i<pendingFiles.length;i++){
    const f=pendingFiles[i];
    status.textContent=`正在处理 (${i+1}/${pendingFiles.length})...`;
    progress.style.width=((i/pendingFiles.length)*100).toFixed(0)+'%';
    try{
      const compressed=await compressImage(f,2400,0.85);
      photos.push({title:f.name.replace(/\.[^.]+$/,'')||'未命名',desc:'',src:compressed});
    }catch(e){console.error('压缩失败',f.name,e)}
  }
  ex.groups=ex.groups||[];
  ex.groups.push({id:'g'+Date.now(),title:groupTitle,desc:groupDesc,photos});
  saveData(data);
  progress.style.width='100%';
  status.textContent=`✅ 上传完成：${photos.length} 张图片`;
  pendingFiles=[];
  renderFileList();
  renderHome();
  toast(`组照「${groupTitle}」上传成功（${photos.length}张）`);
}

function compressImage(file,maxDim,quality){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onload=e=>{
      const img=new Image();
      img.onload=()=>{
        let w=img.width,h=img.height;
        if(w>maxDim||h>maxDim){if(w>h){w=maxDim;h=Math.round(img.height*(maxDim/img.width))}else{h=maxDim;w=Math.round(img.width*(maxDim/img.height))}}
        const canvas=document.createElement('canvas');canvas.width=w;canvas.height=h;canvas.getContext('2d').drawImage(img,0,0,w,h);
        let q=quality;let out;
        for(let i=0;i<5;i++){out=canvas.toDataURL('image/jpeg',q);if(out.length<1048576)break;q-=0.1}
        resolve(out);
      };
      img.onerror=reject;img.src=e.target.result;
    };
    reader.onerror=reject;reader.readAsDataURL(file);
  });
}

async function doFontUpload(){
  if(!pendingFonts.length){toast('请先选择字体文件');return}
  const progress=document.getElementById('fontProgress');
  const t=getTheme();
  t.customFonts=t.customFonts||[];
  for(let i=0;i<pendingFonts.length;i++){
    const f=pendingFonts[i];
    progress.style.width=((i/pendingFonts.length)*100).toFixed(0)+'%';
    const ext=(f.name.match(/\.(ttf|otf|woff2?)$/i)||['',''])[1].toLowerCase();
    const format=ext==='woff2'?'woff2':ext==='woff'?'woff':'truetype';
    const dataUrl=await new Promise(res=>{const r=new FileReader();r.onload=()=>res(r.result);r.readAsDataURL(f)});
    t.customFonts.push({name:f.name.replace(/\.[^.]+$/,'')||'自定义字体',format,size:f.size,data:dataUrl});
  }
  saveTheme(t);applyTheme();
  progress.style.width='100%';
  pendingFonts=[];
  renderFontList();
  toast(`已注册 ${pendingFonts.length||'多款'} 自定义字体`);
  switchAdmin('theme-custom');
