<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>镜中世界 · 线上画廊</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:#0a1a10;color:#e0e0e0;line-height:1.7;overflow-x:hidden}
:root{--klein:#002fa7;--green:#0d2818;--gold:#c9a84c}
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-track{background:#0a1a10}
::-webkit-scrollbar-thumb{background:var(--klein);border-radius:3px}

/* 导航 */
.navbar{position:fixed;top:0;left:0;right:0;height:64px;background:rgba(13,40,24,0.95);backdrop-filter:blur(14px);display:flex;align-items:center;justify-content:space-between;padding:0 32px;z-index:900;border-bottom:1px solid rgba(255,255,255,0.06)}
.nav-brand{font-size:22px;font-weight:700;letter-spacing:4px;color:#fff;cursor:pointer;display:flex;align-items:center;gap:10px}
.nav-brand svg{width:28px;height:28px}
.nav-links{display:flex;align-items:center;gap:18px}
.nav-links a{color:rgba(255,255,255,0.7);text-decoration:none;font-size:14px;transition:.3s;padding:6px 14px;border-radius:20px}
.nav-links a:hover{color:#fff;background:rgba(255,255,255,0.06)}
.nav-admin{background:var(--klein)!important;color:#fff!important;padding:6px 20px!important;border-radius:30px!important}

/* Hero */
.hero{height:70vh;min-height:420px;background:linear-gradient(160deg,#0a1a10 0%,#001633 50%,#0a1a10 100%);display:flex;align-items:center;justify-content:center;text-align:center;padding-top:64px}
.hero h1{font-size:68px;letter-spacing:12px;color:#fff;margin-bottom:16px;text-shadow:0 4px 40px rgba(0,47,167,0.3)}
.hero p{font-size:18px;color:rgba(255,255,255,0.55);max-width:520px;margin:0 auto}
.hero .curator{color:var(--gold);font-size:15px;letter-spacing:3px;margin-top:12px}

/* 展览区 */
.section{max-width:1200px;margin:0 auto;padding:80px 24px}
.section-title{font-size:32px;letter-spacing:4px;color:#fff;margin-bottom:44px;text-align:center}
.section-title::after{content:'';display:block;width:50px;height:2px;background:var(--klein);margin:14px auto 0}

/* 展览卡片网格 */
.exhibition-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:28px}
.exhibition-card{background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);border-radius:18px;padding:32px 28px;cursor:pointer;transition:.4s;position:relative;overflow:hidden}
.exhibition-card:hover{border-color:var(--klein);transform:translateY(-6px);background:rgba(255,255,255,0.07)}
.exhibition-card h3{font-size:22px;color:#fff;margin-bottom:8px;letter-spacing:1px}
.exhibition-card .tags{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.exhibition-card .tag{background:rgba(0,47,167,0.2);color:#8ab4ff;padding:2px 12px;border-radius:20px;font-size:11px}
.exhibition-card p{color:rgba(255,255,255,0.45);font-size:14px;line-height:1.8}
.exhibition-card .enter-hint{color:var(--klein);font-size:13px;margin-top:16px;opacity:0;transition:.4s}
.exhibition-card:hover .enter-hint{opacity:1}

/* 专栏 */
.column-article{background:rgba(255,255,255,0.035);border:1px solid rgba(255,255,255,0.07);border-radius:16px;padding:28px 30px;margin-bottom:20px}
.column-article h3{font-size:20px;color:#fff;margin-bottom:4px}
.column-article .date{color:rgba(255,255,255,0.3);font-size:13px;margin-bottom:10px}
.column-article .body{color:rgba(255,255,255,0.5);font-size:14px;line-height:1.9;white-space:pre-wrap}

/* 策展人 */
.curator-card{background:rgba(255,255,255,0.035);border:1px solid rgba(255,255,255,0.07);border-radius:18px;padding:36px 34px}
.curator-card h3{font-size:26px;color:#fff}
.curator-card .role{color:var(--gold);font-size:14px;letter-spacing:2px;margin:6px 0 16px}
.curator-card .bio{color:rgba(255,255,255,0.5);font-size:14px;line-height:1.9;white-space:pre-wrap}

/* 页脚 */
.footer{text-align:center;padding:40px 24px;color:rgba(255,255,255,0.2);font-size:13px;border-top:1px solid rgba(255,255,255,0.04)}

/* ===== 展览详情页 ===== */
.detail-page{display:none;min-height:100vh;padding-top:64px}
.detail-back{padding:24px 32px 0;max-width:1200px;margin:0 auto}
.detail-back a{color:rgba(255,255,255,0.5);text-decoration:none;font-size:14px;cursor:pointer;transition:.3s}
.detail-back a:hover{color:#fff}
.detail-header{padding:40px 32px 20px;max-width:1200px;margin:0 auto}
.detail-header h1{font-size:38px;color:#fff;letter-spacing:3px;margin-bottom:8px}
.detail-header .statement{color:rgba(255,255,255,0.5);font-size:15px;line-height:1.9;max-width:800px}
.detail-grid{padding:20px 32px 60px;max-width:1200px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:24px}
.detail-artwork{background:rgba(255,255,255,0.03);border-radius:14px;overflow:hidden;border:1px solid rgba(255,255,255,0.06);transition:.3s}
.detail-artwork:hover{border-color:var(--klein);transform:translateY(-4px)}
.detail-artwork img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;background:#111}
.detail-artwork .info{padding:14px 16px}
.detail-artwork .info h4{font-size:15px;color:#fff;margin-bottom:2px}
.detail-artwork .info p{font-size:12px;color:rgba(255,255,255,0.4)}

/* ===== 后台 ===== */
.admin-page{display:none;min-height:100vh;padding-top:64px;background:#0a1510}
.admin-container{display:flex;min-height:calc(100vh - 64px)}
.admin-sidebar{width:200px;background:rgba(0,0,0,0.3);padding:24px 0;border-right:1px solid rgba(255,255,255,0.05);flex-shrink:0}
.admin-sidebar a{display:block;padding:12px 24px;color:rgba(255,255,255,0.5);text-decoration:none;font-size:14px;transition:.3s;cursor:pointer}
.admin-sidebar a:hover,.admin-sidebar a.active{color:#fff;background:rgba(0,47,167,0.15)}
.admin-main{flex:1;padding:32px 40px;overflow-y:auto}
.admin-main h2{font-size:24px;color:#fff;margin-bottom:24px;letter-spacing:2px}
.admin-form label{display:block;color:rgba(255,255,255,0.6);margin:14px 0 4px;font-size:13px}
.admin-form input,.admin-form textarea,.admin-form select{width:100%;padding:10px 14px;border:1px solid rgba(255,255,255,0.12);border-radius:10px;background:rgba(255,255,255,0.04);color:#fff;font-size:14px;outline:none;transition:.3s}
.admin-form input:focus,.admin-form textarea:focus{border-color:var(--klein)}
.admin-form textarea{min-height:100px;resize:vertical}
.btn{background:var(--klein);color:#fff;border:none;padding:10px 28px;border-radius:30px;cursor:pointer;font-size:14px;transition:.3s;margin-top:12px}
.btn:hover{background:#003bb5;transform:translateY(-1px)}
.btn-danger{background:#a83232;color:#fff;border:none;padding:6px 14px;border-radius:20px;cursor:pointer;font-size:12px;transition:.3s}
.btn-danger:hover{background:#c73e3e}
.admin-list-item{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid rgba(255,255,255,0.04)}
.admin-list-item span{color:rgba(255,255,255,0.6);font-size:14px}
.admin-empty{color:rgba(255,255,255,0.2);text-align:center;padding:40px 0;font-size:14px}
.toast{position:fixed;bottom:40px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.85);color:#fff;padding:12px 28px;border-radius:30px;font-size:14px;z-index:9999;opacity:0;transition:.4s;pointer-events:none}
.toast.show{opacity:1}

/* 登录弹窗 */
.login-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.82);backdrop-filter:blur(8px);z-index:5000;display:none;align-items:center;justify-content:center}
.login-card{background:#141e18;border:1px solid rgba(255,255,255,0.1);border-radius:20px;padding:40px 36px;width:340px;text-align:center}
.login-card h2{color:#fff;font-size:24px;letter-spacing:3px;margin-bottom:20px}
.login-card input{width:100%;padding:12px 16px;margin-bottom:14px;border:1px solid rgba(255,255,255,0.15);border-radius:10px;background:rgba(255,255,255,0.06);color:#fff;font-size:15px;outline:none}
.login-card input:focus{border-color:var(--klein)}
.login-card button{width:100%;padding:12px;border:none;border-radius:10px;background:var(--klein);color:#fff;font-size:16px;font-weight:600;cursor:pointer;transition:.3s}
.login-card button:hover{background:#003bb5}
.login-card .error{color:#ff6b6b;font-size:13px;margin-top:12px;min-height:20px}

/* 响应式 */
@media(max-width:768px){
  .hero h1{font-size:40px;letter-spacing:6px}
  .exhibition-grid{grid-template-columns:1fr}
  .detail-grid{grid-template-columns:1fr}
  .admin-sidebar{width:140px}
  .admin-sidebar a{padding:10px 16px;font-size:13px}
  .admin-main{padding:20px}
}
</style>
</head>
<body>

<!-- 导航 -->
<nav class="navbar">
  <div class="nav-brand" onclick="showHome()">
    <svg viewBox="0 0 40 40" fill="none"><circle cx="20" cy="20" r="16" stroke="currentColor" stroke-width="1.5"/><circle cx="20" cy="20" r="10" stroke="currentColor" stroke-width="1.2"/><circle cx="29" cy="11" r="3" fill="currentColor" opacity="0.6"/></svg>
    镜中世界
  </div>
  <div class="nav-links">
    <a href="#" onclick="document.getElementById('exhibitions').scrollIntoView({behavior:'smooth'})">展览</a>
    <a href="#" onclick="document.getElementById('columns').scrollIntoView({behavior:'smooth'})">专栏</a>
    <a href="#" onclick="document.getElementById('curator').scrollIntoView({behavior:'smooth'})">策展人</a>
    <a href="#" class="nav-admin" onclick="openLogin()">⚙ 管理</a>
  </div>
</nav>

<!-- 登录弹窗 -->
<div class="login-overlay" id="loginOverlay">
  <div class="login-card">
    <h2>🔐 内部管理</h2>
    <input type="text" id="loginUser" placeholder="账号" value="海屿">
    <input type="password" id="loginPass" placeholder="密码">
    <button onclick="handleLogin()">验证身份</button>
    <div class="error" id="loginError"></div>
  </div>
</div>

<!-- ===== 首页 ===== -->
<div id="homePage">
<section class="hero">
  <div>
    <h1>镜中世界</h1>
    <p>摄影是现实的一面透镜，也是通往另一个世界的窗口。</p>
    <div class="curator">策展人：张昊文</div>
  </div>
</section>

<section class="section" id="exhibitions">
  <h2 class="section-title">展览</h2>
  <div class="exhibition-grid" id="exhibitionGrid"></div>
</section>

<section class="section" id="columns">
  <h2 class="section-title">文字专栏</h2>
  <div id="columnList"></div>
</section>

<section class="section" id="curator">
  <h2 class="section-title">策展人</h2>
  <div class="curator-card" id="curatorCard"></div>
</section>

<footer class="footer">© 2026 镜中世界 · 线上画廊 &nbsp;|&nbsp; 策展人：张昊文</footer>
</div>

<!-- ===== 展览详情页 ===== -->
<div class="detail-page" id="detailPage">
  <div class="detail-back"><a onclick="showHome()">← 返回首页</a></div>
  <div class="detail-header" id="detailHeader"></div>
  <div class="detail-grid" id="detailGrid"></div>
</div>

<!-- ===== 后台管理页 ===== -->
<div class="admin-page" id="adminPage">
  <div class="admin-container">
    <div class="admin-sidebar">
      <a class="active" onclick="switchAdmin('dashboard')">📊 总览</a>
      <a onclick="switchAdmin('exhibitions')">📂 展览</a>
      <a onclick="switchAdmin('columns')">📝 专栏</a>
      <a onclick="switchAdmin('curator')">👤 策展人</a>
      <a onclick="switchAdmin('upload')">🖼 上传</a>
      <a onclick="switchAdmin('settings')">⚙ 设置</a>
      <a onclick="logout()" style="color:#ff6b6b;margin-top:20px">退出登录</a>
    </div>
    <div class="admin-main" id="adminMain"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ============ 数据 ============
const STORAGE_KEY = 'mirror_world_data';
const ACCOUNT_KEY = 'mirror_world_account';
const SESSION_KEY = 'mirror_admin_logged';

const defaultAccount = { username: '海屿', password: 'mse20221028' };
const defaultData = {
  exhibitions: [
    { id:'ex0', title:'2025夏天的颜色', tags:['摄影·年度特展'], statement:'银盐的颗粒感与数字像素的冷冽在此交织。2025年的夏天，我们试图用镜头捕捉那些即将消逝的色彩——褪色的广告牌、夕照下的塑料花、地铁站里陌生人的瞳孔。摄影史告诉我们，每一次对色彩的记录，都是一次对时间的挽留。', artworks:[] },
    { id:'ex1', title:'2026夏天的颜色', tags:['摄影·年度特展'], statement:'当克莱因蓝遇见深绿，当胶片质感碰撞算法美学。2026年的夏天，色彩不再只是视觉经验，而成为了一种哲学追问。正如伊夫·克莱因所言："蓝色是没有维度的，它超越了维度。"', artworks:[] },
    { id:'ex2', title:'快乐之家', tags:['纪实·长期项目'], statement:'从维多利亚时代的家庭肖像到荒木经惟的私写真，家庭摄影始终在真实与表演之间摇摆。"快乐之家"试图在这个张力中寻找一条属于自己的道路——那些看似平凡的日常瞬间，或许才是摄影最动人的力量。', artworks:[] },
    { id:'ex3', title:'风光与星空', tags:['风景摄影·自然纪实'], statement:'从19世纪探险摄影师卡尔顿·沃特金斯穿越内华达山脉的玻璃底片，到安塞尔·亚当斯的月升时分，再到当代星空摄影师的银河长曝——人类对大地与星空的仰望从未改变。', artworks:[] }
  ],
  columns: [
    { id:'c0', title:'镜面与凝视：摄影的本质追问', date:'2026-03-15', body:'摄影是什么？\n\n是现实的镜像，还是观看的权力？苏珊·桑塔格在《论摄影》中写道："收集照片就是收集世界。"每一张照片都是一次切割，将流动的时间凝固成永恒的碎片。\n\n当我们举起相机，我们既是在记录，也是在创造。镜头前的世界经过取景框的筛选，已经不再是原本的模样。这就是摄影最迷人的悖论——它既忠实于现实，又不可避免地扭曲现实。' },
    { id:'c1', title:'夏天的视觉考古学', date:'2026-06-01', body:'夏天，或许是摄影最钟情的季节。\n\n强烈的光线制造出戏剧性的阴影，饱和的色彩在高温中几乎要融化。从威廉·埃格尔斯顿的美国南部夏日到川内伦子的微光世界，摄影家们一直在用镜头挖掘夏天深处的秘密。\n\n这个系列专栏将不定期更新，探讨摄影与时间、记忆、情感之间的微妙关系。' }
  ],
  curator: { name:'张昊文', role:'策展人 · 摄影研究者', bio:'张昊文，独立策展人、摄影批评写作者。专注于当代摄影与视觉文化研究，关注图像如何塑造我们的记忆与身份认同。曾策划多个摄影展览项目，致力于在技术与人文的交汇处寻找摄影的新可能。\n\n联系方式：haowen.zhang@example.com' }
};

function getData(){return JSON.parse(localStorage.getItem(STORAGE_KEY))||defaultData}
function saveData(d){localStorage.setItem(STORAGE_KEY,JSON.stringify(d))}

// ============ 初始化 ============
if(!localStorage.getItem(STORAGE_KEY)) saveData(defaultData);
if(!localStorage.getItem(ACCOUNT_KEY)) localStorage.setItem(ACCOUNT_KEY,JSON.stringify(defaultAccount));

renderHome();

// ============ 首页渲染 ============
function renderHome(){
  const data=getData();
  // 展览卡片
  document.getElementById('exhibitionGrid').innerHTML=data.exhibitions.map((ex,i)=>`
    <div class="exhibition-card" onclick="showDetail('${ex.id}')">
      <div class="tags">${ex.tags.map(t=>`<span class="tag">${t}</span>`).join('')}</div>
      <h3>${ex.title}</h3>
      <p>${ex.statement.slice(0,100)}${ex.statement.length>100?'...':''}</p>
      <div class="enter-hint">点击进入展览 →</div>
    </div>
  `).join('');

  // 专栏
  document.getElementById('columnList').innerHTML=data.columns.map(c=>`
    <div class="column-article">
      <h3>${c.title}</h3>
      <div class="date">${c.date}</div>
      <div class="body">${c.body.slice(0,200)}${c.body.length>200?'...':''}</div>
    </div>
  `).join('')||'<div class="admin-empty">暂无专栏文章</div>';

  // 策展人
  const cu=data.curator;
  document.getElementById('curatorCard').innerHTML=`
    <h3>${cu.name}</h3>
    <div class="role">${cu.role}</div>
    <div class="bio">${cu.bio}</div>
  `;
}

// ============ 页面切换 ============
function showHome(){
  document.getElementById('homePage').style.display='block';
  document.getElementById('detailPage').style.display='none';
  document.getElementById('adminPage').style.display='none';
}

function showDetail(id){
  const data=getData();
  const ex=data.exhibitions.find(e=>e.id===id);
  if(!ex) return toast('展览不存在');
  document.getElementById('homePage').style.display='none';
  document.getElementById('adminPage').style.display='none';
  document.getElementById('detailPage').style.display='block';
  document.getElementById('detailHeader').innerHTML=`
    <h1>${ex.title}</h1>
    <div class="statement">${ex.statement.replace(/\n/g,'<br>')}</div>
  `;
  document.getElementById('detailGrid').innerHTML=ex.artworks.length?ex.artworks.map(a=>`
    <div class="detail-artwork">
      <img src="${a.image}" alt="${a.title}" loading="lazy">
      <div class="info"><h4>${a.title}</h4><p>${a.desc||''}</p></div>
    </div>
  `).join(''):'<div class="admin-empty" style="grid-column:1/-1">暂无作品</div>';
}

// ============ 登录 ============
function openLogin(){
  document.getElementById('loginOverlay').style.display='flex';
  document.getElementById('loginError').textContent='';
}

function handleLogin(){
  const u=document.getElementById('loginUser').value.trim();
  const p=document.getElementById('loginPass').value.trim();
  const acc=JSON.parse(localStorage.getItem(ACCOUNT_KEY));
  if(u===acc.username&&p===acc.password){
    sessionStorage.setItem(SESSION_KEY,'true');
    document.getElementById('loginOverlay').style.display='none';
    enterAdmin();
  }else{
    document.getElementById('loginError').textContent='账号或密码错误';
  }
}

function enterAdmin(){
  if(!sessionStorage.getItem(SESSION_KEY)){openLogin();return}
  document.getElementById('homePage').style.display='none';
  document.getElementById('detailPage').style.display='none';
  document.getElementById('adminPage').style.display='block';
  switchAdmin('dashboard');
}

function logout(){
  sessionStorage.removeItem(SESSION_KEY);
  showHome();
}

// ============ 后台管理 ============
function switchAdmin(tab){
  document.querySelectorAll('.admin-sidebar a').forEach(a=>a.classList.remove('active'));
  document.querySelector(`.admin-sidebar a[onclick*="${tab}"]`).classList.add('active');
  const main=document.getElementById('adminMain');
  const data=getData();

  if(tab==='dashboard'){
    const totalWorks=data.exhibitions.reduce((s,e)=>s+e.artworks.length,0);
    let size=0;try{size=new Blob([localStorage.getItem(STORAGE_KEY)]).size}catch(e){}
    main.innerHTML=`
      <h2>📊 总览</h2>
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:20px;margin-top:20px">
        <div style="background:rgba(255,255,255,0.04);border-radius:14px;padding:24px;text-align:center"><div style="font-size:36px;color:#fff">${data.exhibitions.length}</div><div style="color:rgba(255,255,255,0.4);font-size:13px;margin-top:4px">展览</div></div>
        <div style="background:rgba(255,255,255,0.04);border-radius:14px;padding:24px;text-align:center"><div style="font-size:36px;color:#fff">${totalWorks}</div><div style="color:rgba(255,255,255,0.4);font-size:13px;margin-top:4px">作品</div></div>
        <div style="background:rgba(255,255,255,0.04);border-radius:14px;padding:24px;text-align:center"><div style="font-size:36px;color:#fff">${(size/1024).toFixed(1)}KB</div><div style="color:rgba(255,255,255,0.4);font-size:13px;margin-top:4px">存储</div></div>
        <div style="background:rgba(255,255,255,0.04);border-radius:14px;padding:24px;text-align:center"><div style="font-size:36px;color:#fff">${data.columns.length}</div><div style="color:rgba(255,255,255,0.4);font-size:13px;margin-top:4px">专栏</div></div>
      </div>
    `;
  }

  else if(tab==='exhibitions'){
    let html=`<h2>📂 展览管理</h2>
      <div class="admin-form">
        <label>新增展览</label>
        <input type="text" id="newExTitle" placeholder="展览名称">
        <input type="text" id="newExTags" placeholder="标签（逗号分隔）">
        <textarea id="newExStmt" placeholder="策展陈述"></textarea>
        <button class="btn" onclick="addExhibition()">➕ 添加</button>
      </div>
      <hr style="border-color:rgba(255,255,255,0.06);margin:24px 0;">
      <h3 style="color:#fff;font-size:16px;margin-bottom:12px">现有展览</h3>`;
    data.exhibitions.forEach((ex,i)=>{
      html+=`<div class="admin-list-item">
        <span>${ex.title} <span style="color:rgba(255,255,255,0.3);font-size:12px">(${ex.artworks.length}件作品)</span></span>
        <div><button class="btn-danger" onclick="delExhibition('${ex.id}')">删除</button></div>
      </div>`;
    });
    main.innerHTML=html;
  }

  else if(tab==='columns'){
    let html=`<h2>📝 专栏管理</h2>
      <div class="admin-form">
        <label>新增文章</label>
        <input type="text" id="newColTitle" placeholder="文章标题">
        <input type="date" id="newColDate">
        <textarea id="newColBody" style="min-height:160px" placeholder="正文"></textarea>
        <button class="btn" onclick="addColumn()">➕ 添加</button>
      </div>
      <hr style="border-color:rgba(255,255,255,0.06);margin:24px 0;">
      <h3 style="color:#fff;font-size:16px;margin-bottom:12px">现有文章</h3>`;
    data.columns.forEach((c,i)=>{
      html+=`<div class="admin-list-item"><span>${c.title}</span><div><button class="btn-danger" onclick="delColumn('${c.id}')">删除</button></div></div>`;
    });
    main.innerHTML=html;
  }

  else if(tab==='curator'){
    const cu=data.curator;
    main.innerHTML=`<h2>👤 策展人信息</h2><div class="admin-form">
      <label>姓名</label><input type="text" id="curName" value="${cu.name}">
      <label>头衔</label><input type="text" id="curRole" value="${cu.role}">
      <label>简介</label><textarea id="curBio" style="min-height:140px">${cu.bio}</textarea>
      <button class="btn" onclick="saveCurator()">💾 保存</button>
    </div>`;
  }

  else if(tab==='upload'){
    let html=`<h2>🖼 上传作品</h2><div class="admin-form">
      <label>选择展览</label>
      <select id="uploadEx">`;
    data.exhibitions.forEach((ex,i)=>{html+=`<option value="${ex.id}">${ex.title}</option>`});
    html+=`</select>
      <label>作品标题</label><input type="text" id="uploadTitle" placeholder="作品名称">
      <label>介绍词</label><textarea id="uploadDesc" placeholder="作品介绍"></textarea>
      <label>上传图片（最大 20MB）</label>
      <input type="file" id="uploadImg" accept="image/*">
      <div id="uploadStatus" style="color:rgba(255,255,255,0.4);font-size:13px;margin-top:8px"></div>
      <button class="btn" onclick="doUpload()">⬆ 上传</button>
    </div>`;
    main.innerHTML=html;
  }

  else if(tab==='settings'){
    main.innerHTML=`<h2>⚙ 设置</h2><div class="admin-form">
      <label>导出全部数据（JSON 备份）</label>
      <button class="btn" onclick="exportData()">📥 导出</button>
      <hr style="border-color:rgba(255,255,255,0.06);margin:20px 0;">
      <label>导入备份</label>
      <input type="file" id="importFile" accept=".json">
      <button class="btn" onclick="importData()">📤 导入</button>
      <hr style="border-color:rgba(255,255,255,0.06);margin:20px 0;">
      <label>修改密码</label>
      <input type="password" id="newPass" placeholder="新密码">
      <button class="btn" onclick="changePass()">🔑 修改</button>
      <p id="settingsMsg" style="color:#8ab4ff;margin-top:12px;font-size:13px"></p>
    </div>`;
  }
}

// ============ 后台操作 ============
function addExhibition(){
  const t=document.getElementById('newExTitle').value.trim();
  if(!t){toast('请输入展览名称');return}
  const data=getData();
  data.exhibitions.push({id:'ex'+Date.now(),title:t,tags:(document.getElementById('newExTags').value||'').split(/[,，]/).map(s=>s.trim()).filter(Boolean),statement:document.getElementById('newExStmt').value||'暂无策展陈述',artworks:[]});
  saveData(data);
  switchAdmin('exhibitions');
  renderHome();
  toast('展览已添加');
}

function delExhibition(id){
  if(!confirm('确定删除该展览及其所有作品？')) return;
  const data=getData();
  data.exhibitions=data.exhibitions.filter(e=>e.id!==id);
  saveData(data);
  switchAdmin('exhibitions');
  renderHome();
  toast('已删除');
}

function addColumn(){
  const t=document.getElementById('newColTitle').value.trim();
  if(!t){toast('请输入标题');return}
  const data=getData();
  data.columns.push({id:'c'+Date.now(),title:t,date:document.getElementById('newColDate').value||new Date().toISOString().slice(0,10),body:document.getElementById('newColBody').value||''});
  saveData(data);
  switchAdmin('columns');
  renderHome();
  toast('文章已添加');
}

function delColumn(id){
  if(!confirm('确定删除？')) return;
  const data=getData();
  data.columns=data.columns.filter(c=>c.id!==id);
  saveData(data);
  switchAdmin('columns');
  renderHome();
  toast('已删除');
}

function saveCurator(){
  const data=getData();
  data.curator={name:document.getElementById('curName').value,role:document.getElementById('curRole').value,bio:document.getElementById('curBio').value};
  saveData(data);
  renderHome();
  toast('策展人信息已保存');
}

function doUpload(){
  const fileInput=document.getElementById('uploadImg');
  const file=fileInput.files[0];
  if(!file){toast('请选择图片');return}
  if(file.size>20 * 1024 * 1024){toast('图片超过 20MB 限制');return}
  const status=document.getElementById('uploadStatus');
  status.textContent='正在处理...';
  const reader=new FileReader();
  reader.onload=function(e){
    const img=new Image();
    img.onload=function(){
      const canvas=document.createElement('canvas');
      let w=img.width,h=img.height;
      const max=2400;
      if(w>max||h>max){if(w>h){w=max;h=Math.round(img.height*(max/img.width))}else{h=max;w=Math.round(img.width*(max/img.height))}}
      canvas.width=w;canvas.height=h;
      const ctx=canvas.getContext('2d');
      ctx.drawImage(img,0,0,w,h);
      let quality=0.88;
      let dataUrl;
      for(let i=0;i<5;i++){dataUrl=canvas.toDataURL('image/jpeg',quality);if(dataUrl.length<1048576)break;quality-=0.1}
      const data=getData();
      const exId=document.getElementById('uploadEx').value;
      const ex=data.exhibitions.find(e=>e.id===exId);
      if(!ex){toast('展览不存在');return}
      ex.artworks.push({title:document.getElementById('uploadTitle').value||'未命名',desc:document.getElementById('uploadDesc').value||'',image:dataUrl});
      saveData(data);
      renderHome();
      status.textContent='✅ 上传完成';
      toast('作品已上传');
      fileInput.value='';
      document.getElementById('uploadTitle').value='';
      document.getElementById('uploadDesc').value='';
    };
    img.src=e.target.result;
  };
  reader.readAsDataURL(file);
}

function exportData(){
  const blob=new Blob([localStorage.getItem(STORAGE_KEY)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;a.download='mirror-world-backup.json';a.click();
  URL.revokeObjectURL(url);
  toast('导出成功');
}

function importData(){
  const file=document.getElementById('importFile').files[0];
  if(!file){toast('请选择备份文件');return}
  const reader=new FileReader();
  reader.onload=function(e){
    try{const d=JSON.parse(e.target.result);if(!d.exhibitions||!d.columns){throw new Error('格式错误')}saveData(d);renderHome();switchAdmin('dashboard');toast('导入成功')}
    catch(err){toast('文件格式不正确')}
  };
  reader.readAsText(file);
}

function changePass(){
  const np=document.getElementById('newPass').value.trim();
  if(!np||np.length<4){toast('密码至少4位');return}
  const acc=JSON.parse(localStorage.getItem(ACCOUNT_KEY));
  acc.password=np;
  localStorage.setItem(ACCOUNT_KEY,JSON.stringify(acc));
  document.getElementById('settingsMsg').textContent='✅ 密码已修改';
  toast('密码已更新');
}

// ============ Toast ============
function toast(msg){
  const el=document.getElementById('toast');
  el.textContent=msg;
  el.classList.add('show');
  clearTimeout(el._timer);
  el._timer=setTimeout(()=>el.classList.remove('show'),2200);
}

// 键盘快捷键
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){
    document.getElementById('loginOverlay').style.display='none';
  }
});

// 点击遮罩关闭登录
document.getElementById('loginOverlay').addEventListener('click',function(e){
  if(e.target===this) this.style.display='none';
});
</script>

</html>
