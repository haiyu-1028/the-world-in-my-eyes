<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>镜中世界 · 线上画廊</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:#0a1a10;color:#e0e0e0;line-height:1.7;overflow-x:hidden}
:root{--klein:#002fa7;--green:#0d2818;--gold:#c9a84c}
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-track{background:#0a1a10}
::-webkit-scrollbar-thumb{background:var(--klein);border-radius:3px}

/* 导航 */
.navbar{position:fixed;top:0;left:0;right:0;height:64px;background:rgba(13,40,24,0.95);backdrop-filter:blur(14px);display:flex;align-items:center;justify-content:space-between;padding:0 32px;z-index:900;border-bottom:1px solid rgba(255,255,255,0.06)}
.nav-brand{font-size:22px;font-weight:700;letter-spacing:4px;color:#fff;cursor:pointer;display:flex;align-items:center;gap:10px}
.nav-brand svg{width:28px;height:28px}
.nav-links{display:flex;align-items:center;gap:18px}
.nav-links a{color:rgba(255,255,255,0.7);text-decoration:none;font-size:14px;transition:.3s;padding:6px 14px;border-radius:20px}
.nav-links a:hover{color:#fff;background:rgba(255,255,255,0.06)}
.nav-admin{background:var(--klein)!important;color:#fff!important;padding:6px 20px!important;border-radius:30px!important}

/* Hero */
.hero{height:70vh;min-height:420px;background:linear-gradient(160deg,#0a1a10 0%,#001633 50%,#0a1a10 100%);display:flex;align-items:center;justify-content:center;text-align:center;padding-top:64px}
.hero h1{font-size:68px;letter-spacing:12px;color:#fff;margin-bottom:16px;text-shadow:0 4px 40px rgba(0,47,167,0.3)}
.hero p{font-size:18px;color:rgba(255,255,255,0.55);max-width:520px;margin:0 auto}
.hero .curator{color:var(--gold);font-size:15px;letter-spacing:3px;margin-top:12px}

/* 展览区 */
.section{max-width:1200px;margin:0 auto;padding:80px 24px}
.section-title{font-size:32px;letter-spacing:4px;color:#fff;margin-bottom:44px;text-align:center}
.section-title::after{content:'';display:block;width:50px;height:2px;background:var(--klein);margin:14px auto 0}

/* 展览卡片网格 */
.exhibition-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:28px}
.exhibition-card{background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);border-radius:18px;padding:32px 28px;cursor:pointer;transition:.4s;position:relative;overflow:hidden}
.exhibition-card:hover{border-color:var(--klein);transform:translateY(-6px);background:rgba(255,255,255,0.07)}
.exhibition-card h3{font-size:22px;color:#fff;margin-bottom:8px;letter-spacing:1px}
.exhibition-card .tags{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.exhibition-card .tag{background:rgba(0,47,167,0.2);color:#8ab4ff;padding:2px 12px;border-radius:20px;font-size:11px}
.exhibition-card p{color:rgba(255,255,255,0.45);font-size:14px;line-height:1.8}
.exhibition-card .enter-hint{color:var(--klein);font-size:13px;margin-top:16px;opacity:0;transition:.4s}
.exhibition-card:hover .enter-hint{opacity:1}

/* 专栏 */
.column-article{background:rgba(255,255,255,0.035);border:1px solid rgba(255,255,255,0.07);border-radius:16px;padding:28px 30px;margin-bottom:20px}
.column-article h3{font-size:20px;color:#fff;margin-bottom:4px}
.column-article .date{color:rgba(255,255,255,0.3);font-size:13px;margin-bottom:10px}
.column-article .body{color:rgba(255,255,255,0.5);font-size:14px;line-height:1.9;white-space:pre-wrap}

/* 策展人 */
.curator-card{background:rgba(255,255,255,0.035);border:1px solid rgba(255,255,255,0.07);border-radius:18px;padding:36px 34px}
.curator-card h3{font-size:26px;color:#fff}
.curator-card .role{color:var(--gold);font-size:14px;letter-spacing:2px;margin:6px 0 16px}
.curator-card .bio{color:rgba(255,255,255,0.5);font-size:14px;line-height:1.9;white-space:pre-wrap}

/* 页脚 */
.footer{text-align:center;padding:40px 24px;color:rgba(255,255,255,0.2);font-size:13px;border-top:1px solid rgba(255,255,255,0.04)}

/* ===== 展览详情页 ===== */
.detail-page{display:none;min-height:100vh;padding-top:64px}
.detail-back{padding:24px 32px 0;max-width:1200px;margin:0 auto}
.detail-back a{color:rgba(255,255,255,0.5);text-decoration:none;font-size:14px;cursor:pointer;transition:.3s}
.detail-back a:hover{color:#fff}
.detail-header{padding:40px 32px 20px;max-width:1200px;margin:0 auto}
.detail-header h1{font-size:38px;color:#fff;letter-spacing:3px;margin-bottom:8px}
.detail-header .statement{color:rgba(255,255,255,0.5);font-size:15px;line-height:1.9;max-width:800px}
.detail-works{max-width:1200px;margin:0 auto;padding:20px 32px 60px}

/* 组照卡片 */
.work-group{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.07);border-radius:18px;padding:28px 28px;margin-bottom:36px;transition:.3s}
.work-group:hover{border-color:rgba(0,47,167,0.3)}
.work-group-title{font-size:20px;color:#fff;margin-bottom:4px;letter-spacing:1px}
.work-group-desc{color:rgba(255,255,255,0.45);font-size:14px;line-height:1.8;margin-bottom:18px;white-space:pre-wrap}
.work-group-count{display:inline-block;background:rgba(0,47,167,0.25);color:#8ab4ff;padding:2px 12px;border-radius:20px;font-size:12px;margin-bottom:16px}

/* 组照图片网格 */
.photo-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.photo-item{position:relative;border-radius:10px;overflow:hidden;aspect-ratio:4/3;cursor:pointer;transition:.3s}
.photo-item:hover{transform:scale(1.02);box-shadow:0 4px 20px rgba(0,47,167,0.3)}
.photo-item img{width:100%;height:100%;object-fit:cover;display:block;background:#111}
.photo-item .photo-index{position:absolute;top:8px;left:8px;background:rgba(0,0,0,0.6);color:#fff;font-size:11px;padding:2px 8px;border-radius:10px;backdrop-filter:blur(4px)}

/* 大图灯箱 */
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,0.92);backdrop-filter:blur(6px);z-index:8000;display:none;align-items:center;justify-content:center;flex-direction:column}
.lightbox.active{display:flex}
.lightbox img{max-width:90vw;max-height:80vh;object-fit:contain;border-radius:8px;box-shadow:0 8px 60px rgba(0,0,0,0.6)}
.lightbox .lb-info{color:rgba(255,255,255,0.7);font-size:14px;margin-top:16px;text-align:center}
.lightbox .lb-close{position:absolute;top:24px;right:32px;font-size:32px;color:rgba(255,255,255,0.5);cursor:pointer;transition:.3s;background:none;border:none}
.lightbox .lb-close:hover{color:#fff}
.lightbox .lb-nav{position:absolute;top:50%;transform:translateY(-50%);font-size:40px;color:rgba(255,255,255,0.4);cursor:pointer;transition:.3s;background:none;border:none;padding:20px}
.lightbox .lb-nav:hover{color:#fff}
.lightbox .lb-prev{left:20px}
.lightbox .lb-next{right:20px}

/* ===== 后台 ===== */
.admin-page{display:none;min-height:100vh;padding-top:64px;background:#0a1510}
.admin-container{display:flex;min-height:calc(100vh - 64px)}
.admin-sidebar{width:200px;background:rgba(0,0,0,0.3);padding:24px 0;border-right:1px solid rgba(255,255,255,0.05);flex-shrink:0}
.admin-sidebar a{display:block;padding:12px 24px;color:rgba(255,255,255,0.5);text-decoration:none;font-size:14px;transition:.3s;cursor:pointer}
.admin-sidebar a:hover,.admin-sidebar a.active{color:#fff;background:rgba(0,47,167,0.15)}
.admin-main{flex:1;padding:32px 40px;overflow-y:auto}
.admin-main h2{font-size:24px;color:#fff;margin-bottom:24px;letter-spacing:2px}
.admin-form label{display:block;color:rgba(255,255,255,0.6);margin:14px 0 4px;font-size:13px}
.admin-form input,.admin-form textarea,.admin-form select{width:100%;padding:10px 14px;border:1px solid rgba(255,255,255,0.12);border-radius:10px;background:rgba(255,255,255,0.04);color:#fff;font-size:14px;outline:none;transition:.3s}
.admin-form input:focus,.admin-form textarea:focus{border-color:var(--klein)}
.admin-form textarea{min-height:100px;resize:vertical}
.btn{background:var(--klein);color:#fff;border:none;padding:10px 28px;border-radius:30px;cursor:pointer;font-size:14px;transition:.3s;margin-top:12px}
.btn:hover{background:#003bb5;transform:translateY(-1px)}
.btn-danger{background:#a83232;color:#fff;border:none;padding:6px 14px;border-radius:20px;cursor:pointer;font-size:12px;transition:.3s}
.btn-danger:hover{background:#c73e3e}
.btn-small{background:rgba(255,255,255,0.08);color:rgba(255,255,255,0.7);border:1px solid rgba(255,255,255,0.12);padding:5px 14px;border-radius:20px;cursor:pointer;font-size:12px;transition:.3s;margin-top:8px}
.btn-small:hover{background:rgba(255,255,255,0.15);color:#fff}
.admin-list-item{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid rgba(255,255,255,0.04)}
.admin-list-item span{color:rgba(255,255,255,0.6);font-size:14px}
.admin-empty{color:rgba(255,255,255,0.2);text-align:center;padding:40px 0;font-size:14px}
.toast{position:fixed;bottom:40px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.85);color:#fff;padding:12px 28px;border-radius:30px;font-size:14px;z-index:9999;opacity:0;transition:.4s;pointer-events:none}
.toast.show{opacity:1}

/* 上传区 */
.upload-zone{border:2px dashed rgba(255,255,255,0.15);border-radius:14px;padding:32px;text-align:center;transition:.3s;cursor:pointer;margin-top:12px}
.upload-zone:hover{border-color:var(--klein);background:rgba(0,47,167,0.05)}
.upload-zone.dragover{border-color:var(--klein);background:rgba(0,47,167,0.1)}
.upload-zone p{color:rgba(255,255,255,0.4);font-size:14px;margin:8px 0}
.upload-zone .upload-icon{font-size:36px;margin-bottom:8px}
.upload-progress{margin-top:12px;height:4px;background:rgba(255,255,255,0.08);border-radius:2px;overflow:hidden;display:none}
.upload-progress .bar{height:100%;width:0%;background:var(--klein);transition:width .3s;border-radius:2px}
.preview-list{margin-top:16px;display:flex;flex-wrap:wrap;gap:10px}
.preview-item{position:relative;width:100px;height:100px;border-radius:8px;overflow:hidden;background:#111}
.preview-item img{width:100%;height:100%;object-fit:cover}
.preview-item .remove{position:absolute;top:2px;right:2px;width:20px;height:20px;background:rgba(0,0,0,0.7);color:#fff;border:none;border-radius:50%;font-size:11px;cursor:pointer;display:flex;align-items:center;justify-content:center}

/* 登录弹窗 */
.login-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.82);backdrop-filter:blur(8px);z-index:5000;display:none;align-items:center;justify-content:center}
.login-card{background:#141e18;border:1px solid rgba(255,255,255,0.1);border-radius:20px;padding:40px 36px;width:340px;text-align:center}
.login-card h2{color:#fff;font-size:24px;letter-spacing:3px;margin-bottom:20px}
.login-card input{width:100%;padding:12px 16px;margin-bottom:14px;border:1px solid rgba(255,255,255,0.15);border-radius:10px;background:rgba(255,255,255,0.06);color:#fff;font-size:15px;outline:none}
.login-card input:focus{border-color:var(--klein)}
.login-card button{width:100%;padding:12px;border:none;border-radius:10px;background:var(--klein);color:#fff;font-size:16px;font-weight:600;cursor:pointer;transition:.3s}
.login-card button:hover{background:#003bb5}
.login-card .error{color:#ff6b6b;font-size:13px;margin-top:12px;min-height:20px}

/* 响应式 */
@media(max-width:768px){
  .hero h1{font-size:40px;letter-spacing:6px}
  .exhibition-grid{grid-template-columns:1fr}
  .photo-grid{grid-template-columns:1fr 1fr}
  .admin-sidebar{width:140px}
  .admin-sidebar a{padding:10px 16px;font-size:13px}
  .admin-sidebar{width:120px}
  .admin-main{padding:20px}
}
</style>
</head>

<!-- 导航 -->
<nav class="navbar">

<div id="homePage">

<!-- ===== 展览详情页 ===== -->

<!-- 大图灯箱 -->

</div>

<div class="toast" id="toast"></div>

<script>
// ============ 数据 ============
const STORAGE_KEY = 'mirror_world_data';
const ACCOUNT_KEY = 'mirror_world_account';
const SESSION_KEY = 'mirror_admin_logged';

const defaultAccount = { username: '海屿', password: 'mse20221028' };

// 数据结构说明：
// exhibition.artworks[] 中的每一项是一个"组照"（workGroup）
// workGroup = { id, title, desc, photos: [{id, image, caption}] }
const defaultData = {
  exhibitions: [
    {
      id:'ex0', title:'2025夏天的颜色', tags:['摄影·年度特展'],
      statement:'银盐的颗粒感与数字像素的冷冽在此交织。2025年的夏天，我们试图用镜头捕捉那些即将消逝的色彩——褪色的广告牌、夕照下的塑料花、地铁站里陌生人的瞳孔。摄影史告诉我们，每一次对色彩的记录，都是一次对时间的挽留。',
      artworks:[
        { id:'w0', title:'霓虹与夕照', desc:'城市黄昏时分，人造光与自然光的交界处，色彩呈现出最暧昧的灰度。', photos:[] },
        { id:'w1', title:'塑料花的永恒', desc:'那些永不凋谢的花朵，是夏天最沉默的隐喻。', photos:[] }
      ]
    },
    {
      id:'ex1', title:'2026夏天的颜色', tags:['摄影·年度特展'],
      statement:'当克莱因蓝遇见深绿，当胶片质感碰撞算法美学。2026年的夏天，色彩不再只是视觉经验，而成为了一种哲学追问。正如伊夫·克莱因所言："蓝色是没有维度的，它超越了维度。"',
      artworks:[
        { id:'w2', title:'克莱因蓝的研究', desc:'纯粹之蓝，是视觉的终极归宿。', photos:[] }
      ]
    },
    {
      id:'ex2', title:'快乐之家', tags:['纪实·长期项目'],
      statement:'从维多利亚时代的家庭肖像到荒木经惟的私写真，家庭摄影始终在真实与表演之间摇摆。"快乐之家"试图在这个张力中寻找一条属于自己的道路——那些看似平凡的日常瞬间，或许才是摄影最动人的力量。',
      artworks:[
        { id:'w3', title:'厨房里的光', desc:'母亲在灶台前忙碌的侧影，是家最温暖的轮廓。', photos:[] }
      ]
    },
    {
      id:'ex3', title:'风光与星空', tags:['风景摄影·自然纪实'],
      statement:'从19世纪探险摄影师卡尔顿·沃特金斯穿越内华达山脉的玻璃底片，到安塞尔·亚当斯的月升时分，再到当代星空摄影师的银河长曝——人类对大地与星空的仰望从未改变。',
      artworks:[
        { id:'w4', title:'银河纪事', desc:'在海拔四千米的高原，星空不再是浪漫的修辞，而是物理的实在。', photos:[] },
        { id:'w5', title:'山脊线', desc:'晨雾中的山脉轮廓，如同未显影的底片。', photos:[] }
      ]
    }
  ],
  columns: [
    { id:'c0', title:'镜面与凝视：摄影的本质追问', date:'2026-03-15', body:'摄影是什么？\n\n是现实的镜像，还是观看的权力？苏珊·桑塔格在《论摄影》中写道："收集照片就是收集世界。"每一张照片都是一次切割，将流动的时间凝固成永恒的碎片。\n\n当我们举起相机，我们既是在记录，也是在创造。镜头前的世界经过取景框的筛选，已经不再是原本的模样。这就是摄影最迷人的悖论——它既忠实于现实，又不可避免地扭曲现实。' },
    { id:'c1', title:'夏天的视觉考古学', date:'2026-06-01', body:'夏天，或许是摄影最钟情的季节。\n\n强烈的光线制造出戏剧性的阴影，饱和的色彩在高温中几乎要融化。从威廉·埃格尔斯顿的美国南部夏日到川内伦子的微光世界，摄影家们一直在用镜头挖掘夏天深处的秘密。\n\n这个系列专栏将不定期更新，探讨摄影与时间、记忆、情感之间的微妙关系。' }

};

// ===== 从远程 JSON 加载数据 =====
async function loadRemoteData() {
  try {
    const resp = await fetch('./data.json?_=' + Date.now());
    if (!resp.ok) throw new Error('No remote data');
    const remoteData = await resp.json();
    localStorage.setItem(STORAGE_KEY, JSON.stringify(remoteData));
    console.log('✅ 已加载远程数据');
    return true;
  } catch(e) {
    console.log('ℹ️ 未找到远程数据，使用本地默认');
    return false;
  }
}

function getData(){return JSON.parse(localStorage.getItem(STORAGE_KEY))||defaultData}
function saveData(d){localStorage.setItem(STORAGE_KEY,JSON.stringify(d))}

// ============ 初始化 ============
if(!localStorage.getItem(ACCOUNT_KEY)) localStorage.setItem(ACCOUNT_KEY,JSON.stringify(defaultAccount));

(async () => {
  await loadRemoteData();
  if(!localStorage.getItem(STORAGE_KEY)) saveData(defaultData);

})();

// ============ 灯箱 ============
let lbState = { exId:null, wgId:null, idx:0, photos:[] };

function openLightbox(exId, wgId, idx){
  const data=getData();
  const ex=data.exhibitions.find(e=>e.id===exId);
  const wg=ex.artworks.find(w=>w.id===wgId);
  if(!wg||!wg.photos.length) return;
  lbState={exId,wgId,idx,photos:wg.photos};
  document.getElementById('lightbox').classList.add('active');
  renderLightbox();
}

function renderLightbox(){
  const p=lbState.photos[lbState.idx];
  if(!p) return;
  document.getElementById('lbImg').src=p.image;
  document.getElementById('lbInfo').textContent=`${lbState.idx+1} / ${lbState.photos.length}${p.caption? ' · '+p.caption : ''}`;
}

function lbNav(dir){
  lbState.idx += dir;
  if(lbState.idx<0) lbState.idx=lbState.photos.length-1;
  if(lbState.idx>=lbState.photos.length) lbState.idx=0;
  renderLightbox();
}

function closeLightbox(){
  document.getElementById('lightbox').classList.remove('active');
}

document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){
    closeLightbox();
    document.getElementById('loginOverlay').style.display='none';
  }
  if(document.getElementById('lightbox').classList.contains('active')){
    if(e.key==='ArrowLeft') lbNav(-1);
    if(e.key==='ArrowRight') lbNav(1);
  }
});

// ============ 上传交互 ============
function onUploadExChange(){
  const exId=document.getElementById('uploadEx').value;
  const sel=document.getElementById('uploadWg');
  if(!exId){sel.innerHTML='<option value="">-- 先选择展览 --</option>';return}
  const data=getData();
  const ex=data.exhibitions.find(e=>e.id===exId);
  sel.innerHTML='<option value="">-- 选择已有组照或新建 --</option>'+
    ex.artworks.map(w=>`<option value="${w.id}">${w.title} (${w.photos.length}张)</option>`).join('')+
    '<option value="__new__">➕ 新建组照</option>';
}

function handleDrop(e){
  e.preventDefault();
  document.getElementById('uploadZone').classList.remove('dragover');
  const files=e.dataTransfer.files;
  addFilesToPreview(files);
}

function handleFileSelect(e){
  addFilesToPreview(e.target.files);
}

function addFilesToPreview(files){
  const maxSize=20*1024*1024;
  for(const file of files){
    if(file.size>maxSize){toast(`${file.name} 超过20MB`);continue}
    const reader=new FileReader();
    reader.onload=function(ev){
      const img=new Image();
      img.onload=function(){
        const canvas=document.createElement('canvas');
        let w=img.width,h=img.height;
        const maxDim=2400;
        if(w>maxDim||h>maxDim){if(w>h){w=maxDim;h=Math.round(img.height*(maxDim/img.width))}else{h=maxDim;w=Math.round(img.width*(maxDim/h))}}
        canvas.width=w;canvas.height=h;
        canvas.getContext('2d').drawImage(img,0,0,w,h);
        let q=0.88,result;
        for(let i=0;i<5;i++){result=canvas.toDataURL('image/jpeg',q);if(result.length<1048576)break;q-=0.1}
        if(!window._pendingPhotos) window._pendingPhotos=[];
        window._pendingPhotos.push({image:result,caption:file.name.replace(/\.[^.]+$/,'')});
        renderPreviewList();
      };
      img.src=ev.target.result;
    };
    reader.readAsDataURL(file);
  }
}

function renderPreviewList(){
  const list=document.getElementById('previewList');
  if(!list) return;
  list.innerHTML=window._pendingPhotos.map((p,i)=>`
    <div class="preview-item">
      <img src="${p.image}" alt="">
      <button class="remove" onclick="removePendingPhoto(${i})">×</button>
    </div>
  `).join('');
}

function removePendingPhoto(i){
  window._pendingPhotos.splice(i,1);
  renderPreviewList();
}

function doUploadGroup(){
  const exId=document.getElementById('uploadEx').value;
  const wgId=document.getElementById('uploadWg').value;
  const title=document.getElementById('uploadWgTitle').value.trim();
  const desc=document.getElementById('uploadWgDesc').value.trim();
  const photos=window._pendingPhotos||[];

  if(!exId){toast('请选择展览');return}
  if(!title && wgId!=='__new__' && photos.length===0){toast('请填写组照标题或选择组照');return}
  if(photos.length===0 && wgId!=='__new__'){toast('请至少上传一张图片');return}

  const data=getData();
  const ex=data.exhibitions.find(e=>e.id===exId);

  if(wgId==='__new__' || !wgId){
    if(!title){toast('新建组照请填写标题');return}
    const newWg={id:'w'+Date.now(),title,desc,photos:photos.slice()};
    ex.artworks.push(newWg);
    toast(`✅ 组照「${title}」已创建（${photos.length}张）`);
  } else {
    const wg=ex.artworks.find(w=>w.id===wgId);
    if(photos.length){wg.photos=wg.photos.concat(photos.slice());toast(`✅ 已向「${wg.title}」添加 ${photos.length} 张图片`)}
    if(title){wg.title=title}
    if(desc){wg.desc=desc}
  }

  saveData(data);
  renderHome();
  // 重置
  window._pendingPhotos=[];
  document.getElementById('previewList').innerHTML='';
  document.getElementById('uploadWgTitle').value='';
  document.getElementById('uploadWgDesc').value='';
  document.getElementById('uploadFiles').value='';
  onUploadExChange();
}

// ============ 组照管理 ============
function addWorkGroup(exId){

  const desc=prompt('组照介绍词（可留空）：')||'';

  ex.artworks.push({id:'w'+Date.now(),title:title.trim(),desc,photos:[]});
  saveData(data);
  switchAdmin('exhibitions');
  renderHome();

}

function editWorkGroup(exId,wgId){
  const data=getData();
  const wg=data.exhibitions.find(e=>e.id===exId).artworks.find(w=>w.id===wgId);
  const newTitle=prompt('组照标题：',wg.title);
  if(newTitle!==null && newTitle.trim()) wg.title=newTitle.trim();
  const newDesc=prompt('组照介绍词：',wg.desc||'');
  if(newDesc!==null) wg.desc=newDesc;
  saveData(data);
  switchAdmin('exhibitions');
  renderHome();

}

function delWorkGroup(exId,wgId){
  if(!confirm('确定删除该组照及其所有图片？')) return;
  const data=getData();
  const ex=data.exhibitions.find(e=>e.id===exId);
  ex.artworks=ex.artworks.filter(w=>w.id!==wgId);
  saveData(data);
  switchAdmin('exhibitions');
  renderHome();
  toast('已删除');
}

// ============ 备份/设置 ============
function exportData(){
  const blob=new Blob([localStorage.getItem(STORAGE_KEY)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;a.download='mirror-world-backup.json';a.click();
  URL.revokeObjectURL(url);
  toast('导出成功');
}

function importData(){
  const file=document.getElementById('importFile').files[0];
  if(!file){toast('请选择备份文件');return}
  const reader=new FileReader();
  reader.onload=function(e){
    try{const d=JSON.parse(e.target.result);if(!d.exhibitions||!d.columns){throw new Error('格式错误')}saveData(d);renderHome();switchAdmin('dashboard');toast('导入成功')}
    catch(err){toast('文件格式不正确')}
  };
  reader.readAsText(file);
}

function changePass(){
  const np=document.getElementById('newPass').value.trim();
  if(!np||np.length<4){toast('密码至少4位');return}
  const acc=JSON.parse(localStorage.getItem(ACCOUNT_KEY));
  acc.password=np;
  localStorage.setItem(ACCOUNT_KEY,JSON.stringify(acc));
  document.getElementById('settingsMsg').textContent='✅ 密码已修改';
  toast('密码已更新');
}

// ============ Toast ============
function toast(msg){
  const el=document.getElementById('toast');
  el.textContent=msg;
  el.classList.add('show');
  clearTimeout(el._timer);
  el._timer=setTimeout(()=>el.classList.remove('show'),2200);
}

// 点击遮罩关闭登录
document.getElementById('loginOverlay').addEventListener('click',function(e){
  if(e.target===this) this.style.display='none';
});
</script>
