<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>镜中世界 · 线上画廊</title>
<style>
:root{
  --bg:#0b0f1a;
  --panel:#12182b;
  --border:#1e2a4a;
  --txt:#e0e6ed;
  --muted:#8b95a5;
  --primary:#4f8cff;
  --primary-hover:#3a78e6;
  --klein:#002fa7;
  --green:#0d2818;
  --gold:#c9a84c;
  --danger:#e74c3c;
  --success:#2ecc71;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--txt);line-height:1.6;overflow-x:hidden;
}
a{color:var(--primary);text-decoration:none}
button{font-family:inherit;cursor:pointer;border:none;border-radius:8px;padding:8px 14px;font-size:14px}
button.primary{background:var(--primary);color:#fff}
button.primary:hover{background:var(--primary-hover)}
button.primary:disabled{opacity:.5;cursor:not-allowed}
button.danger{background:var(--danger);color:#fff}
button.secondary{background:transparent;border:1px solid var(--border);color:var(--txt)}
input,textarea,select{
  font-family:inherit;font-size:14px;background:var(--panel);color:var(--txt);
  border:1px solid var(--border);border-radius:8px;padding:8px 12px;width:100%;outline:none;
}
input:focus,textarea:focus,select:focus{border-color:var(--primary)}
textarea{min-height:80px;resize:vertical}

/* Navbar */
.navbar{
  position:fixed;top:0;left:0;right:0;height:56px;z-index:900;
  background:rgba(11,15,26,.95);backdrop-filter:blur(10px);
  display:flex;align-items:center;justify-content:space-between;padding:0 24px;
  border-bottom:1px solid var(--border);
}
.nav-brand{font-size:18px;font-weight:700;color:#fff;cursor:pointer;letter-spacing:2px}
.nav-links{display:flex;align-items:center;gap:16px}
.nav-links a{color:var(--muted);font-size:14px;transition:.2s}
.nav-links a:hover{color:#fff}
.btn-manage{background:var(--primary);color:#fff;padding:6px 16px;border-radius:20px;font-size:13px}

/* Hero */
.hero{
  min-height:60vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:80px 24px 40px;
  background:linear-gradient(160deg,#0b0f1a 0%,#0a1a33 50%,#0b0f1a 100%);
}
.hero h1{font-size:clamp(40px,8vw,72px);color:#fff;letter-spacing:8px;margin-bottom:12px}
.hero p{font-size:16px;color:var(--muted);max-width:500px;margin:0 auto}
.hero .curator{color:var(--gold);margin-top:10px;font-size:14px}

/* Sections */
.section{max-width:1100px;margin:0 auto;padding:60px 24px}
.section-title{font-size:28px;color:#fff;text-align:center;margin-bottom:36px;letter-spacing:3px}
.section-title::after{content:'';display:block;width:40px;height:2px;background:var(--primary);margin:12px auto 0}

/* Cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:20px}
.card{
  background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:24px;
  cursor:pointer;transition:.3s;
}
.card:hover{border-color:var(--primary);transform:translateY(-4px)}
.card h3{font-size:18px;color:#fff;margin-bottom:8px}
.card .tag{display:inline-block;background:rgba(79,140,255,.15);color:#8ab4ff;padding:2px 10px;border-radius:12px;font-size:11px;margin-right:6px;margin-bottom:8px}
.card p{font-size:13px;color:var(--muted);line-height:1.7}
.card .meta{font-size:12px;color:#666;margin-top:10px}

/* Column */
.col-article{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:24px;margin-bottom:16px}
.col-article h3{font-size:18px;color:#fff;margin-bottom:4px}
.col-article .date{font-size:12px;color:var(--muted);margin-bottom:8px}
.col-article .body{font-size:14px;color:#aaa;line-height:1.8;white-space:pre-wrap}

/* Curator */
.curator-block{
  display:flex;gap:24px;margin-bottom:40px;align-items:flex-start;
  background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:28px;
}
.curator-block:nth-child(even){flex-direction:row-reverse}
.curator-photo{
  width:180px;height:220px;object-fit:cover;border-radius:12px;flex-shrink:0;
  background:#1a1a2e;display:flex;align-items:center;justify-content:center;color:#444;font-size:32px;
}
.curator-info{flex:1}
.curator-info h3{font-size:24px;color:#fff;margin-bottom:4px}
.curator-info .role{color:var(--gold);font-size:13px;margin-bottom:12px}
.curator-info .bio{font-size:14px;color:#aaa;line-height:1.9;white-space:pre-wrap}
.curator-info .contact{color:var(--gold);font-size:13px;margin-top:10px}
.curator-index{font-size:12px;color:var(--primary);margin-bottom:8px}

/* Detail page */
.detail-page{display:none;padding-top:56px;min-height:100vh}
.detail-back{padding:20px 24px 0;max-width:1100px;margin:0 auto}
.detail-back a{color:var(--muted);cursor:pointer;font-size:14px}
.detail-header{padding:30px 24px 10px;max-width:1100px;margin:0 auto}
.detail-header h1{font-size:32px;color:#fff;letter-spacing:2px}
.detail-header .statement{color:#aaa;font-size:14px;line-height:1.8;margin-top:10px;max-width:800px}
.detail-content{padding:20px 24px 60px;max-width:1100px;margin:0 auto}

/* Group */
.group-block{margin-bottom:36px}
.group-block h3{font-size:18px;color:#fff;margin-bottom:4px}
.group-block .desc{font-size:13px;color:#888;margin-bottom:12px;white-space:pre-wrap}
.photo-board{
  background:var(--panel);border-radius:12px;padding:16px;margin-bottom:16px;
  box-shadow:0 8px 24px rgba(0,0,0,.4),0 2px 8px rgba(0,0,0,.3);
  border-top:4px solid var(--primary);
}
.photo-board img{width:100%;border-radius:8px;display:block}
.photo-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;margin-top:12px}

/* Lightbox */
.lightbox{display:none;position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:9999;align-items:center;justify-content:center;flex-direction:column}
.lightbox.active{display:flex}
.lightbox img{max-width:90vw;max-height:80vh;border-radius:8px}
.lightbox .lb-close{position:absolute;top:20px;right:20px;font-size:28px;color:#fff;cursor:pointer;background:none;border:none}
.lightbox .lb-prev,.lightbox .lb-next{position:absolute;top:50%;transform:translateY(-50%);font-size:36px;color:#fff;cursor:pointer;background:none;border:none;padding:20px}
.lightbox .lb-prev{left:20px}
.lightbox .lb-next{right:20px}
.lightbox .lb-counter{color:#fff;font-size:13px;margin-top:12px}

/* Login */
.login-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:5000;align-items:center;justify-content:center}
.login-overlay.active{display:flex}
.login-card{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:36px;width:320px;text-align:center}
.login-card h2{color:#fff;margin-bottom:16px;letter-spacing:2px}
.login-card input{margin-bottom:12px}
.login-card button{width:100%;padding:10px;font-size:15px}
.login-card .err{color:var(--danger);font-size:13px;margin-top:8px;min-height:18px}

/* Admin */
.admin-page{display:none;padding-top:56px;min-height:100vh;flex-direction:column}
.admin-layout{display:flex;flex:1}
.admin-sidebar{width:200px;background:#080c16;border-right:1px solid var(--border);padding:20px 0;flex-shrink:0}
.admin-sidebar a{display:block;padding:10px 20px;color:var(--muted);font-size:14px;cursor:pointer;border-left:3px solid transparent}
.admin-sidebar a:hover,.admin-sidebar a.active{color:#fff;background:rgba(79,140,255,.1);border-left-color:var(--primary)}
.admin-sidebar .logout-link{color:var(--danger)!important;margin-top:20px}
.admin-main{flex:1;padding:24px;overflow-y:auto}
.admin-main h2{font-size:20px;color:#fff;margin-bottom:20px}

/* Admin widgets */
.drop-zone{
  border:2px dashed var(--border);border-radius:12px;padding:36px;text-align:center;
  cursor:pointer;position:relative;margin-top:8px;
}
.drop-zone:hover{border-color:var(--primary)}
.drop-zone input[type=file]{position:absolute;top:0;left:0;width:100%;height:100%;opacity:0;cursor:pointer;z-index:2}
.drop-zone .hint{color:var(--muted);font-size:13px;position:relative;z-index:1;pointer-events:none}
.drop-zone .btn-inline{margin-top:10px;position:relative;z-index:1;pointer-events:none}
.file-list{margin-top:12px}
.file-item{display:flex;justify-content:space-between;align-items:center;background:rgba(30,42,74,.5);padding:8px 12px;border-radius:8px;margin-bottom:6px;font-size:13px}
.file-item .x{color:var(--danger);cursor:pointer;font-size:16px}

/* Modal */
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:6000;align-items:center;justify-content:center}
.modal.active{display:flex}
.modal-card{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:32px;width:500px;max-width:90vw;max-height:85vh;overflow-y:auto}
.modal-card h3{color:#fff;margin-bottom:16px}
.modal-card label{display:block;color:var(--muted);font-size:13px;margin:12px 0 4px}
.modal-actions{display:flex;gap:10px;margin-top:20px;justify-content:flex-end}

/* Toast */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.85);color:#fff;padding:10px 20px;border-radius:8px;font-size:13px;z-index:9999;opacity:0;transition:.3s;pointer-events:none}
.toast.show{opacity:1}

/* Footer */
footer{text-align:center;padding:30px;color:#444;font-size:12px;border-top:1px solid var(--border);margin-top:40px}

/* Responsive */
@media(max-width:768px){
  .curator-block{flex-direction:column!important}
  .curator-photo{width:100%;height:200px}
  .admin-sidebar{width:140px}
  .admin-sidebar a{padding:8px 12px;font-size:12px}
  .hero h1{font-size:36px;letter-spacing:4px}
}
</style>
</head>
<body>

<!-- Navbar -->
<nav class="navbar">
  <div class="nav-brand" onclick="showHome()">镜中世界</div>
  <div class="nav-links">
    <a href="#" onclick="showSection('exhibitions')">展览</a>
    <a href="#" onclick="showSection('columns')">专栏</a>
    <a href="#" onclick="showSection('curators')">策展人</a>
    <a href="#" class="btn-manage" onclick="openLogin()">⚙ 管理</a>
  </div>
</nav>

<!-- Login -->
<div class="login-overlay" id="loginOverlay">
  <div class="login-card">
    <h2>🔐 内部管理</h2>
    <input type="text" id="loginUser" placeholder="账号" value="海屿">
    <input type="password" id="loginPass" placeholder="密码">
    <button class="primary" onclick="handleLogin()">验证身份</button>
    <div class="err" id="loginErr"></div>
  </div>
</div>

<!-- Home -->
<div id="homePage">
  <section class="hero">
    <h1>镜中世界</h1>
    <p>摄影是现实的一面透镜，也是通往另一个世界的窗口。</p>
    <div class="curator">策展人：张昊文</div>
  </section>

  <section class="section" id="exhibitions">
    <h2 class="section-title">展览</h2>
    <div class="grid" id="exGrid"></div>
  </section>

  <section class="section" id="columns">
    <h2 class="section-title">文字专栏</h2>
    <div id="colList"></div>
  </section>

  <section class="section" id="curators">
    <h2 class="section-title">策展人</h2>
    <div id="curList"></div>
  </section>

  <footer>© 2026 镜中世界 · 线上画廊 &nbsp;|&nbsp; 策展人：张昊文</footer>
</div>

<!-- Detail -->
<div class="detail-page" id="detailPage">
  <div class="detail-back"><a onclick="showHome()">← 返回首页</a></div>
  <div class="detail-header" id="detailHeader"></div>
  <div class="detail-content" id="detailContent"></div>
</div>

<!-- Admin -->
<div class="admin-page" id="adminPage">
  <div class="admin-layout">
    <aside class="admin-sidebar" id="adminSidebar"></aside>
    <main class="admin-main" id="adminMain"></main>
  </div>
</div>

<!-- Lightbox -->
<div class="lightbox" id="lightbox">
  <button class="lb-close" onclick="closeLightbox()">✕</button>
  <button class="lb-prev" onclick="lbNav(-1)">‹</button>
  <img id="lbImg" src="" alt="">
  <button class="lb-next" onclick="lbNav(1)">›</button>
  <div class="lb-counter" id="lbCounter"></div>
</div>

<!-- Modal -->
<div class="modal" id="modal">
  <div class="modal-card" id="modalCard"></div>
</div>

<div class="toast" id="toast"></div>

<script>
// ============ DATA ============
const STORE_KEY='mirror_world_data';
const ACC_KEY='mirror_world_account';
const SESSION='mirror_admin_logged';
const REMOTE='./data.json';

const defaultAccount={username:'海屿',password:'mse20221028'};
const defaultData={
  exhibitions:[
    {id:'ex0',title:'2025夏天的颜色',tags:['摄影·年度特展'],statement:'银盐的颗粒感与数字像素的冷冽在此交织。2025年的夏天，我们试图用镜头捕捉那些即将消逝的色彩——褪色的广告牌、夕照下的塑料花、地铁站里陌生人的瞳孔。摄影史告诉我们，每一次对色彩的记录，都是一次对时间的挽留。',groups:[],views:0,style:{boardColor:'#002fa7',titleFont:'',bodyFont:''}},
    {id:'ex1',title:'2026夏天的颜色',tags:['摄影·年度特展'],statement:'当克莱因蓝遇见深绿，当胶片质感碰撞算法美学。2026年的夏天，色彩不再只是视觉经验，而成为了一种哲学追问。正如伊夫·克莱因所言："蓝色是没有维度的，它超越了维度。"',groups:[],views:0,style:{boardColor:'#0d2818',titleFont:'',bodyFont:''}},
    {id:'ex2',title:'快乐之家',tags:['纪实·长期项目'],statement:'从维多利亚时代的家庭肖像到荒木经惟的私写真，家庭摄影始终在真实与表演之间摇摆。"快乐之家"试图在这个张力中寻找一条属于自己的道路——那些看似平凡的日常瞬间，或许才是摄影最动人的力量。',groups:[],views:0,style:{boardColor:'#1a3320',titleFont:'',bodyFont:''}},
    {id:'ex3',title:'风光与星空',tags:['风景摄影·自然纪实'],statement:'从19世纪探险摄影师卡尔顿·沃特金斯穿越内华达山脉的玻璃底片，到安塞尔·亚当斯的月升时分，再到当代星空摄影师的银河长曝——人类对大地与星空的仰望从未改变。',groups:[],views:0,style:{boardColor:'#1a1a2e',titleFont:'',bodyFont:''}}
  ],
  columns:[
    {id:'c0',title:'镜面与凝视：摄影的本质追问',date:'2026-03-15',body:'摄影是什么？\n\n是现实的镜像，还是观看的权力？苏珊·桑塔格在《论摄影》中写道："收集照片就是收集世界。"每一张照片都是一次切割，将流动的时间凝固成永恒的碎片。\n\n当我们举起相机，我们既是在记录，也是在创造。镜头前的世界经过取景框的筛选，已经不再是原本的模样。这就是摄影最迷人的悖论——它既忠实于现实，又不可避免地扭曲现实。'},
    {id:'c1',title:'夏天的视觉考古学',date:'2026-06-01',body:'夏天，或许是摄影最钟情的季节。\n\n强烈的光线制造出戏剧性的阴影，饱和的色彩在高温中几乎要融化。从威廉·埃格尔斯顿的美国南部夏日到川内伦子的微光世界，摄影家们一直在用镜头挖掘夏天深处的秘密。\n\n这个系列专栏将不定期更新，探讨摄影与时间、记忆、情感之间的微妙关系。'}
  ],
  curators:[
    {id:'cur0',name:'张昊文',role:'策展人 · 摄影研究者',bio:'张昊文，24级本科在读，人文、风光摄影师，摄影批评写作者。专注于当代摄影与视觉文化研究与光影艺术表达，关注图像如何塑造、表达情绪与故事内容。致力于在技术与人文的交汇处寻找摄影的新可能。\n\n联系方式：1964391340@qq.com',photo:''}
  ],
  theme:{customFonts:[],bg:'',boardColor:'#12182b',titleFont:'',bodyFont:'',curatorFont:''}
};

// ============ STORAGE ============
function loadRemote(){
  return fetch(REMOTE+'?_='+Date.now()).then(r=>r.ok?r.json():null).catch(()=>null);
}
function getData(){
  const d=localStorage.getItem(STORE_KEY);
  if(d) try{return JSON.parse(d)}catch(e){}
  return null;
}
function setData(d){localStorage.setItem(STORE_KEY,JSON.stringify(d))}
function getAccount(){
  const a=localStorage.getItem(ACC_KEY);
  if(a) try{return JSON.parse(a)}catch(e){}
  return defaultAccount;
}

// ============ INIT ============
let DATA=null;
let pendingFiles=[];

(async function init(){
  const remote=await loadRemote();
  const local=getData();
  if(remote && (!local || JSON.stringify(remote)!==JSON.stringify(local))){
    DATA=remote;
    setData(DATA);
    console.log('✅ 从 data.json 加载数据');
  } else {
    DATA=local||defaultData;
    setData(DATA);
  }
  if(!localStorage.getItem(ACC_KEY)) localStorage.setItem(ACC_KEY,JSON.stringify(defaultAccount));
  renderHome();
  applyTheme();
})();

// ============ RENDER HOME ============
function renderHome(){
  const d=DATA;
  // Exhibitions
  document.getElementById('exGrid').innerHTML=d.exhibitions.map((ex,i)=>`
    <div class="card" onclick="showDetail('${ex.id}')">
      <div>${ex.tags.map(t=>`<span class="tag">${t}</span>`).join('')}</div>
      <h3>${ex.title}</h3>
      <p>${ex.statement.slice(0,90)}${ex.statement.length>90?'...':''}</p>
      <div class="meta">${ex.groups.length} 组 · ${ex.groups.reduce((s,g)=>s+(g.images?g.images.length:0),0)} 张 · ${ex.views||0} 次浏览</div>
    </div>
  `).join('');
  // Columns
  document.getElementById('colList').innerHTML=d.columns.map(c=>`
    <div class="col-article">
      <h3>${c.title}</h3>
      <div class="date">${c.date}</div>
      <div class="body">${c.body.slice(0,180)}${c.body.length>180?'...':''}</div>
    </div>
  `).join('')||'<div style="color:#444">暂无专栏</div>';
  // Curators
  document.getElementById('curList').innerHTML=d.curators.map((c,i)=>`
    <div class="curator-block">
      <div class="curator-photo">${c.photo?`<img src="${c.photo}" style="width:100%;height:100%;object-fit:cover;border-radius:12px">`:'📷'}</div>
      <div class="curator-info">
        <div class="curator-index">— 0${i+1} / 0${d.curators.length} —</div>
        <h3>${c.name}</h3>
        <div class="role">${c.role}</div>
        <div class="bio">${c.bio}</div>
      </div>
    </div>
  `).join('');
}

// ============ NAV ============
function showHome(){
  document.getElementById('homePage').style.display='block';
  document.getElementById('detailPage').style.display='none';
  document.getElementById('adminPage').style.display='none';
  window.scrollTo(0,0);
}
function showSection(id){
  showHome();
  document.getElementById(id).scrollIntoView({behavior:'smooth'});
}

// ============ DETAIL ============
function showDetail(id){
  const ex=DATA.exhibitions.find(e=>e.id===id);
  if(!ex) return;
  ex.views=(ex.views||0)+1;
  setData(DATA);
  document.getElementById('homePage').style.display='none';
  document.getElementById('adminPage').style.display='none';
  document.getElementById('detailPage').style.display='block';
  document.getElementById('detailHeader').innerHTML=`
    <h1>${ex.title}</h1>
    <div class="statement">${ex.statement.replace(/\n/g,'<br>')}</div>
  `;
  let html='';
  if(ex.groups.length){
    ex.groups.forEach(g=>{
      html+=`<div class="group-block"><h3>${g.title}</h3>`;
      if(g.desc) html+=`<div class="desc">${g.desc}</div>`;
      html+=`<div class="photo-board" style="border-top-color:${ex.style.boardColor||'#002fa7'}">`;
      if(g.images&&g.images.length){
        g.images.forEach((img,i)=>{
          html+=`<img src="${img.url}" alt="${img.name||''}" style="margin-bottom:8px;cursor:pointer" onclick="openLightbox('${ex.id}','${g.id}',${i})">`;
        });
      }
      html+=`</div></div>`;
    });
  } else {
    html='<div style="color:#444">暂无作品，管理员可上传。</div>';
  }
  document.getElementById('detailContent').innerHTML=html;
  window.scrollTo(0,0);
}

// ============ LIGHTBOX ============
let lbData=null;
function openLightbox(exId,gId,idx){
  const g=DATA.exhibitions.find(e=>e.id===exId).groups.find(x=>x.id===gId);
  if(!g||!g.images) return;
  lbData={images:g.images,idx};
  document.getElementById('lightbox').classList.add('active');
  lbShow();
}
function lbShow(){
  const img=lbData.images[lbData.idx];
  document.getElementById('lbImg').src=img.url;
  document.getElementById('lbCounter').textContent=(lbData.idx+1)+' / '+lbData.images.length;
}
function lbNav(d){lbData.idx=(lbData.idx+d+lbData.images.length)%lbData.images.length;lbShow()}
function closeLightbox(){document.getElementById('lightbox').classList.remove('active');lbData=null}
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){closeLightbox();closeModal();document.getElementById('loginOverlay').classList.remove('active')}
  if(lbData){if(e.key==='ArrowLeft')lbNav(-1);if(e.key==='ArrowRight')lbNav(1)}
});

// ============ LOGIN ============
function openLogin(){document.getElementById('loginOverlay').classList.add('active');document.getElementById('loginErr').textContent=''}
function handleLogin(){
  const u=document.getElementById('loginUser').value.trim();
  const p=document.getElementById('loginPass').value.trim();
  const acc=getAccount();
  if(u===acc.username&&p===acc.password){
    sessionStorage.setItem(SESSION,'1');
    document.getElementById('loginOverlay').classList.remove('active');
    enterAdmin();
  } else {
    document.getElementById('loginErr').textContent='账号或密码错误';
  }
}
function enterAdmin(){
  if(!sessionStorage.getItem(SESSION)){openLogin();return}
  document.getElementById('homePage').style.display='none';
  document.getElementById('detailPage').style.display='none';
  document.getElementById('adminPage').style.display='flex';
  renderSidebar('dashboard');
}
function logout(){
  if(!confirm('确定退出内部管理？')) return;
  sessionStorage.removeItem(SESSION);
  showHome();
}

function fontOptions(selected){
  const fonts=['','默认','Noto Serif SC','Noto Sans SC','Inter','Playfair Display','Cormorant Garamond','思源黑体'];
  return fonts.map(f=>`<option ${selected===f?'selected':''}>${f||'— 请选择 —'}</option>`).join('')+
    (DATA.theme.customFonts||[]).map((cf,i)=>`<option ${selected===('custom'+i)?'selected':''}>custom${i}</option>`).join('');
}

// ============ UPLOAD ============
function bindUpload(){
  const drop=document.getElementById('upDrop');
  const input=document.getElementById('upFile');
  if(!drop||!input) return;
  drop.addEventListener('click',e=>{if(e.target!==input)input.click()});
  input.addEventListener('change',()=>handleFiles(input.files));
  drop.addEventListener('dragover',e=>{e.preventDefault();drop.style.borderColor='var(--primary)'});
  drop.addEventListener('dragleave',()=>drop.style.borderColor='');
  drop.addEventListener('drop',e=>{e.preventDefault();drop.style.borderColor='';handleFiles(e.dataTransfer.files)});
  document.getElementById('upGroupTitle').addEventListener('input',checkUp);
}
function handleFiles(files){
  pendingFiles=Array.from(files).filter(f=>f.type.startsWith('image/'));
  renderUpList();
  checkUp();
}
function renderUpList(){
  const el=document.getElementById('upList');
  if(!el) return;
  el.innerHTML=pendingFiles.map((f,i)=>`<div class="file-item"><span>🖼 ${f.name} (${Math.round(f.size/1024)}KB)</span><span class="x" onclick="removeFile(${i})">✕</span></div>`).join('');
}
function removeFile(i){pendingFiles.splice(i,1);renderUpList();checkUp()}
function checkUp(){
  const t=document.getElementById('upGroupTitle');
  const btn=document.getElementById('upBtn');
  if(t&&btn) btn.disabled=!(t.value.trim()&&pendingFiles.length>0);
}

function doUpload(){
  const exId=document.getElementById('upEx').value;
  const title=document.getElementById('upGroupTitle').value.trim();
  const desc=document.getElementById('upGroupDesc').value.trim();
  const ex=DATA.exhibitions.find(e=>e.id===exId);
  if(!ex||!title||!pendingFiles.length){toast('请填写标题并选择图片');return}
  const group={id:'g_'+Date.now(),title,desc,images:[]};
  let done=0;
  pendingFiles.forEach(f=>{
    const r=new FileReader();
    r.onload=e=>{
      group.images.push({url:e.target.result,name:f.name,size:f.size});
      done++;
      if(done===pendingFiles.length){
        ex.groups.push(group);
        setData(DATA);
        toast(`✅ 上传成功：${done} 张`);
        pendingFiles=[];
        document.getElementById('upGroupTitle').value='';
        document.getElementById('upGroupDesc').value='';
        renderUpList();
        checkUp();
        renderHome();
      }
    };
    r.readAsDataURL(f);
  });
}

// ============ APPEARANCE ============
function setBg(v){DATA.theme.bg=v;document.body.style.background=v;setData(DATA)}
function setBoard(v){
  DATA.theme.boardColor=v;
  setData(DATA);
  document.querySelectorAll('.photo-board').forEach(el=>el.style.borderTopColor=v);
}
function setFont(type,v){
  DATA.theme[type+'Font']=v;
  setData(DATA);
  applyTheme();
}
function applyTheme(){
  const t=DATA.theme;
  if(t.bg) document.body.style.background=t.bg;
  if(t.titleFont) document.documentElement.style.setProperty('--title-font',t.titleFont);
  if(t.bodyFont) document.documentElement.style.setProperty('--body-font',t.bodyFont);
  // inject custom fonts
  const style=document.getElementById('cf-style')||document.createElement('style');
  style.id='cf-style';
  if(t.customFonts&&t.customFonts.length){
    style.innerHTML=t.customFonts.map((cf,i)=>`@font-face{font-family:'custom${i}';src:url('${cf.data}') format('${cf.format||"truetype"}')}`).join('');
  }
  document.head.appendChild(style);
}

function bindFontUpload(){
  const drop=document.getElementById('fontDrop');
  const input=document.getElementById('fontFile');
  if(!drop||!input) return;
  drop.addEventListener('click',e=>{if(e.target!==input)input.click()});
  input.addEventListener('change',()=>handleFonts(input.files));
  drop.addEventListener('dragover',e=>{e.preventDefault();drop.style.borderColor='var(--primary)'});
  drop.addEventListener('dragleave',()=>drop.style.borderColor='');
  drop.addEventListener('drop',e=>{e.preventDefault();drop.style.borderColor='';handleFonts(e.dataTransfer.files)});
}
function handleFonts(files){
  Array.from(files).forEach(f=>{
    const r=new FileReader();
    r.onload=e=>{
      const ext=(f.name.match(/\.(ttf|otf|woff2?)$/i)||[,'ttf'])[1].toLowerCase();
      const fmt=ext==='woff2'?'woff2':ext==='woff'?'woff':ext==='otf'?'opentype':'truetype';
      DATA.theme.customFonts.push({name:f.name,data:e.target.result,format:fmt});
      setData(DATA);
      applyTheme();
      toast(`✅ 字体 ${f.name} 已注册`);
      renderFontList();
      renderAdminMain('appearance');
    };
    r.readAsDataURL(f);
  });
}
function renderFontList(){
  const el=document.getElementById('fontList');
  if(!el) return;
  const list=DATA.theme.customFonts||[];
  el.innerHTML=list.length?list.map((f,i)=>`📄 ${f.name} <small style="color:#666">(${f.format||'truetype'})</small> <a style="color:#e74c3c;cursor:pointer" onclick="removeFont(${i})">✕</a>`).join('<br>'):'<span style="color:#555">尚未上传自定义字体</span>';
}
function removeFont(i){
  if(!confirm('删除该字体？')) return;
  DATA.theme.customFonts.splice(i,1);
  setData(DATA);
  applyTheme();
  renderFontList();
  renderAdminMain('appearance');
}

function saveTheme(){setData(DATA);toast('✅ 外观已保存');}
function exportTheme(){
  const b=new Blob([JSON.stringify(DATA.theme,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='theme.json';a.click();
  toast('✅ 外观已导出');
}

  DATA.exhibitions.push({id:'ex'+Date.now(),title:t,tags:(document.getElementById('newExTags').value||'').split(/[,，]/).map(s=>s.trim()).filter(Boolean),statement:document.getElementById('newExStmt').value||'暂无策展陈述',groups:[],views:0,style:{boardColor:'#002fa7',titleFont:'',bodyFont:''}});
  setData(DATA);renderAdminMain('exhibitions');renderHome();toast('✅ 展览已添加');
}
function delEx(id){if(!confirm('删除该展览及其所有作品？'))return;DATA.exhibitions=DATA.exhibitions.filter(e=>e.id!==id);setData(DATA);renderAdminMain('exhibitions');renderHome();toast('已删除')}
function editEx(id){
  const ex=DATA.exhibitions.find(e=>e.id===id);
  openModal(`⚙ ${ex.title} 样式设置`,`
    <label>背景板颜色</label>
    <input type="color" id="esBoard" value="${ex.style.boardColor||'#002fa7'}" style="width:80px;height:36px">
    <label>标题字体</label>
    <select id="esTitle">${fontOptions(ex.style.titleFont)}</select>
    <label>正文字体</label>
    <select id="esBody">${fontOptions(ex.style.bodyFont)}</select>
    <div class="modal-actions"><button class="primary" onclick="saveExStyle('${id}')">💾 保存</button></div>
  `);
}
function saveExStyle(id){
  const ex=DATA.exhibitions.find(e=>e.id===id);
  ex.style.boardColor=document.getElementById('esBoard').value;
  ex.style.titleFont=document.getElementById('esTitle').value;
  ex.style.bodyFont=document.getElementById('esBody').value;
  setData(DATA);closeModal();renderAdminMain('exhibitions');renderHome();toast('✅ 样式已保存');
}
function addGroup(exId){
  const title=prompt('组照标题');
  if(!title) return;
  const desc=prompt('组照介绍词（可选）')||'';
  const ex=DATA.exhibitions.find(e=>e.id===exId);
  ex.groups.push({id:'g_'+Date.now(),title,desc,images:[]});
  setData(DATA);renderAdminMain('exhibitions');toast('✅ 组照已创建（可在上传页添加图片）');
}
function delGroup(exId,gId){if(!confirm('删除该组照及其所有图片？'))return;const ex=DATA.exhibitions.find(e=>e.id===exId);ex.groups=ex.groups.filter(g=>g.id!==gId);setData(DATA);renderAdminMain('exhibitions');renderHome();toast('已删除')}

// ============ COLUMNS ============
function addCol(){
  const t=document.getElementById('newColTitle').value.trim();
  if(!t){toast('请输入标题');return}
  DATA.columns.push({id:'c'+Date.now(),title:t,date:document.getElementById('newColDate').value||new Date().toISOString().slice(0,10),body:document.getElementById('newColBody').value||''});
  setData(DATA);renderAdminMain('columns');renderHome();toast('✅ 文章已添加');
}
function delCol(id){if(!confirm('删除？'))return;DATA.columns=DATA.columns.filter(c=>c.id!==id);setData(DATA);renderAdminMain('columns');renderHome();toast('已删除')}

// ============ CURATORS ============
function addCur(){
  const name=document.getElementById('newCurName').value.trim();
  if(!name){toast('请输入姓名');return}
  DATA.curators.push({id:'cur'+Date.now(),name,role:document.getElementById('newCurRole').value||'策展人',bio:document.getElementById('newCurBio').value||''});
  setData(DATA);renderAdminMain('curators');renderHome();toast('✅ 策展人已添加');
}
function delCur(id){if(!confirm('删除该策展人？'))return;DATA.curators=DATA.curators.filter(c=>c.id!==id);setData(DATA);renderAdminMain('curators');renderHome();toast('已删除')}
function editCur(id){
  const c=DATA.curators.find(x=>x.id===id);
  openModal(`✏️ 编辑策展人`,`
    <div style="text-align:center;margin-bottom:12px">
      <div style="width:120px;height:150px;background:#1a1a2e;border-radius:10px;margin:0 auto 10px;display:flex;align-items:center;justify-content:center;overflow:hidden;font-size:28px">${c.photo?`<img src="${c.photo}" style="width:100%;height:100%;object-fit:cover">`:'📷'}</div>
      <button class="secondary" onclick="document.getElementById('curPhotoFile').click()">更换写真</button>
      <input type="file" id="curPhotoFile" accept="image/*" style="display:none">
    </div>
    <label>姓名</label><input id="ecName" value="${c.name}">
    <label>头衔</label><input id="ecRole" value="${c.role}">
    <label>履历</label><textarea id="ecBio" style="min-height:100px">${c.bio}</textarea>
    <div class="modal-actions">
      <button class="danger" onclick="delCur('${id}')">🗑 删除</button>
      <button class="primary" onclick="saveCur('${id}')">💾 保存</button>
    </div>
  `);
  document.getElementById('curPhotoFile').addEventListener('change',function(){
    const f=this.files[0];if(!f) return;
    const r=new FileReader();r.onload=e=>{c.photo=e.target.result;renderAdminMain('curators');editCur(id)};r.readAsDataURL(f);
  });
}
function saveCur(id){
  const c=DATA.curators.find(x=>x.id===id);
  c.name=document.getElementById('ecName').value;
  c.role=document.getElementById('ecRole').value;
  c.bio=document.getElementById('ecBio').value;
  setData(DATA);closeModal();renderAdminMain('curators');renderHome();toast('✅ 已保存');
}

// ============ MODAL ============
function openModal(title,body){
  document.getElementById('modalCard').innerHTML=`<h3>${title}</h3>${body}`;
  document.getElementById('modal').classList.add('active');
}
function closeModal(){document.getElementById('modal').classList.remove('active')}

// ============ SETTINGS ============
function exportData(){
  const b=new Blob([localStorage.getItem(STORE_KEY)||'{}'],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='data.json';a.click();
  toast('✅ 数据已导出');
}
function importData(){
  const input=document.createElement('input');input.type='file';input.accept='.json';
  input.onchange=e=>{
    const f=e.target.files[0];const r=new FileReader();
    r.onload=ev=>{try{DATA=JSON.parse(ev.target.result);setData(DATA);renderHome();renderAdminMain(curTab);toast('✅ 导入成功')}catch(err){toast('❌ 文件格式错误')}};
    r.readAsText(f);
  };
  input.click();
}
function changePass(){
  const np=document.getElementById('newPass').value.trim();
  if(!np||np.length<4){toast('密码至少4位');return}
  const acc=getAccount();acc.password=np;localStorage.setItem(ACC_KEY,JSON.stringify(acc));
  document.getElementById('newPass').value='';
  toast('✅ 密码已修改');
}
function resetViews(){if(!confirm('清零所有浏览量？'))return;DATA.exhibitions.forEach(e=>e.views=0);setData(DATA);renderAdminMain('dashboard');toast('已清零')}

// ============ TOAST ============
function toast(msg){
  const el=document.getElementById('toast');
  el.textContent=msg;el.classList.add('show');
  clearTimeout(toast._t);toast._t=setTimeout(()=>el.classList.remove('show'),2200);
}

// ============ CLICK OUTSIDE ============
document.getElementById('loginOverlay').addEventListener('click',e=>{if(e.target===e.currentTarget)e.target.classList.remove('active')});
document.getElementById('modal').addEventListener('click',e=>{if(e.target===e.currentTarget)closeModal()});
</script>
</body>
</html>
